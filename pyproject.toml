[project]
name = "openadapt"
version = "1.10.2"
description = "OpenAdapt launcher for compiling demonstrated GUI workflows into deterministic, governed execution"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
    {name = "Richard Abrich", email = "richard@openadapt.ai"}
]
keywords = [
    "gui",
    "automation",
    "workflow",
    "verification",
    "desktop",
    "rdp",
    "citrix",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Base install: the CLI plus the flagship demonstration compiler, so
# `pip install openadapt` yields a working `openadapt flow` out of the box.
# All other capabilities (capture, ml, evals, ...) remain opt-in extras.
dependencies = [
    "click>=8.0.0",
    "openadapt-flow[hosted]>=1.25.1,<2.0.0",
]

[project.optional-dependencies]
# Individual packages
browser = [
    # Web recording/replay only. The base launcher stays lightweight for
    # native desktop, RDP, and Citrix users; Chromium remains lazy on first use.
    "playwright>=1.44",
]
# Local human desktop recording. Flow owns the supported capture adapter
# contract; the direct floor prevents an already-installed pre-1.0 Capture
# from satisfying the launcher's public recording path. FFmpeg remains a
# separately provisioned executable, not a Python-package dependency.
capture = [
    "openadapt-capture>=1.0.4,<2.0.0",
    "openadapt-flow[capture]>=1.25.1,<2.0.0",
]
# Replay substrate dependencies stay separate from capture: recording observes
# the human on the local interactive desktop, while replay may target a WAA
# agent, a native app, or a remote framebuffer.
windows = [
    "openadapt-flow[windows]>=1.25.1,<2.0.0",
]
macos = [
    "openadapt-flow[macos]>=1.25.1,<2.0.0; sys_platform == 'darwin'",
]
linux = [
    "openadapt-flow[linux]>=1.25.1,<2.0.0; sys_platform == 'linux'",
]
rdp = [
    "openadapt-flow[rdp]>=1.25.1,<2.0.0",
]
ml = [
    "openadapt-ml>=0.2.0",
]
evals = [
    "openadapt-evals>=0.1.0",
]
viewer = [
    "openadapt-viewer>=0.1.0",
]
grounding = [
    "openadapt-grounding>=0.1.0",
]
retrieval = [
    "openadapt-retrieval>=0.1.0",
]
privacy = [
    "openadapt-flow[privacy]>=1.25.1,<2.0.0",
]
# `flow` now ships in the base install (see `dependencies` above). This
# extra is kept for backward compatibility so `pip install openadapt[flow]`
# and the `all` bundle still resolve.
flow = [
    "openadapt-flow>=1.25.1,<2.0.0",
]
# Bundles
core = [
    "openadapt[capture,ml,evals,viewer]",
]
all = [
    # Cross-platform clients are always safe to resolve. Native bindings remain
    # conditional so `openadapt[all]` never pulls PyObjC onto Linux/Windows or
    # PyGObject onto macOS/Windows.
    "openadapt[browser,core,grounding,retrieval,privacy,flow,windows,rdp]",
    "openadapt[macos]; sys_platform == 'darwin'",
    "openadapt[linux]; sys_platform == 'linux'",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
openadapt = "openadapt.cli:main"

[project.urls]
Homepage = "https://openadapt.ai"
Documentation = "https://docs.openadapt.ai"
Repository = "https://github.com/OpenAdaptAI/openadapt"
"Canonical Engine" = "https://github.com/OpenAdaptAI/openadapt-flow"
"Bug Tracker" = "https://github.com/OpenAdaptAI/openadapt/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openadapt"]

# Keep the public source archive as narrow as the launcher package. Hatch's
# broad default selection otherwise picks up ignored workstation artifacts
# such as `.env`, local databases, screenshots, and model-call caches.
[tool.hatch.build.targets.sdist]
include = [
    "/openadapt",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = [
    "/.cache",
    "/.claude",
    "/.env",
    "/.worktrees",
    "/build",
    "/dist",
    "/docs",
    "/legacy",
    "/openadapt.db",
    "/output.png",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
# Dependencies are reviewed and locked before merge; semantic-release changes
# only the project version. Refresh that editable root in place with a
# dependency-free, offline script, then stage it in the generated version
# commit before the separate publish step builds it.
build_command = """
python scripts/verify_release_lock.py --write
git add uv.lock
"""

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
