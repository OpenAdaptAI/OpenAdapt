# The Desktop dependency audit's tool, locked apart from ../ because it needs
# Python 3.11 or newer: pip-audit pulls filelock through cachecontrol, and the
# filelock releases that fix GHSA-v4x8-3wr5-3wq8 dropped Python 3.10. The
# audit runs on 3.12 only (.github/workflows/desktop-dependency-audit.yml).
[project]
name = "openadapt-ci-audit"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
audit = ["pip-audit>=2.10.1"]

[tool.uv]
package = false
