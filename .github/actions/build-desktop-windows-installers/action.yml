# Build the OpenAdapt Desktop Windows installers (MSI and NSIS) from the
# lockfiles: the frozen engine sidecar, then the Tauri bundles in
# packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle.
#
# Shared by desktop-release.yml (build-windows) and signpath-test-sign.yml so
# the build SignPath test-signs is the build a release ships. Each caller checks
# out the repository, sets up Python 3.12 and runs its own signing preflight
# first; signing, verification and publishing stay in the callers.
#
# No caches: callers are release and signing workflows, and a cache written by
# an earlier run could put unreviewed bytes into a signed installer.
name: Build Desktop Windows installers
description: Build the OpenAdapt Desktop MSI and NSIS installers from the lockfiles, with no caches.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        # Release builds restore no cache; see the note at the top.
        package-manager-cache: false

    - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: "1.97.0"
        targets: x86_64-pc-windows-msvc

    - name: Install locked Tauri CLI
      working-directory: packages/desktop
      shell: pwsh
      run: npm ci --ignore-scripts

    - name: Build engine sidecar for Tauri externalBin
      working-directory: packages/desktop
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check uv==0.11.29
        python scripts/sync_frozen_dependencies.py
        uv run --locked python scripts/build_frozen_engine.py
        uv run --locked python scripts/verify_build_artifact.py sidecar
        uv run --locked python scripts/smoke_test_frozen_flow.py
        mkdir -p src-tauri/binaries
        cp dist/openadapt-engine.exe \
          src-tauri/binaries/openadapt-engine-x86_64-pc-windows-msvc.exe

    - name: Build MSI and NSIS installers
      working-directory: packages/desktop
      shell: pwsh
      run: >-
        npm run tauri build --
        --bundles msi,nsis
        --target x86_64-pc-windows-msvc
