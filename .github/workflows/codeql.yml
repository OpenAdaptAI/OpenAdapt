name: CodeQL

# SOC 2: SAST (OA-C-24). Static analysis on push/PR to main + weekly.
on:
  push:
    branches: [main]
  # Every pull request, whatever its base, plus each merge queue group.
  pull_request:
    # Drafts run nothing (each job checks `draft`); marking one ready runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Cancel a pull request's earlier run when it gets a new commit; a run on
# main that has started always finishes.
concurrency:
  # A pull request's newer push cancels its older run. Pushes to main share
  # one group: one analysis runs at a time, and the newest waiting push
  # replaces an older waiting one, since its tree contains the older one's
  # code. Nothing is cancelled once it runs. In 20.7 hours on 2026-11-20,
  # 35 merges each analyzed all three languages, for 563 runner-minutes;
  # replayed under this rule, 29 runs would have used about 458. No
  # release reads this workflow. After a burst of merges, a cancelled
  # CodeQL run on main means it was replaced, not that main is red. The merge queue, schedules and dispatches each get a
  # group of their own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers packages/desktop and packages/flow/chrome_extension;
        # rust covers the Tauri shell under packages/desktop.
        language: ["python", "javascript-typescript", "rust"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Pull requests and queue groups analyze a language only when they change
      # its files. The job still runs and reports, so the required check never
      # waits. Pushes to main and the weekly scan always analyze everything.
      - name: Decide whether this change needs the analysis
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="HEAD^1" ;;
            merge_group)
              base="$GROUP_BASE_SHA"
              git fetch --no-tags --depth=1 origin "$base" || { echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
              ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed="$(git diff --name-only "$base" HEAD)"
          case "$LANGUAGE" in
            python) pattern='\.py$|^\.github/codeql/|^\.github/workflows/codeql\.yml$' ;;
            # Desktop UI/shell plus the optional Flow Chrome extension (MV3 JS).
            javascript-typescript) pattern='^packages/desktop/|^packages/flow/chrome_extension/|^\.github/codeql/|^\.github/workflows/codeql\.yml$' ;;
            rust) pattern='^packages/desktop/|^\.github/codeql/|^\.github/workflows/codeql\.yml$' ;;
            *) pattern='^packages/desktop/|^\.github/codeql/|^\.github/workflows/codeql\.yml$' ;;
          esac
          if grep -Eq "$pattern" <<<"$changed"; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - name: Initialize CodeQL
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.language != 'python' && './.github/codeql/desktop.yml' || '' }}
      - name: Perform CodeQL Analysis
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
