# OpenAdapt Desktop (packages/desktop): audit the locked Python, npm, and Rust
# dependencies. Ported from openadapt-desktop's dependency-review.yml. It runs
# on Desktop changes and weekly, because a new advisory can land against an
# unchanged lock.
name: Desktop dependency audit

on:
  pull_request:
    # Drafts run nothing (each job checks `draft`); marking one ready runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "packages/desktop/**"
      - ".github/workflows/desktop-dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - ".github/workflows/desktop-dependency-audit.yml"
  schedule:
    - cron: "19 11 * * 1"
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its older run. Every other event (the
  # merge queue, main, schedules, dispatches) gets a group of its own, so it
  # is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/desktop

jobs:
  python:
    name: Python locked dependencies
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            packages/desktop/uv.lock
            .github/ci-tools/audit/uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Export the exact locked dependency set
        run: >-
          uv export --quiet --locked --all-extras --no-emit-project
          --output-file "${{ runner.temp }}/openadapt-desktop-requirements.txt"
      - name: Audit Python dependencies
        run: >-
          uv run --locked --project "$GITHUB_WORKSPACE/.github/ci-tools/audit"
          --only-group audit pip-audit
          --require-hashes --disable-pip --progress-spinner off
          --requirement "${{ runner.temp }}/openadapt-desktop-requirements.txt"

  python-macos-intel:
    name: Python locked dependencies (macOS Intel)
    # Post-merge tier: main, the weekly run and dispatches. A pull request
    # runs the Linux audit; Intel macOS resolves the same lock with different
    # markers, so a gap shows up on main or in the weekly run, before release.
    if: github.event_name != 'pull_request'
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            packages/desktop/uv.lock
            .github/ci-tools/audit/uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Export the exact Intel macOS dependency set
        run: >-
          uv export --quiet --locked --all-extras --no-emit-project
          --output-file "${{ runner.temp }}/openadapt-desktop-requirements.txt"
      - name: Audit Intel macOS Python dependencies
        run: >-
          uv run --locked --project "$GITHUB_WORKSPACE/.github/ci-tools/audit"
          --only-group audit pip-audit
          --require-hashes --disable-pip --progress-spinner off
          --requirement "${{ runner.temp }}/openadapt-desktop-requirements.txt"

  npm:
    name: npm locked dependencies
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json
      - name: Refuse high-severity npm advisories
        run: npm audit --audit-level=high --package-lock-only

  rust:
    name: Rust locked dependencies
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # A cached binary skips compiling cargo-audit from source on every run.
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.1
      - name: Install the RustSec scanner
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
