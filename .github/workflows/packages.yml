# DIAGNOSTIC BRANCH ONLY. Never merge. Reproduces the macOS fork stall.
name: Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-stall:
    name: fork stall (${{ matrix.arm }}, py${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { arm: tk-fork, python-version: "3.11" }
          - { arm: tk-fork-keepfds, python-version: "3.11" }
          - { arm: tk-spawn, python-version: "3.11" }
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: packages/desktop/uv.lock
      - name: Install locked dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra build
      - name: Run the arm under the supervisor
        run: |
          sw_vers
          /usr/bin/python3 ../../.github/diag/supervisor.py "${{ matrix.arm }}" "$RUNNER_TEMP/fork-stall" "$PWD/.venv/bin/python" ../../.github/diag/fork_arm.py "${{ matrix.arm }}" 400000
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-stall-${{ matrix.arm }}
          path: ${{ runner.temp }}/fork-stall
          if-no-files-found: ignore
