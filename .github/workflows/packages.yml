# DIAGNOSTIC BRANCH ONLY. Never merge. Reproduces the macOS fork stall.
name: Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fork-stall:
    name: fork stall (${{ matrix.arm }} ${{ matrix.copy }}, py${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arm: bare, copy: a, python-version: "3.12" }
          - { arm: bare, copy: b, python-version: "3.11" }
          - { arm: imports, copy: a, python-version: "3.12" }
          - { arm: imports, copy: b, python-version: "3.11" }
          - { arm: imports, copy: c, python-version: "3.12" }
          - { arm: spawn, copy: a, python-version: "3.12" }
          - { arm: spawn, copy: b, python-version: "3.11" }
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: packages/desktop/uv.lock
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra build
      - name: Machine and sampling check
        run: |
          sw_vers
          uname -a
          sysctl -n hw.ncpu
          /bin/sleep 30 &
          /usr/bin/sample $! 1 -mayDie | head -20
      - name: Run the arm under the supervisor
        run: |
          /usr/bin/python3 ../../.github/diag/supervisor.py "$PWD/.venv/bin/python" "${{ matrix.arm }}" 400000 "$RUNNER_TEMP/fork-stall"
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-stall-${{ matrix.arm }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/fork-stall
          if-no-files-found: ignore
