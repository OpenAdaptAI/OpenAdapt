# Per-package CI for the packages/ tree.
#
# The root workflow (main.yml) only runs the launcher's own tests. This
# workflow runs each package's own suite from the monorepo checkout, so a
# change under packages/ cannot land untested. A `scope` job applies the
# packages/** path filter; package jobs that the change does not touch are
# skipped, and the single `packages-gate` job always reports, so it can be a
# required check without blocking unrelated PRs.
#
# Dependencies point one way: openadapt-types (the pydantic-only contracts) is
# the leaf, openadapt-flow depends on it and re-exports it as
# openadapt_flow.contracts, and the MCP server lives in openadapt_flow.agent
# with openadapt-agent as its compatibility shim. Every job that installs the
# in-tree Flow also installs the in-tree types, so a types change re-runs Flow
# and the agent shim, and the types job installs nothing else.
#
# Flow is split: lint, four unit shards, and a critical job that runs the
# golden free-path task (VERIFIED read-back against an independent oracle),
# the record/compile/replay E2E, and the read-back and zero-model-call unit
# files by name, failing if any of them is skipped.
#
# openadapt-capture (packages/capture) keeps its own uv.lock, so its jobs run
# `uv sync --locked` against it: Linux on Python 3.10 (with the native AT-SPI
# smoke on ubuntu-22.04), 3.11 and 3.12; macOS and Windows unit suites, plus
# the live recorder tests on Windows; lint; and the release contract. Flow's
# `capture` extra installs the in-tree capture, so a capture change also
# re-runs Flow.
#
# openadapt-privacy (packages/privacy) keeps its own uv.lock and runs
# `uv sync --locked` against it: its suite without Presidio on
# Python 3.10, 3.11 and 3.12, the full suite with Presidio and the spaCy model
# on 3.12, and lint plus the release contract (changelog matches the version,
# `uv build`, archive boundary).
#
# @openadapt/program-graph (packages/program-graph), the program map Desktop,
# Cloud and the website render, runs its unit and DOM snapshot tests, the
# typecheck, the ESM build (which refuses any runtime import beyond React) and
# a vendored copy's checksum verification.
#
# OpenAdapt Desktop (packages/desktop) runs two reusable workflows:
# desktop-test.yml (the Python engine on Linux for a PR, plus macOS and Windows
# on main, and the bundled-Flow qualification contract) and desktop-build.yml
# (frontend, Python distribution, frozen sidecar, and Tauri installers). Their
# jobs are in packages-gate like every other package's.
name: Packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push supersedes its older run. Runs on main are
  # never cancelled: desktop-release.yml needs every main commit's own result.
  group: packages-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  scope:
    name: scope (packages/** filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flow: ${{ steps.classify.outputs.flow }}
      types: ${{ steps.classify.outputs.types }}
      agent: ${{ steps.classify.outputs.agent }}
      capture: ${{ steps.classify.outputs.capture }}
      privacy: ${{ steps.classify.outputs.privacy }}
      desktop: ${{ steps.classify.outputs.desktop }}
      program_graph: ${{ steps.classify.outputs.program_graph }}
      weight: ${{ steps.classify.outputs.weight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all() {
            for pkg in flow types agent capture privacy desktop program_graph weight; do echo "$pkg=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }
          case "$EVENT_NAME" in
            workflow_dispatch) all ;;
            pull_request) base="HEAD^1" ;;  # the PR merge commit's first parent is the base tip
            *)
              if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ] \
                || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                all
              fi
              base="$BEFORE_SHA"
              ;;
          esac
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$(grep -c . <<<"$changed" || true) changed paths"
          # A here-string, not a pipe: with pipefail, `printf | grep -q` can
          # fail on SIGPIPE and silently report "not changed".
          hit() { if grep -Eq "$1" <<<"$changed"; then echo true; else echo false; fi; }
          wf='^\.github/workflows/packages\.yml$'
          # Flow depends on the in-tree types, and its `capture` extra is tested
          # against the in-tree capture.
          flow="$(hit "^packages/(flow|capture|types)/|$wf")"
          # The types package is the leaf: only its own files re-run it.
          types="$(hit "^packages/types/|$wf")"
          # The agent shim is tested against the in-tree core.
          agent="$(hit "^packages/(agent|flow|types)/|$wf")"
          capture="$(hit "^packages/capture/|$wf")"
          privacy="$(hit "^packages/privacy/|$wf")"
          desktop="$(hit "^packages/desktop/|^\.github/workflows/desktop-[a-z-]+\.yml$|$wf")"
          # The program map checks its schema against Flow's copy.
          program_graph="$(hit "^packages/program-graph/|^packages/flow/schemas/program-graph-v2\.json$|^\.github/workflows/release-program-graph\.yml$|$wf")"
          # Any package's metadata, or the launcher's, can change what an
          # install pulls in.
          weight="$(hit "^packages/|^pyproject\.toml$|^openadapt/|^hatch_build\.py$|^scripts/install_weight/|$wf")"
          {
            echo "flow=$flow"
            echo "types=$types"
            echo "agent=$agent"
            echo "capture=$capture"
            echo "privacy=$privacy"
            echo "desktop=$desktop"
            echo "program_graph=$program_graph"
            echo "weight=$weight"
          } | tee -a "$GITHUB_OUTPUT"

  types:
    name: types (py${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package alone
        run: pip install -e ".[dev]" 'ruff==0.17.0' 'build==1.6.1'
      - name: Confirm the leaf package installs without Flow
        run: |
          python - <<'PY'
          import importlib.util, pathlib, openadapt_types
          here = pathlib.Path(openadapt_types.__file__).resolve().as_posix()
          assert "packages/types/openadapt_types" in here, here
          for name in ("openadapt_flow", "cv2", "onnxruntime"):
              assert importlib.util.find_spec(name) is None, f"{name} is installed"
          print("openadapt_types from", here)
          PY
      - name: Ruff
        run: ruff check openadapt_types tests scripts
      - name: Test
        run: pytest -q
      - name: Build and verify the public distribution boundary
        if: matrix.python-version == '3.12'
        run: |
          python -m build . --outdir dist
          python scripts/check_source_boundary.py --require-dist

  agent:
    name: agent shim (py${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the shim against the in-tree core
        run: pip install -e ../types -e '../flow[agent]' -e ".[dev]"
      - name: Confirm the in-tree Flow is the one installed
        run: |
          python - <<'PY'
          import pathlib, openadapt_flow
          here = pathlib.Path(openadapt_flow.__file__).resolve()
          assert "packages/flow" in here.as_posix(), here
          print("openadapt_flow from", here)
          PY
      - name: Ruff
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q

  flow-lint:
    name: flow core lint (ruff, mypy)
    needs: scope
    if: needs.scope.outputs.flow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/flow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ../types -e '.[dev]'
      - name: Release consistency and public artifact inventory
        # Flow's own gate: version sync across project, module and lock, and
        # every public data/config asset listed in public-artifacts.json.
        run: python scripts/check_release_consistency.py
      - name: Ruff lint
        run: ruff check openadapt_flow
      - name: Ruff format check
        run: ruff format --check openadapt_flow tests
      - name: Mypy
        run: mypy
      - name: Mypy (strict, safety path only)
        run: |
          mypy \
            --ignore-missing-imports --follow-imports=silent \
            --check-untyped-defs --no-implicit-optional --strict-equality \
            --warn-redundant-casts --warn-unused-ignores \
            --disallow-untyped-decorators --extra-checks \
            openadapt_flow/identity_signals.py \
            openadapt_flow/policy.py \
            openadapt_flow/qualification.py \
            openadapt_flow/runtime/identity.py \
            openadapt_flow/runtime/identity_template.py \
            openadapt_flow/runtime/identity_vlm.py \
            openadapt_flow/runtime/replayer.py \
            openadapt_flow/runtime/resolver.py \
            openadapt_flow/submit_binding.py \
            openadapt_flow/runtime/effects/effect.py \
            openadapt_flow/runtime/effects/adapter.py \
            openadapt_flow/runtime/effects/auth.py \
            openadapt_flow/runtime/effects/smart_auth.py \
            openadapt_flow/runtime/effects/compensation.py \
            openadapt_flow/runtime/effects/document_arrival.py \
            openadapt_flow/runtime/effects/document_hash.py \
            openadapt_flow/runtime/effects/email_delivery.py \
            openadapt_flow/runtime/effects/fhir.py \
            openadapt_flow/runtime/effects/fresh_session.py \
            openadapt_flow/runtime/effects/file_arrival.py \
            openadapt_flow/runtime/effects/graphql.py \
            openadapt_flow/runtime/effects/onscreen.py \
            openadapt_flow/runtime/effects/rest.py \
            openadapt_flow/runtime/effects/sql.py \
            openadapt_flow/runtime/effects/ui_readback.py \
            openadapt_flow/compiler/compile.py \
            openadapt_flow/compiler/codegen.py \
            openadapt_flow/compiler/annotate.py \
            openadapt_flow/compiler/effect_mining.py \
            openadapt_flow/compiler/induction.py \
            openadapt_flow/compiler/loop_authoring.py

  flow-unit:
    name: flow core unit (shard ${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.flow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: packages/flow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ../types -e ../capture -e '.[dev,capture,agent]'
      - name: Install Harness² for the integration tests
        # Not on PyPI. Pinned to the commit openadapt_flow.integrations.harness2
        # is written against; it has no runtime dependencies.
        run: >-
          pip install --no-deps
          'harness2 @ git+https://github.com/google-research/harness2@1cfe254e8d25b15f37048c3730134686abe60335'
      - name: Verify the in-tree openadapt-capture imports headless
        run: |
          python - <<'PY'
          import pathlib, openadapt_capture
          here = pathlib.Path(openadapt_capture.__file__).resolve().as_posix()
          assert "packages/capture/openadapt_capture" in here, here
          print("openadapt_capture from", here)
          PY
      - name: Resolve Playwright version
        id: pw
        run: |
          python -c "import importlib.metadata as m; print('version=' + m.version('playwright'))" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install and launch Playwright browser
        timeout-minutes: 12
        run: >-
          python scripts/install_playwright_browser.py
          --attempts 2 --attempt-timeout-seconds 270
      - name: Select this shard's test files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Same scope as Flow's own PR gate: everything outside tests/e2e,
          # minus the installer self-test and the long qualification campaign.
          # Files are dealt round-robin from a sorted list, so every file lands
          # in exactly one shard.
          find tests -name 'test_*.py' -not -path 'tests/e2e/*' \
            -not -path 'tests/test_install_playwright_browser.py' \
            -not -path 'tests/test_qualification_gate_campaign.py' \
            | LC_ALL=C sort | awk -v s="$SHARD" 'NR % 4 == s % 4' > "$RUNNER_TEMP/shard.txt"
          wc -l < "$RUNNER_TEMP/shard.txt"
      - name: Test
        run: |
          set -euo pipefail
          mkdir -p runs
          mapfile -t files < "$RUNNER_TEMP/shard.txt"
          pytest -vv --durations=20 --basetemp=runs/ci "${files[@]}"

  flow-critical:
    name: flow core critical (golden VERIFIED, zero model calls)
    needs: scope
    if: needs.scope.outputs.flow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: packages/flow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ../types -e '.[dev,agent]'
      - name: Resolve Playwright version
        id: pw
        run: |
          python -c "import importlib.metadata as m; print('version=' + m.version('playwright'))" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install and launch Playwright browser
        timeout-minutes: 12
        run: >-
          python scripts/install_playwright_browser.py
          --attempts 2 --attempt-timeout-seconds 270
      - name: Golden task (free path -> VERIFIED)
        run: |
          mkdir -p runs
          pytest -vv --durations=20 tests/e2e/test_free_path_e2e.py \
            --basetemp=runs/ci-golden --junitxml=runs/golden-junit.xml
      - name: Record / compile / replay E2E
        run: |
          pytest -vv --durations=20 tests/e2e/test_record_compile_replay.py \
            --basetemp=runs/ci-rcr --junitxml=runs/rcr-junit.xml
      - name: Read-back and zero-model-call tests, by name
        run: |
          pytest -vv --durations=20 \
            tests/test_replayer_readback.py \
            tests/test_readback_authoring.py \
            tests/test_run_receipt.py \
            tests/test_drift_oracle.py \
            tests/test_effect_e2e_harness.py \
            tests/test_admitted_composition_runtime.py \
            tests/e2e/test_structural_action.py \
            tests/e2e/test_compile_agent_e2e.py \
            tests/e2e/test_code_action_e2e.py \
            tests/e2e/test_mcp_teach_e2e.py \
            tests/test_agent_guard.py \
            tests/e2e/test_agent_guard_e2e.py \
            --basetemp=runs/ci-critical --junitxml=runs/critical-junit.xml
      - name: Fail if any critical test was skipped or none ran
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          bad = False
          for name in ("golden", "rcr", "critical"):
              root = ET.parse(f"runs/{name}-junit.xml").getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              tests = sum(int(s.get("tests", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              print(f"{name}: {tests} tests, {skipped} skipped")
              if tests == 0 or skipped:
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  capture-linux:
    name: capture (linux, py${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.capture == 'true'
    # Exercise the oldest Python on pre-2.80 GLib without adding a matrix leg.
    runs-on: ${{ matrix.python-version == '3.10' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/capture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          set -uo pipefail
          # The runner's azure.archive.ubuntu.com mirror fails intermittently
          # and once hung this step for over an hour. Prefer the canonical
          # archive, retry, and keep the step bounded.
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          update_ok=""
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              update_ok=1
              break
            fi
            echo "::warning::apt-get update failed (attempt ${attempt}/3); retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$update_ok" ]; then
            echo "::error::apt-get update failed three times; the Ubuntu mirror is unreachable"
            exit 1
          fi
          set -e
          sudo apt-get install -y ffmpeg libportaudio2
      - name: Install native AT-SPI build and smoke dependencies
        if: matrix.python-version == '3.10'
        run: |
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core dbus-x11 xvfb
          pkg-config --modversion glib-2.0 gobject-introspection-1.0
      - name: Install
        run: uv sync --locked --extra dev ${{ matrix.python-version == '3.10' && '--extra linux' || '' }}
      - name: Verify native AT-SPI dependency compatibility
        if: matrix.python-version == '3.10'
        env:
          OPENADAPT_TEST_LINUX_ATSPI: "1"
          NO_AT_BRIDGE: "0"
        run: dbus-run-session -- xvfb-run -a uv run --no-sync pytest tests/test_linux_atspi_integration.py -v --timeout=60
      - name: Test
        timeout-minutes: 15
        run: uv run --no-sync pytest tests/ -v --timeout=120

  # macOS: the unit suite, including the subprocess control contract. The
  # 'slow' live-recording tests stay skipped: synthetic input injection needs
  # Accessibility permission a hosted runner cannot grant.
  capture-macos:
    name: capture (macos, py3.12)
    needs: scope
    if: needs.scope.outputs.capture == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/capture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install external video tools
        run: brew install ffmpeg
      - name: Install
        run: uv sync --locked --extra dev
      - name: Unit tests
        timeout-minutes: 15
        run: uv run --no-sync pytest tests/ -v -m "not slow" --timeout=120

  # Windows is the primary live-recording platform: the unit suite, then the
  # live Recorder integration tests (tests/test_performance.py, marked 'slow')
  # that run the real multiprocessing pipeline. Hosted runners are
  # non-interactive, so injected input never reaches native hooks; the
  # listener-dependent tests skip via OPENADAPT_CI_NO_INPUT_INJECTION.
  capture-windows:
    name: capture (windows, py3.12)
    needs: scope
    if: needs.scope.outputs.capture == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/capture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install external video tools
        run: |
          choco install ffmpeg -y --no-progress
          Get-Command ffmpeg -ErrorAction Stop
      - name: Install
        run: uv sync --locked --extra dev
      - name: Unit tests
        timeout-minutes: 15
        run: uv run --no-sync pytest tests/ -v -m "not slow" --timeout=120
      - name: Live recorder integration tests
        timeout-minutes: 20
        env:
          OPENADAPT_CI_NO_INPUT_INJECTION: "1"
        run: uv run --no-sync pytest tests/test_performance.py -v -m slow --timeout=300

  capture-contract:
    name: capture lint and release contract
    needs: scope
    if: needs.scope.outputs.capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/capture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --no-sync ruff check openadapt_capture/
      - name: Verify the maintained changelog
        # --skip-tags: the monorepo's v* tags are the launcher's. Capture's
        # release tags through v1.2.2 live in OpenAdaptAI/openadapt-capture.
        run: uv run --no-sync python scripts/check_changelog.py --skip-tags
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify release archive boundaries
        run: |
          uv run --no-sync python scripts/verify_distribution.py dist/*
          uv run --no-sync python scripts/check_source_boundary.py --require-dist

  privacy:
    name: privacy (py${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.privacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/privacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev
      - name: Test (without Presidio)
        run: uv run --no-sync pytest tests/ -v --ignore=tests/test_presidio.py

  privacy-presidio:
    name: privacy (py3.12, Presidio)
    needs: scope
    if: needs.scope.outputs.privacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/privacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install with Presidio and the spaCy model
        run: |
          uv sync --locked --python 3.12 --extra dev --extra presidio
          uv pip install "pip>=25.3"
          uv run --no-sync python -m spacy download en_core_web_sm
      - name: Test
        run: uv run --no-sync pytest tests/ -v

  privacy-contract:
    name: privacy lint and release contract
    needs: scope
    if: needs.scope.outputs.privacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/privacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --locked --python 3.12 --extra dev
      - name: Ruff
        run: uv run --no-sync ruff check openadapt_privacy tests scripts
      - name: Changelog matches the version and the release workflow
        run: uv run --no-sync pytest tests/test_release_config.py -v
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify release archive boundaries
        run: uv run --no-sync python scripts/check_source_boundary.py --require-dist

  desktop-test:
    name: desktop test
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-test.yml

  desktop-build:
    name: desktop build
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-build.yml

  program-graph:
    name: program-graph (test, build, vendor)
    needs: scope
    if: needs.scope.outputs.program_graph == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/program-graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/program-graph/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Unit and DOM snapshot tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build and verify a vendored copy
        run: |
          set -euo pipefail
          node scripts/vendor.mjs --out "$RUNNER_TEMP/program-graph"
          node "$RUNNER_TEMP/program-graph/check.mjs"

  install-weight:
    # Each package is published on its own and must stay cheap to install:
    # build every in-tree wheel, install each one alone, and fail on a
    # distribution outside its allow list, a forbidden one (privacy never
    # pulls Flow, Desktop, OpenCV, onnxruntime or torch), or a size budget.
    # Budgets: scripts/install_weight/budgets.json. Numbers and how to change
    # a budget: docs/monorepo/INSTALL_WEIGHT.md.
    name: install weight (each package alone)
    needs: scope
    if: needs.scope.outputs.weight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.29"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Build each package, install it alone, enforce its budget
        run: >-
          uv run --no-project --python 3.12
          scripts/install_weight/weigh.py check --json install-weight.json
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-weight
          path: install-weight.json
          if-no-files-found: ignore

  capture-core-record:
    # A plain `capture record` and `capture info` must work without any extra.
    # The script pip-installs the package with no extras in a container, records
    # a real click and typed text under Xvfb, and reads them back.
    name: capture record and read without extras (Linux, Xvfb)
    needs: scope
    if: needs.scope.outputs.capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record and read with the core-only install
        run: CONTAINER_ENGINE=docker bash packages/capture/scripts/linux_xvfb_quickstart.sh

  # desktop-release.yml publishes a merged Desktop version that is not on PyPI
  # yet, so a change that should ship must bump the version in its own pull
  # request. This fails a feat, fix or perf without a bump (and prints the
  # prepare_release.py command), and checks a bump's version sources and
  # changelog section.
  desktop-release-intent:
    name: desktop release intent
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a version bump for a change that should ship
        # The checkout is the pull request's merge commit: HEAD^1 is the base
        # tip. HEAD (the merge) is the head: its versions and changelog are what
        # would land, and HEAD^1..HEAD lists exactly the pull request's commits.
        run: python scripts/check_release_intent.py --base HEAD^1 --head HEAD

  packages-gate:
    name: packages-gate
    needs:
      - scope
      - types
      - agent
      - flow-lint
      - flow-unit
      - flow-critical
      - capture-linux
      - capture-macos
      - capture-windows
      - capture-contract
      - privacy
      - privacy-presidio
      - privacy-contract
      - desktop-test
      - desktop-build
      - program-graph
      - install-weight
      - capture-core-record
      - desktop-release-intent
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected package job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if needs["scope"]["result"] != "success":
              bad["scope"] = needs["scope"]["result"]
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          sys.exit(1 if bad else 0)
          PY
