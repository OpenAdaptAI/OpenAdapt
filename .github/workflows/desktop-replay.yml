# Disposable diagnostic evidence only. Never merge or release this branch.
name: Windows FileIO byte diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fileio:
    name: Raw descriptors and FileIO (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Observe physical bytes and descriptor modes
        shell: pwsh
        run: >-
          python scripts/ci/probes/windows_fdopen_diagnostic.py
          --output "$env:RUNNER_TEMP/windows-fdopen-diagnostic.json"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-fileio-diagnostic
          path: |
            ${{ runner.temp }}/windows-fdopen-diagnostic.json
            scripts/ci/probes/windows_fdopen_diagnostic.py
          if-no-files-found: error
          retention-days: 14
