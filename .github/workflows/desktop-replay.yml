# Disposable measurement branch only. Not a qualification or merge candidate.
name: Native value extent diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Measure stored native value, WM extent and UIA wire
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: packages/flow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          cache-dependency-glob: packages/flow/uv.lock
          cache-suffix: windows-replay
      - name: Install from the existing lock
        run: >-
          python ../../scripts/ci/locked_install.py --lock .github/ci-tools:win-agent
          --lock 'packages/flow[dev]'
          --editable packages/types --editable packages/flow
      - name: Collect independent stored value and provider measurements
        timeout-minutes: 6
        env:
          OAFLOW_WINDOWS_HOSTED_E2E: "1"
          OAFLOW_NATIVE_VALUE_EXTENT_EVIDENCE: ${{ runner.temp }}/native-value-diagnostic/evidence.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-value-diagnostic"
          {
            git rev-parse HEAD
            git rev-parse "HEAD^{tree}"
            printf 'expected=%s run=%s attempt=%s\n' "$EXPECTED_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } | tee "$RUNNER_TEMP/native-value-diagnostic/source.log"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          pytest -v -rs -p no:cacheprovider --basetemp="$RUNNER_TEMP/native-value-diagnostic/cases" \
            tests/e2e/test_native_value_extent_diagnostic.py::test_native_value_extent_diagnostic \
            --junitxml="$RUNNER_TEMP/native-value-diagnostic/junit.xml" 2>&1 | tee "$RUNNER_TEMP/native-value-diagnostic/pytest.log"
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["RUNNER_TEMP"]) / "native-value-diagnostic"
          cases = list(ET.parse(root / "junit.xml").getroot().iter("testcase"))
          assert len(cases) == 1 and cases[0].get("name") == "test_native_value_extent_diagnostic"
          assert not any(cases[0].find(tag) is not None for tag in ("skipped", "failure", "error"))
          proof = json.loads((root / "evidence.json").read_text())
          assert proof["source_head"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert proof["collected"] is True
          assert len(proof["measurements"]) == 7
          assert proof["rows_before"] == proof["rows_after"]
          assert proof["agent_terminated"] is True and proof["fixture_terminated"] is True
          print("Measurements collected; no value completeness qualification is claimed")
          PYTHON
      - name: Keep the diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-value-extent-diagnostic
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-value-diagnostic/*.json
            ${{ runner.temp }}/native-value-diagnostic/*.xml
            ${{ runner.temp }}/native-value-diagnostic/*.log
            ${{ runner.temp }}/native-value-diagnostic/cases/**/*.json
            ${{ runner.temp }}/native-value-diagnostic/cases/**/*.png
            ${{ runner.temp }}/native-value-diagnostic/cases/**/agent.log
            ${{ runner.temp }}/native-value-diagnostic/cases/**/patient_notes.ps1
            ${{ runner.temp }}/native-value-diagnostic/cases/**/patients.db
