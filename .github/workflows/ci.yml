name: CI

# The one required check, `ci`, for every pull request (and the merge queue
# when it is on). It runs the fast lane and finishes in under ten minutes:
#
# - Packages (packages.yml) on its pull-request tier: lint, the oldest-Python
#   syntax check, and the Linux tests of the packages the change touches. The
#   slow end-to-end and browser-heavy tests, the other operating systems and
#   the installer builds run on main and in the nightly run (nightly.yml).
# - The launcher's own lint and tests (main.yml).
# - A smoke test of every package, whatever changed: each installs from its
#   lock, imports and starts (scripts/ci/smoke.py).
#
# `ci` passes when every job above passed or was not selected; it is skipped
# (which counts as passing) when they all passed. Until branch
# protection names `ci`, the old required names, `run-ci (ubuntu-latest,
# 3.12)` and `packages-gate`, report the same result from this workflow.
# CodeQL keeps reporting `Analyze (python)` from codeql.yml.

on:
  pull_request:
    # Drafts run nothing (each job checks `draft`); marking one ready runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

# A pull request's newer push cancels its older run. The called workflows see
# this run's context, so main.yml keys its group `CI-<pr>`; group names are
# case-insensitive, so this one must not be `ci-<pr>`.
concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: packages
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/packages.yml

  launcher:
    name: launcher
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/main.yml

  smoke:
    name: smoke (every package installs, imports and starts)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            packages/*/uv.lock
          cache-suffix: smoke
      - run: uv python install 3.12
      - name: Every lock installs on its oldest Python, on each platform
        # The lane runs Python 3.12 on Linux; this catches a lock whose pins
        # have no file for 3.10 or for macOS or Windows before main does.
        run: python3 scripts/ci/check_lock_wheels.py
      - name: Install, import and start each package from its lock
        env:
          UV_PYTHON: "3.12"
          # The tray's input and icon backends, as its own CI job sets them:
          # a headless runner has no X display.
          PYNPUT_BACKEND: dummy
          PYSTRAY_BACKEND: dummy
        run: python3 scripts/ci/smoke.py

  # The required checks. Each one needs the three jobs above and runs only
  # when one of them did not pass (or on a draft), to fail the check. When all
  # three pass it is skipped, and GitHub counts a skipped required check as
  # passing, so a green run needs no runner here. On 2026-11-03 these jobs
  # did no work but each waited 15 to 30 minutes for a runner, after
  # packages-gate and then after `ci`. Inside Packages, packages-gate still
  # runs and fails the `packages` result when a selected job was skipped.
  # `always()` keeps them evaluated after a failure or a cancel.
  ci:
    name: ci
    needs: [packages, launcher, smoke]
    if: always() && (github.event.pull_request.draft == true || needs.packages.result != 'success' || needs.launcher.result != 'success' || needs.smoke.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft runs nothing, so every need above is skipped. Fail rather
      # than let a draft show green: it can't merge, and marking it ready
      # (ready_for_review) starts a full run.
      - name: Fail on a draft pull request
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::draft PR: CI runs when marked ready for review."
          exit 1
      - name: Require every job to pass or be unselected
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          bad = {}
          for name, need in json.loads(os.environ["RESULTS"]).items():
              print(f"{name}: {need['result']}")
              if need["result"] != "success":
                  bad[name] = need["result"]
          if bad:
              print(f"failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

  # The names branch protection requires today, with the same rule as `ci`.
  # Remove both once it requires `ci` instead (.github/workflows/README.md has
  # the command).
  legacy-run-ci:
    name: run-ci (ubuntu-latest, 3.12)
    needs: [packages, launcher, smoke]
    if: always() && (github.event.pull_request.draft == true || needs.packages.result != 'success' || needs.launcher.result != 'success' || needs.smoke.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft runs nothing, so every need above is skipped. Fail rather
      # than let a draft show green: it can't merge, and marking it ready
      # (ready_for_review) starts a full run.
      - name: Fail on a draft pull request
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::draft PR: CI runs when marked ready for review."
          exit 1
      - name: Require every job to pass or be unselected
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          bad = {}
          for name, need in json.loads(os.environ["RESULTS"]).items():
              print(f"{name}: {need['result']}")
              if need["result"] != "success":
                  bad[name] = need["result"]
          if bad:
              print(f"failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

  legacy-packages-gate:
    name: packages-gate
    needs: [packages, launcher, smoke]
    if: always() && (github.event.pull_request.draft == true || needs.packages.result != 'success' || needs.launcher.result != 'success' || needs.smoke.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft runs nothing, so every need above is skipped. Fail rather
      # than let a draft show green: it can't merge, and marking it ready
      # (ready_for_review) starts a full run.
      - name: Fail on a draft pull request
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::draft PR: CI runs when marked ready for review."
          exit 1
      - name: Require every job to pass or be unselected
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          bad = {}
          for name, need in json.loads(os.environ["RESULTS"]).items():
              print(f"{name}: {need['result']}")
              if need["result"] != "success":
                  bad[name] = need["result"]
          if bad:
              print(f"failed: {bad}")
          sys.exit(1 if bad else 0)
          PY

  flow-mcp-compat:
    name: flow MCP compatibility (${{ matrix.mcp }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mcp: ["1.28.0", "2.3.0"]
    defaults:
      run:
        working-directory: packages/flow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Resolve declared source dependencies with the exact genuine SDK
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --index-url https://pypi.org/simple --only-binary :all: \
            --editable ../types --editable '.[agent,browser,langgraph]' \
            'mcp==${{ matrix.mcp }}' 'hypothesis>=6.100' pytest pytest-timeout
          .venv/bin/python -c "import importlib.metadata as m; assert m.version('mcp') == '${{ matrix.mcp }}'; print({n:m.version(n) for n in ('mcp','hypothesis')})"
          .venv/bin/python -c "from pathlib import Path; import openadapt_flow, openadapt_types; assert Path(openadapt_flow.__file__).resolve().parent == Path('openadapt_flow').resolve(); assert Path(openadapt_types.__file__).resolve().parent == Path('../types/openadapt_types').resolve()"
      - name: Genuine public context, argument binding, refusal and zero-effect controls
        run: |
          mkdir -p runs
          .venv/bin/python -m pytest -q \
            tests/test_mcp_sdk_compatibility.py::test_genuine_sdk_registers_and_dispatches_generated_tool \
            tests/test_mcp_sdk_compatibility.py::test_sdk_argument_validation_refuses_before_any_effect \
            tests/test_generated_parameter_binding.py::test_actual_compiled_mcp_keeps_fixed_task_and_every_input \
            tests/test_generated_parameter_binding.py::test_compiled_emitter_preserves_supported_identifier_grammar \
            tests/test_backend_parity_refusals.py::test_a_desktop_mcp_tool_runs_the_governed_cli_with_every_param_intact \
            --junitxml=runs/mcp-compat.xml
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('runs/mcp-compat.xml').getroot().iter('testcase'))
          assert len(cases) == 54
          assert not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: flow-mcp-${{ matrix.mcp }}
          path: packages/flow/runs/mcp-compat.xml
          if-no-files-found: error
