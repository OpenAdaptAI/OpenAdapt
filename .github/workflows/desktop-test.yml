# OpenAdapt Desktop (packages/desktop): the Python engine tests.
#
# Called from packages.yml when a change touches packages/desktop, so its jobs
# feed the required packages-gate. Pull requests and the merge queue run one
# Linux lane (Python 3.12). Every push to main and every dispatch run Linux,
# macOS and Windows on Python 3.11 and 3.12 (Windows checks files out with CRLF
# and has its own paths). desktop-release.yml releases only from a push-to-main
# run whose desktop jobs passed, so no release is built without the full
# matrix.
# Ported from openadapt-desktop's test.yml.
name: Desktop test

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/desktop

jobs:
  test-python:
    name: Python engine tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # PR and queue tiers: Linux, one Python. Main and dispatch run macOS
        # and Windows (CRLF checkouts, Windows paths) on both Pythons.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["3.12"]' || '["3.11", "3.12"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: packages/desktop/uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked ruff check openadapt_desktop/ tests/ scripts/
      - name: Syntax at the oldest supported Python (3.11)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        # The PR lane runs Python 3.12 only, so syntax that needs a newer
        # Python than requires-python allows (a 3.12 f-string, say) passed it
        # and failed only after merge. Check every file at the minimum.
        # Bytecode goes to a temp directory, so later archive checks see a
        # clean tree.
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache-oldest
        run: |
          uv run --locked ruff check --isolated --select E9 --target-version py311 .
          uv run --no-project --python 3.11 python -m compileall -q -x '(^|/)(\.venv|node_modules|build|dist)/' .

      - name: Run tests
        run: uv run --locked pytest tests/ -v

  qualification-contract:
    name: Qualification contract (bundled Flow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: packages/desktop/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Desktop and the exact bundled Flow runtime
        run: uv sync --locked --extra dev --extra build

      # The Tray client is in this tree (packages/tray), so the test runs
      # against the client from the same commit. packages.yml runs this test
      # too when only the tray changes.
      - name: Exercise the Desktop and Tray IPC contract
        env:
          OPENADAPT_TRAY_SOURCE: ../tray/src
        run: uv run --locked pytest tests/test_tray_integration.py -v

      - name: Exercise qualification safety contracts
        run: >-
          uv run --locked pytest
          tests/test_engine/test_qualification.py
          tests/test_engine/test_qualification_capabilities.py
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_first_supervised_replay_refuses_state_change_before_flow
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_first_supervised_replay_refuses_a_stale_exact_bundle_binding
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_first_supervised_replay_refuses_a_changed_execution_target
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_first_supervised_replay_runs_an_exact_reviewed_read_only_bundle
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_fresh_first_compile_creates_review_and_reaches_supervised_replay
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_uncertain_first_replay_requires_reconciliation_before_retry
          tests/test_engine/test_dispatch.py::TestLibraryCommands::test_completed_first_workflow_allows_exact_environment_on_draft_descendant
          -v

      # Unit tests fake the Flow bridge, so a flag Desktop sends that its
      # bundled Flow doesn't know passes them all and fails every real run.
      # Parse each command line Desktop builds with the bundled Flow's parser.
      - name: Exercise the Desktop and Flow command-line contract
        run: >-
          uv run --locked pytest
          tests/test_flow_command_contract.py
          tests/test_dependency_compat.py
          -v

      # The capture floor is only checkable where the bundled Flow runtime is
      # installed: Flow's own metadata declares it, and converting a
      # demonstrated modifier chord needs both libraries. These assertions skip
      # in the plain test job, so name the file here explicitly.
      - name: Exercise the capture/Flow producer contract
        run: >-
          uv run --locked pytest
          tests/test_capture_runtime_contract.py
          tests/test_build_frozen_engine.py::test_bundled_capture_floor_comes_from_the_frozen_flow_runtime
          -v

      # Desktop must accept the same openadapt-types range as the bundled
      # Flow, or installing Desktop next to the launcher downgrades one of
      # them. Flow's range is only readable where Flow is installed.
      - name: Check the shared types range against the bundled Flow
        run: uv run --locked pytest tests/test_dependency_compat.py -v
