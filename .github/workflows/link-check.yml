name: Link check

# Links in the repository's Markdown, including every package README.
# Pull requests check local files and anchors offline, so an external outage
# can't block a merge, and only in the Markdown files they change, so a link
# broken elsewhere doesn't fail unrelated work. Every push to main checks all
# files, which catches a link broken by a moved or deleted target. External targets break without a commit here, so they
# are checked on a schedule. A failure lists each broken link in the job
# summary. Frozen history (legacy/, CHANGELOG.md) and .github/ are skipped.
on:
  pull_request:
    # Drafts run nothing (each job checks `draft`); marking one ready runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 10 * * 1" # Every Monday 10 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run. Every other event (the
  # merge queue, main, schedules, dispatches) gets a group of its own, so it
  # is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LYCHEE_PATHS: >-
    --exclude-path '(^|/)(legacy|node_modules|\.venv|growth-worktrees|\.claude)/'
    --exclude-path 'CHANGELOG\.md$'
    --exclude-path '/\.github/'
    './**/*.md'

jobs:
  internal:
    name: Internal links and anchors
    if: github.event.pull_request.draft != true && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Choose the files to check
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] \
            || git diff --name-only HEAD^1 HEAD | grep -qx '.github/workflows/link-check.yml'; then
            echo "paths=$LYCHEE_PATHS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.md' \
            | grep -Ev '(^|/)(legacy|node_modules|\.venv|growth-worktrees|\.claude|\.github)/|(^|/)CHANGELOG\.md$' \
            | sed "s/.*/'&'/" | tr '\n' ' ' || true)"
          echo "paths=$files" >> "$GITHUB_OUTPUT"
          echo "Checking: ${files:-nothing}"

      - name: Check local links and anchors
        if: steps.targets.outputs.paths != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            ${{ steps.targets.outputs.paths }}
          jobSummary: false

  external:
    name: External links
    if: github.event.pull_request.draft != true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 403 and 429 count as reachable: some sites refuse automated clients,
      # and GitHub rate-limits. app. and api.openadapt.ai need a session.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 3
            --accept '200..=299,403,429'
            --exclude '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)'
            --exclude '^https://(app|api)\.openadapt\.ai'
            --exclude 'linkedin\.com'
            ${{ env.LYCHEE_PATHS }}
