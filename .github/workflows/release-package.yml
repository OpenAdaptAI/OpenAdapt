# Publish ONE package from packages/ to PyPI.
#
# release-and-publish.yml publishes only the root `openadapt` launcher. Each
# package publishes separately from here, through its own GitHub environment
# and PyPI Trusted Publisher:
#
#   package  PyPI project     environment
#   flow     openadapt-flow   pypi-flow
#   types    openadapt-types  pypi-types
#   agent    openadapt-agent  pypi-agent
#   capture  openadapt-capture  pypi-capture
#   privacy  openadapt-privacy  pypi-privacy
#   tray     openadapt-tray     pypi-tray
#
# Manual dispatch only: there is no tag or push trigger, so nothing here runs
# unless someone starts it. openadapt-desktop is not here: desktop-release.yml
# publishes its wheel, sdist and native installers as one release. It refuses any ref other than the current tip of
# main, a version that does not match the package's pyproject.toml, and a
# version that already exists on PyPI. The publish job holds the only
# id-token permission and runs in the package's environment, so the
# environment's protection rules gate the upload.
#
# Each release is tagged <pypi-project>-v<version> (openadapt-flow-v2.2.0),
# never v*, which belongs to the launcher. The tag rulesets for each package
# pattern let only the openadapt-release App create those tags and make them
# immutable; preflight-github refuses to start if those rules or immutable
# releases are not in force. Only after the PyPI upload succeeds does
# publish-github, as the openadapt-release App, create the annotated tag at
# the dispatched commit and an immutable GitHub Release. The release carries
# the same sdist and wheel, with notes from packages/<package>/CHANGELOG.md.
name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under packages/"
        required: true
        type: choice
        options: [flow, types, agent, capture, privacy, tray]
      version:
        description: "Version to publish; must equal packages/<package>/pyproject.toml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-package-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ inputs.package }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      project: ${{ steps.check.outputs.project }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Require the tip of main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Package releases run only from refs/heads/main, not $REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the dispatched commit, version and PyPI state
        id: check
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "main moved after dispatch; re-run on the current tip." >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, sys, tomllib, urllib.error, urllib.request
          pkg, version = os.environ["PACKAGE"], os.environ["VERSION"]
          with open(f"packages/{pkg}/pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          expected = {
              "flow": "openadapt-flow",
              "types": "openadapt-types",
              "agent": "openadapt-agent",
              "capture": "openadapt-capture",
              "privacy": "openadapt-privacy",
              "tray": "openadapt-tray",
          }[pkg]
          if project["name"] != expected:
              sys.exit(f"packages/{pkg} is {project['name']!r}, expected {expected!r}")
          if project["version"] != version:
              sys.exit(f"input version {version} != pyproject version {project['version']}")
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/{expected}/{version}/json", timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              sys.exit(f"{expected} {version} is already on PyPI")
          import re
          changelog = open(f"packages/{pkg}/CHANGELOG.md", encoding="utf-8").read()
          headers = re.findall(r"^## v([^ ]+) \(\d{4}-\d{2}-\d{2}\)$", changelog, re.MULTILINE)
          if not headers or headers[0] != version:
              actual = headers[0] if headers else "missing"
              sys.exit(f"packages/{pkg}/CHANGELOG.md must start with v{version}; found v{actual}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"project={expected}\n")
              out.write(f"tag={expected}-v{version}\n")
          print(f"releasing {expected} {version}")
          PY
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Tag $tag already exists." >&2
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "Could not check whether tag $tag exists (git exit $status)." >&2
            exit 1
          fi
      - name: Build sdist and wheel
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python -m pip install 'build==1.6.1' 'twine==7.0.0'
          if [ "$PACKAGE" = flow ]; then
            # Flow commits a reviewed list of artifact paths, not their
            # hashes, so parallel pull requests don't collide on hash rows.
            # The hashes are pinned here, on the exact commit being built,
            # and the archives must match them below.
            (cd packages/flow && python scripts/check_release_consistency.py --stamp-release-inventory)
          fi
          python -m build "packages/$PACKAGE" --outdir dist
          python -m twine check --strict dist/*
          if [ "$PACKAGE" = flow ]; then
            # Open-core, license and artifact-provenance boundary of the two
            # files the publish job uploads.
            (cd packages/flow && python scripts/check_release_consistency.py --validate-dist-dir ../../dist)
          fi
          if [ "$PACKAGE" = capture ]; then
            # Capture's release contract: notes for this version, and archives
            # that carry only the public source boundary.
            python packages/capture/scripts/check_changelog.py --skip-tags
            python packages/capture/scripts/verify_distribution.py dist/*
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/
          if-no-files-found: error

  preflight-github:
    name: check release hosting for ${{ needs.build.outputs.tag }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-metadata: read
      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "Release hosting checks require the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require immutable releases and closed rules for the package tag
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "OpenAdaptAI/OpenAdapt" ]; then
            echo "Package releases require OpenAdaptAI/OpenAdapt." >&2
            exit 1
          fi
          python scripts/verify_release_hosting.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"

  publish:
    name: publish ${{ needs.build.outputs.project }} ${{ inputs.version }}
    needs: [build, preflight-github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-${{ inputs.package }}
      url: https://pypi.org/project/${{ needs.build.outputs.project }}/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-github:
    name: tag and release ${{ needs.build.outputs.tag }}
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "Tagging and GitHub publication require the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi

      - name: Checkout the exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/

      - name: Install the pinned GitHub release verification CLI
        id: release-cli
        run: |
          set -euo pipefail
          archive=/tmp/gh_2.98.0_linux_amd64.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp
          cli=/tmp/gh_2.98.0_linux_amd64/bin/gh
          test -x "$cli"
          "$cli" version
          echo "path=$cli" >> "$GITHUB_OUTPUT"

      - name: Create the annotated package tag at the published commit
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PROJECT: ${{ needs.build.outputs.project }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "${PROJECT}-v${VERSION}"
          python scripts/verify_release_hosting.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"

          # main may have moved since the upload; the tag still names the
          # exact commit that was built and published, which main contains.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "The published commit $GITHUB_SHA is not on main." >&2
            exit 1
          fi

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # A rerun after a partial failure: keep the tag only if it
            # already names the published commit.
            tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG names $tag_commit, not the published $GITHUB_SHA." >&2
              exit 1
            fi
            exit 0
          fi
          git -c user.name="openadapt-release[bot]" \
            -c user.email="openadapt-release[bot]@users.noreply.github.com" \
            tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$PROJECT $VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish the immutable GitHub Release with the exact artifacts
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          GH_CLI: ${{ steps.release-cli.outputs.path }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PROJECT: ${{ needs.build.outputs.project }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          EXPECTED_AUTHOR: openadapt-release[bot]
        run: |
          set -euo pipefail
          python - "$PACKAGE" "$VERSION" > /tmp/release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          package, version = sys.argv[1], sys.argv[2]
          changelog = Path(f"packages/{package}/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## v{re.escape(version)} \(\d{{4}}-\d{{2}}-\d{{2}}\)\n"
              rf"(?P<body>.*?)(?=^## v|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"packages/{package}/CHANGELOG.md has no notes for v{version}.")
          print(match.group("body").strip())
          PY
          test -s /tmp/release-notes.md

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "The remote tag $RELEASE_TAG does not name the published commit." >&2
            exit 1
          fi

          # GET /releases/tags/{tag} never returns a draft, so find the release
          # in the full list, which includes drafts for this token.
          fetch_release() {
            "$GH_CLI" api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > /tmp/github-releases.json || { echo 500; return; }
            python - "$RELEASE_TAG" <<'PY'
          import json
          import sys

          tag = sys.argv[1]
          pages = json.load(open("/tmp/github-releases.json", encoding="utf-8"))
          found = [r for page in pages for r in page if r.get("tag_name") == tag]
          if len(found) > 1:
              print(409)
          elif found:
              json.dump(found[0], open("/tmp/github-release.json", "w", encoding="utf-8"))
              print(200)
          else:
              print(404)
          PY
          }
          verify() {
            python scripts/verify_github_release.py \
              --metadata /tmp/github-release.json \
              --tag "$RELEASE_TAG" \
              --author "$EXPECTED_AUTHOR" \
              --expected-dir dist \
              "$@"
          }

          release_status="$(fetch_release)"
          if [ "$release_status" = "404" ]; then
            "$GH_CLI" release create "$RELEASE_TAG" \
              dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --latest=false \
              --title "$PROJECT $VERSION" \
              --notes-file /tmp/release-notes.md
            release_status="$(fetch_release)"
          fi
          if [ "$release_status" != "200" ]; then
            echo "GitHub returned HTTP $release_status for the exact release." >&2
            exit 1
          fi

          release_state="$(python -c \
            'import json; print("draft" if json.load(open("/tmp/github-release.json"))["draft"] else "published")')"
          if [ "$release_state" = "draft" ]; then
            verify --state draft --allow-missing --missing-output /tmp/missing-release-assets.txt
            while IFS= read -r missing_asset; do
              "$GH_CLI" release upload "$RELEASE_TAG" "dist/$missing_asset" \
                --repo "$GITHUB_REPOSITORY"
            done < /tmp/missing-release-assets.txt

            release_status="$(fetch_release)"
            test "$release_status" = "200"
            mkdir /tmp/draft-release-assets
            "$GH_CLI" release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/draft-release-assets
            verify --downloaded-dir /tmp/draft-release-assets --state draft

            "$GH_CLI" release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
            release_status="$(fetch_release)"
            if [ "$release_status" != "200" ]; then
              echo "GitHub returned HTTP $release_status after publication." >&2
              exit 1
            fi
          fi

          mkdir /tmp/github-release-assets
          "$GH_CLI" release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/github-release-assets
          verify --downloaded-dir /tmp/github-release-assets

          for attempt in $(seq 1 12); do
            if "$GH_CLI" release verify "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --format json > /tmp/github-release-attestation.json; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "GitHub did not produce a valid release attestation in time." >&2
              exit 1
            fi
            sleep 10
          done
          for artifact in dist/*.whl dist/*.tar.gz; do
            "$GH_CLI" release verify-asset "$RELEASE_TAG" "$artifact" \
              --repo "$GITHUB_REPOSITORY"
          done
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
