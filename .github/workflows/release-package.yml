# Publish the packages under packages/ to PyPI: types, flow, agent, capture,
# privacy and tray. Each publishes through its own GitHub environment and PyPI
# Trusted Publisher:
#
#   package  PyPI project       environment
#   flow     openadapt-flow     pypi-flow
#   types    openadapt-types    pypi-types
#   agent    openadapt-agent    pypi-agent
#   capture  openadapt-capture  pypi-capture
#   privacy  openadapt-privacy  pypi-privacy
#   tray     openadapt-tray     pypi-tray
#
# One release pattern, Desktop's (desktop-release.yml): merging a reviewed
# version bump is the authorization. A run starts after each Packages run on
# main, every three hours, or on a dispatch (the fallback, for the same
# commit). The plan job (scripts/ci/release_plan.py) publishes a package only
# when the newest commit on main that changed it has a green push run with the
# package's jobs run and passed, its version is new on PyPI and higher than
# every version there, no tag names it yet, and its CHANGELOG.md starts with
# exactly that version. Each package's environment protection still gates its
# upload. The release builds main's tip, where the package is unchanged since
# that commit. openadapt-desktop is not here: desktop-release.yml publishes its
# wheel, sdist and native installers as one release.
#
# A version is never republished. A half-published one is resumed, not
# rebuilt: re-run the failed jobs of the run that published it, which reuses
# its built bytes. If PyPI serves the version and its tag exists but the
# GitHub release is not published, dispatch with `resume`: it rebuilds
# nothing, fetches the bytes PyPI serves (checked against PyPI's digests) and
# publishes the release at the tag's commit.
#
# Each release is tagged <pypi-project>-v<version> (openadapt-flow-v2.2.0),
# never v*, which belongs to the launcher. The tag rulesets for each package
# pattern let only the openadapt-release App create those tags and make them
# immutable; preflight-github refuses to start if those rules or immutable
# releases are not in force. Only after PyPI serves exactly the built files
# does publish-github, as the openadapt-release App, create the annotated tag
# at the built commit and an immutable GitHub Release. The release carries the
# same sdist and wheel, with notes from packages/<package>/CHANGELOG.md.
#
# Each package's legs (build, preflight, publish, tag) run in their own matrix
# entry, so one package's failure does not hold another's release.
name: Release package

on:
  workflow_run:
    workflows: [Packages]
    types: [completed]
    branches: [main]
  # A safety net: releases a commit whose Packages run passed on a re-run,
  # when no later Packages run completes to start a release.
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under packages/, or all"
        required: true
        default: all
        type: choice
        options: [all, flow, types, agent, capture, privacy, tray]
      resume:
        description: "Publish the GitHub release of a version PyPI serves and a tag names"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One transaction owns each tag and release. Every Packages run on main starts
# a run here, most of them no-ops; without a queue, each new pending run would
# cancel the release waiting before it.
concurrency:
  group: release-package
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: plan (which packages to publish)
    # A Packages run that did not pass cannot make anything green.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads each package's newest green run on main.
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Package releases run only from refs/heads/main, not $REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Decide each package's release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE: ${{ inputs.package || 'all' }}
          RESUME: ${{ inputs.resume && 'true' || 'false' }}
          # The commit the checkout above holds: main's tip for this run.
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--package "$PACKAGE" --tip "$RELEASE_COMMIT" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = workflow_dispatch ]; then args+=(--dispatch); fi
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          python scripts/ci/release_plan.py "${args[@]}"

  build:
    name: build ${{ matrix.project }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.release != '[]' && needs.plan.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.release) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # build and twine come from the CI tools lock, with hashes. No cache:
      # release builds start clean.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Build sdist and wheel
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          python scripts/ci/locked_install.py --lock .github/ci-tools:release
          if [ "$PACKAGE" = flow ]; then
            # Flow commits a reviewed list of artifact paths, not their
            # hashes, so parallel pull requests don't collide on hash rows.
            # The hashes are pinned here, on the exact commit being built,
            # and the archives must match them below.
            (cd packages/flow && python scripts/check_release_consistency.py --stamp-release-inventory)
          fi
          python -m build "packages/$PACKAGE" --outdir dist
          python -m twine check --strict dist/*
          if [ "$PACKAGE" = flow ]; then
            # Open-core, license and artifact-provenance boundary of the two
            # files the publish job uploads.
            (cd packages/flow && python scripts/check_release_consistency.py --validate-dist-dir ../../dist)
          fi
          if [ "$PACKAGE" = capture ]; then
            # Capture's release contract: notes for this version, and archives
            # that carry only the public source boundary.
            python packages/capture/scripts/check_changelog.py --skip-tags
            python packages/capture/scripts/verify_distribution.py dist/*
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package }}
          path: dist/
          if-no-files-found: error

  preflight-github:
    name: check release hosting for ${{ matrix.tag }}
    needs: [plan, build]
    # Each leg stands alone: a release leg needs its own build's files (the
    # download below), not every package's build.
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-metadata: read
      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "Release hosting checks require the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Require this package's build
        if: matrix.action == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require immutable releases and closed rules for the package tag
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "OpenAdaptAI/OpenAdapt" ]; then
            echo "Package releases require OpenAdaptAI/OpenAdapt." >&2
            exit 1
          fi
          python scripts/verify_release_hosting.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"
      - name: Record that this package's hosting checks passed
        run: echo "${{ matrix.tag }}" > preflight.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-${{ matrix.package }}
          path: preflight.txt
          if-no-files-found: error

  publish:
    name: publish ${{ matrix.project }} ${{ matrix.version }}
    needs: [plan, preflight-github]
    if: ${{ !cancelled() && needs.plan.outputs.release != '[]' && needs.plan.outputs.release != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.release) }}
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.project }}/${{ matrix.version }}/
    permissions:
      id-token: write
    steps:
      # Only this package's own build and hosting checks gate its upload.
      - name: Require this package's hosting checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preflight-${{ matrix.package }}
          path: preflight/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-github:
    name: tag and release ${{ matrix.tag }}
    needs: [plan, preflight-github, publish]
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read

      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "Tagging and GitHub publication require the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi

      - name: Checkout the exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Require this package's hosting checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preflight-${{ matrix.package }}
          path: preflight/

      - name: Take the built files
        if: matrix.action == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.package }}
          path: dist/

      # A release tags only what PyPI serves: its own upload must have
      # finished with exactly these bytes. A resume builds nothing and takes
      # the bytes PyPI serves, checked against PyPI's digests.
      - name: Require PyPI to serve exactly these files
        if: matrix.action == 'release'
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ matrix.version }}
        run: python scripts/ci/pypi_dist.py compare "$PROJECT" "$VERSION" dist

      - name: Fetch the files PyPI serves
        if: matrix.action == 'resume'
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ matrix.version }}
        run: python scripts/ci/pypi_dist.py fetch "$PROJECT" "$VERSION" dist

      - name: Install the pinned GitHub release verification CLI
        id: release-cli
        run: |
          set -euo pipefail
          archive=/tmp/gh_2.98.0_linux_amd64.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp
          cli=/tmp/gh_2.98.0_linux_amd64/bin/gh
          test -x "$cli"
          "$cli" version
          echo "path=$cli" >> "$GITHUB_OUTPUT"

      - name: Create the annotated package tag at the published commit
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ matrix.tag }}
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ matrix.version }}
          RELEASE_COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "${PROJECT}-v${VERSION}"
          python scripts/verify_release_hosting.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"

          # main may have moved since the upload; the tag still names the
          # exact commit that was built and published, which main contains.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "The published commit $RELEASE_COMMIT is not on main." >&2
            exit 1
          fi

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # A rerun after a partial failure: keep the tag only if it
            # already names the published commit.
            tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
              echo "Tag $RELEASE_TAG names $tag_commit, not the published $RELEASE_COMMIT." >&2
              exit 1
            fi
            exit 0
          fi
          git -c user.name="openadapt-release[bot]" \
            -c user.email="openadapt-release[bot]@users.noreply.github.com" \
            tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "$PROJECT $VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish the immutable GitHub Release with the exact artifacts
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          GH_CLI: ${{ steps.release-cli.outputs.path }}
          RELEASE_TAG: ${{ matrix.tag }}
          PROJECT: ${{ matrix.project }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          RELEASE_COMMIT: ${{ matrix.commit }}
          EXPECTED_AUTHOR: openadapt-release[bot]
        run: |
          set -euo pipefail
          python - "$PACKAGE" "$VERSION" > /tmp/release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          package, version = sys.argv[1], sys.argv[2]
          changelog = Path(f"packages/{package}/CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## v{re.escape(version)} \(\d{{4}}-\d{{2}}-\d{{2}}\)\n"
              rf"(?P<body>.*?)(?=^## v|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"packages/{package}/CHANGELOG.md has no notes for v{version}.")
          print(match.group("body").strip())
          PY
          test -s /tmp/release-notes.md

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "The remote tag $RELEASE_TAG does not name the published commit." >&2
            exit 1
          fi

          # GET /releases/tags/{tag} never returns a draft, so find the release
          # in the full list, which includes drafts for this token.
          fetch_release() {
            "$GH_CLI" api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > /tmp/github-releases.json || { echo 500; return; }
            python - "$RELEASE_TAG" <<'PY'
          import json
          import sys

          tag = sys.argv[1]
          pages = json.load(open("/tmp/github-releases.json", encoding="utf-8"))
          found = [r for page in pages for r in page if r.get("tag_name") == tag]
          if len(found) > 1:
              print(409)
          elif found:
              json.dump(found[0], open("/tmp/github-release.json", "w", encoding="utf-8"))
              print(200)
          else:
              print(404)
          PY
          }
          verify() {
            python scripts/verify_github_release.py \
              --metadata /tmp/github-release.json \
              --tag "$RELEASE_TAG" \
              --author "$EXPECTED_AUTHOR" \
              --expected-dir dist \
              "$@"
          }

          release_status="$(fetch_release)"
          if [ "$release_status" = "404" ]; then
            "$GH_CLI" release create "$RELEASE_TAG" \
              dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --latest=false \
              --title "$PROJECT $VERSION" \
              --notes-file /tmp/release-notes.md
            release_status="$(fetch_release)"
          fi
          if [ "$release_status" != "200" ]; then
            echo "GitHub returned HTTP $release_status for the exact release." >&2
            exit 1
          fi

          release_state="$(python -c \
            'import json; print("draft" if json.load(open("/tmp/github-release.json"))["draft"] else "published")')"
          if [ "$release_state" = "draft" ]; then
            verify --state draft --allow-missing --missing-output /tmp/missing-release-assets.txt
            while IFS= read -r missing_asset; do
              "$GH_CLI" release upload "$RELEASE_TAG" "dist/$missing_asset" \
                --repo "$GITHUB_REPOSITORY"
            done < /tmp/missing-release-assets.txt

            release_status="$(fetch_release)"
            test "$release_status" = "200"
            mkdir /tmp/draft-release-assets
            "$GH_CLI" release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/draft-release-assets
            verify --downloaded-dir /tmp/draft-release-assets --state draft

            "$GH_CLI" release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
            release_status="$(fetch_release)"
            if [ "$release_status" != "200" ]; then
              echo "GitHub returned HTTP $release_status after publication." >&2
              exit 1
            fi
          fi

          mkdir /tmp/github-release-assets
          "$GH_CLI" release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/github-release-assets
          verify --downloaded-dir /tmp/github-release-assets

          for attempt in $(seq 1 12); do
            if "$GH_CLI" release verify "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --format json > /tmp/github-release-attestation.json; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "GitHub did not produce a valid release attestation in time." >&2
              exit 1
            fi
            sleep 10
          done
          for artifact in dist/*.whl dist/*.tar.gz; do
            "$GH_CLI" release verify-asset "$RELEASE_TAG" "$artifact" \
              --repo "$GITHUB_REPOSITORY"
          done
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
