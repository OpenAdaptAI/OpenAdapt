name: Python CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        # PR tier: one lane, the required run-ci (ubuntu-latest, 3.12). The
        # merge queue and main run every supported Python on Linux and macOS,
        # so nothing reaches main untested on them.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10", "3.11", "3.12"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # PR tier: a change confined to packages/flow, agent, types or desktop
      # is tested by the Packages workflow, so this job reports success without
      # running its suite. The job itself always runs, because a skipped matrix
      # job never reports its required check name. The merge queue and main
      # always run everything.
      - name: Scope (skip the suite for package-only pull requests)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The checkout is the PR merge commit; its first parent is the base tip.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          # Root tests also read each package's README and source policy.
          outside="$(grep -vE '^packages/(flow|agent|types|desktop)/' <<<"$changed" || true)"
          shared="$(grep -E '^packages/[^/]+/(README\.md|source-policy[^/]*)$' <<<"$changed" || true)"
          if [ -n "$outside$shared" ]; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          # Sibling packages are installed explicitly so the
          # cross-package seam tests (tests/test_import_integrity.py and
          # the cmd_serve contract in tests/test_cli_smoke.py) run
          # instead of skipping. Issue #999 shipped because the
          # openadapt-ml seam was never tested in CI; the lazy
          # __getattr__ in openadapt/__init__.py imports from all of
          # these.
          # openadapt-capture and openadapt-privacy are in-tree
          # (packages/capture, packages/privacy), so the seam is tested
          # against the source that will ship.
          pip install -e ".[dev]" -e packages/capture -e packages/privacy openadapt-ml \
            openadapt-evals openadapt-viewer openadapt-grounding \
            openadapt-retrieval

      - name: Lint with ruff
        if: steps.scope.outputs.run == 'true'
        run: |
          ruff check openadapt/
          ruff format --check openadapt/

      - name: Verify package imports
        if: steps.scope.outputs.run == 'true'
        run: |
          python -c "from openadapt.cli import main; print('CLI import OK')"
          python -c "from openadapt.version import __version__; print(f'Version: {__version__}')"

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        run: pytest tests/ -v

      - name: Build release artifacts and reject workstation state
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m build
          python scripts/verify_release_artifacts.py
          tar -tzf dist/*.tar.gz > /tmp/openadapt-sdist-files.txt
          ! grep -E '/(\.env|\.cache/|[^/]+\.db$|output\.png$|\.claude/|\.worktrees/)' /tmp/openadapt-sdist-files.txt
          unzip -l dist/*.whl > /tmp/openadapt-wheel-files.txt
          ! grep -E '(\.env|\.cache/|[^/]+\.db$|output\.png$|\.claude/|\.worktrees/)' /tmp/openadapt-wheel-files.txt

  # pip on Python 3.13 and 3.14 used to skip every current launcher (all
  # capped below 3.13) and silently install openadapt 1.3.0, an unrelated
  # pre-compiler CLI. The launcher now installs on any Python >=3.10 and keeps
  # the engine behind a version marker. This job proves, on the first
  # unsupported interpreters, that the built wheel installs without the engine
  # and that each engine command prints the Python 3.12 install fix.
  unsupported-python-guard:
    # Merge queue and main only (PR tier runs one lane).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the launcher wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # Installing dist/*.whl directly would hide the original bug, which was
      # pip choosing an older release by name. Resolve by name with PyPI in
      # view: if this launcher didn't install here, an old release that allows
      # this Python (1.3.0 did) would win and the version check would fail.
      - name: Resolve openadapt by name and confirm pip picks this launcher
        run: |
          for spec in openadapt 'openadapt[browser]' 'openadapt[capture]'; do
            python -m pip install --dry-run --quiet --find-links dist \
              --report resolution.json "$spec"
            python - "$spec" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          spec = sys.argv[1]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = project["project"]["version"]
          report = json.loads(pathlib.Path("resolution.json").read_text())
          chosen = {
              item["metadata"]["name"]: item["metadata"]["version"]
              for item in report["install"]
          }
          assert chosen.get("openadapt") == expected, (spec, chosen.get("openadapt"))
          for name in ("openadapt-flow", "openadapt-agent"):
              assert name not in chosen, (spec, name, chosen[name])
          print(f"{spec}: pip chose openadapt {expected} with no engine")
          PY
          done

      - name: Install the wheel and confirm it brings no engine
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import pathlib
          import tomllib
          from importlib.metadata import PackageNotFoundError, version

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = project["project"]["version"]
          assert version("openadapt") == expected, version("openadapt")
          for name in ("openadapt-flow", "openadapt-agent"):
              try:
                  found = version(name)
              except PackageNotFoundError:
                  continue
              raise SystemExit(f"{name} {found} must not install on this Python")
          print(f"openadapt {expected} installed alone, as intended")
          PY

      - name: Engine commands print the install fix
        run: |
          for command in "quickstart --break-it" "flow tutorial" "doctor"; do
            read -ra args <<<"$command"
            set +e
            output=$(openadapt "${args[@]}" 2>&1)
            status=$?
            set -e
            echo "$output"
            test "$status" -eq 1
            grep -q "uv tool install --python 3.12 openadapt" <<<"$output"
          done
          help_text=$(openadapt --help)
          grep -q "OpenAdapt needs Python 3.10" <<<"$help_text"

      - name: Run the Python support tests
        run: |
          python -m pip install pytest packaging
          pytest tests/test_python_support.py -v
