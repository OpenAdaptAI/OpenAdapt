# Publish the skills registry: sign the index and release the bundles.
#
# - Manual dispatch only, from the current tip of main. The registry release
#   is tagged registry-<suffix>.
# - build (no secrets) writes each bundle in packages/flow/registry as a
#   reproducible .tar.gz and an index whose entries point at this release's
#   assets, and checks that no bundle holds a private-tier file.
# - sign runs in the protected `registry-signing` environment, the only place
#   the REGISTRY_SIGNING_SEED secret exists. It signs every entry with the
#   registry key (Ed25519ph, the form Rekor accepts) and checks each signature
#   against the public keys shipped in openadapt_flow/registry_keys.json, so a
#   seed that doesn't match a published key fails the run. The TEST key is
#   refused here.
# - publish-github tags the commit with the openadapt-release App and
#   publishes an immutable GitHub Release with the archives and the signed
#   index, then opens a pull request that updates
#   packages/flow/registry/index.json to the signed index.
#
# One-time setup (founder): the registry key. Generate the seed offline, store
# it base64-encoded as REGISTRY_SIGNING_SEED in the `registry-signing`
# environment (required reviewers), set REGISTRY_KEY_ID as an environment
# variable, commit only the public key to registry_keys.json, and add the
# registry-* tag to the release ruleset.
name: Release registry

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "Release tag suffix (the tag is registry-<suffix>), e.g. 2026-10-28"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-registry
  cancel-in-progress: false

jobs:
  build:
    name: build registry-${{ inputs.suffix }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Require the tip of main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Releases run only from refs/heads/main, not $REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag name
        id: check
        env:
          SUFFIX: ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SUFFIX" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]{0,40}$'; then
            echo "The suffix must be letters, digits, dots and dashes." >&2
            exit 1
          fi
          echo "tag=registry-$SUFFIX" >> "$GITHUB_OUTPUT"
      - name: Install the engine
        run: python -m pip install -e packages/types -e packages/flow
      - name: Build the archives and the unsigned index
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          python packages/flow/scripts/build_registry_index.py \
            --archives dist-registry \
            --asset-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --out dist-registry/index.json
          python -m pytest -q packages/flow/tests/test_skills_registry.py::test_no_registry_bundle_in_the_repo_holds_a_private_tier_file
          (cd dist-registry && sha256sum -- *.tar.gz index.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-unsigned
          path: dist-registry/
          if-no-files-found: error

  sign:
    name: sign registry-${{ inputs.suffix }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: registry-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the engine
        run: python -m pip install -e packages/types -e packages/flow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-unsigned
          path: dist-registry/
      - name: Sign every entry with the registry key
        env:
          REGISTRY_SIGNING_SEED: ${{ secrets.REGISTRY_SIGNING_SEED }}
          OPENADAPT_REGISTRY_KEY_ID: ${{ vars.REGISTRY_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          seed="$RUNNER_TEMP/registry-seed"
          printf '%s' "$REGISTRY_SIGNING_SEED" | base64 --decode > "$seed"
          OPENADAPT_REGISTRY_SIGNING_SEED="$seed" \
            python packages/flow/scripts/build_registry_index.py --sign dist-registry/index.json
          rm -f "$seed"
      - name: Check every signature against the published keys (no TEST key)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from openadapt_flow import registry
          index = json.load(open("dist-registry/index.json"))
          keys = registry.trusted_keys(allow_test_key=False)
          for item in index["workflows"]:
              if item["status"] == "planned":
                  continue
              problem = registry.entry_signature_problem(item, keys)
              if problem:
                  raise SystemExit(f"{item['id']}: {problem}")
          print(f"{len(index['workflows'])} entries signed and checked")
          PY
          (cd dist-registry && sha256sum -- *.tar.gz index.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-signed
          path: dist-registry/
          if-no-files-found: error

  publish-github:
    name: tag and release ${{ needs.build.outputs.tag }}
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "Publishing requires the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-signed
          path: dist-registry/
      - name: Tag, release, and propose the signed index
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist-registry && sha256sum --check --strict SHA256SUMS)
          git -c user.name="openadapt-release[bot]" \
            -c user.email="openadapt-release[bot]@users.noreply.github.com" \
            tag -a "$TAG" "$GITHUB_SHA" -m "Skills registry $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" dist-registry/*.tar.gz dist-registry/index.json \
            dist-registry/SHA256SUMS --title "Skills registry $TAG" \
            --notes "Signed skills-registry index and bundles. See packages/flow/registry/README.md."
          branch="registry/$TAG"
          git switch -c "$branch"
          cp dist-registry/index.json packages/flow/registry/index.json
          git -c user.name="openadapt-release[bot]" \
            -c user.email="openadapt-release[bot]@users.noreply.github.com" \
            commit -am "registry: signed index for $TAG"
          git push origin "refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "registry: signed index for $TAG" \
            --body "The signed index the $TAG release published. Bundles are its release assets."
