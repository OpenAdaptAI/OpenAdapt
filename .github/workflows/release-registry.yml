# Publish the skills registry: attest the index and the bundle archives.
#
# There is no signing key. The registry is attested keylessly, as the other
# releases are: actions/attest signs an in-toto statement naming each file's
# sha256 with a short-lived Sigstore certificate for this workflow's identity,
# and records it in Rekor. `openadapt-flow pull` checks that attestation
# against the pinned identity
#   issuer https://token.actions.githubusercontent.com
#   SAN    https://github.com/OpenAdaptAI/OpenAdapt/.github/workflows/release-registry.yml@refs/tags/registry-*
# (openadapt_flow/registry_attest.py), offline, with the trusted root shipped
# in the package.
#
# - tag (manual dispatch from the tip of main) tags the commit registry-<suffix>
#   with the openadapt-release App. The tag push starts this workflow again.
#   A re-stamp (dispatch with restamp: true, or the schedule below) tags it
#   registry-restamp-<YYYYMMDD> instead.
# - check (the tag push, no privileges) installs the engine and runs the
#   registry's repository checks: no private-tier file and only allowlisted
#   files in any bundle.
# - attest (the tag push, the protected release-identity environment, the only
#   job with id-token: write) builds each bundle as a reproducible .tar.gz
#   and an index stamped with issued_at, expires_at (30 days) and serial,
#   attests the index and every archive, and checks its own attestation with
#   the pull verifier. Its Python environment is only the hash-pinned wheels
#   in packages/flow/registry/verify-requirements.txt; the engine is read from
#   the checkout.
# - publish (release-identity) publishes a GitHub Release with the archives,
#   the index and its attestation (index.sigstore.json), and opens a pull
#   request that updates packages/flow/registry/ to them.
#
# - alarm opens, or comments on, one "Registry release failed" issue when a
#   scheduled run or a registry tag's run fails.
#
# The index expires 30 days after it is stamped, so run this at least monthly.
#
# Re-stamps. A registry-restamp-* tag renews the expiry of the index already
# on main and changes nothing else: the attest job builds with --restamp-of
# and refuses an index that differs from the committed attested one in
# anything but issued_at, expires_at, serial and archive URLs. Pulls read the
# index from main, so the re-stamp takes effect when the pull request the
# publish job opens is merged.
#
# The schedule is off. To run re-stamps unattended, uncomment the schedule
# block below. Twice a month keeps every gap under the 30-day lifetime; the
# 1st of each month alone would leave a 31-day gap.
name: Release registry

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "Release tag suffix (the tag is registry-<suffix>), e.g. 2026-10-28. Leave empty for a re-stamp."
        required: false
        default: ""
        type: string
      restamp:
        description: "Re-stamp the attested index on main (tag registry-restamp-<YYYYMMDD>)"
        required: false
        default: false
        type: boolean
  # schedule:
  #   - cron: "17 6 1,16 * *"
  push:
    tags:
      - "registry-*"

permissions:
  contents: read

concurrency:
  group: release-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    if: >-
      github.repository == 'OpenAdaptAI/OpenAdapt'
      && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Require the tip of main and choose the tag
        id: tag
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SUFFIX: ${{ inputs.suffix }}
          RESTAMP: ${{ inputs.restamp }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Releases run only from refs/heads/main, not $REF." >&2
            exit 1
          fi
          if [ "$EVENT" = schedule ] || [ "$RESTAMP" = true ]; then
            if [ -n "$SUFFIX" ]; then
              echo "A re-stamp names its own tag; leave the suffix empty." >&2
              exit 1
            fi
            SUFFIX="restamp-$(date -u +%Y%m%d)"
          else
            case "$SUFFIX" in
              restamp-*)
                echo "registry-restamp-* tags are re-stamps; set restamp: true instead." >&2
                exit 1
                ;;
            esac
          fi
          if ! printf '%s' "$SUFFIX" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]{0,40}$'; then
            echo "The suffix must be letters, digits, dots and dashes." >&2
            exit 1
          fi
          echo "tag=registry-$SUFFIX" >> "$GITHUB_OUTPUT"
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read
      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          if [ "$ACTUAL_APP_SLUG" != openadapt-release ]; then
            echo "Tagging requires the openadapt-release App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.release-app.outputs.token }}
      - name: Tag the commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git -c user.name="openadapt-release[bot]" \
            -c user.email="openadapt-release[bot]@users.noreply.github.com" \
            tag -a "$TAG" "$GITHUB_SHA" -m "Skills registry $TAG"
          git push origin "refs/tags/$TAG"

  check:
    name: check ${{ github.ref_name }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/registry-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the engine
        run: |
          python scripts/ci/locked_install.py --lock 'packages/flow[dev]' \
            --editable packages/types --editable packages/flow
      - name: Check the bundles
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A release never carries a planned entry.
          python packages/flow/scripts/build_registry_index.py --check --release
          case "$TAG" in
            registry-restamp-*)
              scratch="$(mktemp -d)"
              python packages/flow/scripts/build_registry_index.py \
                --archives "$scratch" \
                --asset-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
                --out "$scratch/index.json" \
                --stamp \
                --restamp-of packages/flow/registry/index.json
              ;;
          esac
          python -m pytest -q \
            packages/flow/tests/test_skills_registry.py::test_no_registry_bundle_in_the_repo_holds_a_private_tier_file \
            packages/flow/tests/test_skills_registry.py::test_every_file_of_a_registry_bundle_in_the_repo_is_allowlisted

  attest:
    name: build and attest ${{ github.ref_name }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-identity
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONPATH: packages/flow:packages/types
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require a release App tag, attested on its first run
        env:
          EXPECTED_ACTOR: openadapt-release[bot]
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_ACTOR" != "$EXPECTED_ACTOR" ] \
             || [ "$TRIGGERING_ACTOR" != "$EXPECTED_ACTOR" ]; then
            echo "Attesting requires a tag pushed by $EXPECTED_ACTOR." >&2
            exit 1
          fi
          # A re-run of an old tag's run would stamp the old tree with a fresh
          # serial, a rollback that beats every high-water mark. Tag again
          # from main instead.
          if [ "$RUN_ATTEMPT" != 1 ]; then
            echo "Attesting runs only on a tag's first run, not attempt $RUN_ATTEMPT." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to be on protected main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The registry tag is not contained in protected main." >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install only the hash-pinned verifier wheels
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: \
            -r packages/flow/registry/verify-requirements.txt
      - name: Build the archives and the stamped index
        run: |
          set -euo pipefail
          # A re-stamp may change only the freshness fields and archive URLs.
          restamp=()
          case "$TAG" in
            registry-restamp-*)
              # Only an index the release workflow attested may be re-stamped.
              python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from openadapt_flow import registry_attest

          here = Path("packages/flow/registry")
          signer, subjects = registry_attest.verify_sigstore(
              json.loads((here / "index.sigstore.json").read_text())
          )
          digest = hashlib.sha256((here / "index.json").read_bytes()).hexdigest()
          if subjects.get("index.json") != digest:
              raise SystemExit("the committed attestation does not name the committed index")
          print(f"re-stamping the index attested by {signer}")
          PY
              restamp=(--restamp-of packages/flow/registry/index.json)
              ;;
          esac
          python packages/flow/scripts/build_registry_index.py \
            --archives dist-registry \
            --asset-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --out dist-registry/index.json \
            --stamp ${restamp[@]+"${restamp[@]}"}
      - name: Attest the index and every archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist-registry/index.json
            dist-registry/*.tar.gz
      - name: Keep the attestation beside the index and check it as pull will
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ "$(grep -c . "$BUNDLE")" != 1 ]; then
            echo "Expected one attestation bundle in $BUNDLE." >&2
            exit 1
          fi
          head -n 1 "$BUNDLE" > dist-registry/index.sigstore.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from openadapt_flow import registry, registry_attest

          dist = Path("dist-registry")
          index = json.loads((dist / "index.json").read_text())
          signer, subjects = registry_attest.verify_sigstore(
              json.loads((dist / "index.sigstore.json").read_text())
          )
          index_digest = hashlib.sha256((dist / "index.json").read_bytes()).hexdigest()
          if subjects.get("index.json") != index_digest:
              raise SystemExit("the attestation does not name the index")
          for archive in dist.glob("*.tar.gz"):
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              if subjects.get(archive.name) != digest:
                  raise SystemExit(f"the attestation does not name {archive.name}")
          problem = registry.index_freshness_problem(index)
          if problem:
              raise SystemExit(problem)
          print(f"attested by {signer}: {sorted(subjects)}")
          PY
          (cd dist-registry && sha256sum -- *.tar.gz index.json index.sigstore.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-attested
          path: dist-registry/
          if-no-files-found: error

  publish:
    name: release ${{ github.ref_name }}
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - name: Require the exact release App identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          if [ "$ACTUAL_APP_SLUG" != openadapt-release ]; then
            echo "Publishing requires the openadapt-release App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.release-app.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-attested
          path: dist-registry/
      - name: Release, and propose the attested index
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist-registry && sha256sum --check --strict SHA256SUMS)
          gh release create "$TAG" dist-registry/*.tar.gz dist-registry/index.json \
            dist-registry/index.sigstore.json dist-registry/SHA256SUMS \
            --verify-tag \
            --title "Skills registry $TAG" \
            --notes "Attested skills-registry index and bundles. See packages/flow/registry/README.md."
          branch="registry/$TAG"
          git switch -c "$branch"
          cp dist-registry/index.json dist-registry/index.sigstore.json packages/flow/registry/
          # The attestation is a new file the first time: add both by name.
          git add packages/flow/registry/index.json packages/flow/registry/index.sigstore.json
          git -c user.name="openadapt-release[bot]" \
            -c user.email="openadapt-release[bot]@users.noreply.github.com" \
            commit -m "registry: attested index for $TAG"
          git push origin "refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "registry: attested index for $TAG" \
            --body "The attested index the $TAG release published. Bundles are its release assets."

  alarm:
    name: registry release failed issue
    needs: [tag, check, attest, publish]
    # A missed re-stamp lets the index expire, and every remote pull then
    # fails, so a failed scheduled run or registry tag run opens an issue.
    if: >-
      failure()
      && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/registry-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, or comment on, the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ github.event_name }} ${{ github.ref_name }}
        run: |
          set -euo pipefail
          title="Registry release failed"
          body="The registry release run for ${WHAT} failed: ${RUN_URL}

          The attested index expires 30 days after it is stamped. Until a release succeeds and its pull request is merged, remote pulls fail once it expires."
          number="$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            -q "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
