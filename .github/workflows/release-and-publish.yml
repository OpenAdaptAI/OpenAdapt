name: Release and PyPI Publish

# A release starts from a version, changelog, and lockfile that reached the
# exact protected main branch through review. The release App can create only
# the annotated tag and its matching GitHub Release. It cannot push a version
# commit or any other main commit.
#
# A protected v* tag starts the build, attestation, PyPI Trusted Publishing,
# GitHub Release, and publication-verification jobs. Rerun that exact tag run
# after a partial publication failure. Do not create a recovery tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed version on the exact protected main branch"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A tag run is the recovery unit. Do not cancel it when another release starts.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      contents: read

    steps:
      - name: Create a repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Require the exact release App identity for tag creation
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "Tag creation requires the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi

      - name: Checkout the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require an exact reviewed release candidate
        id: candidate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Tag creation requires workflow_dispatch." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Tag creation requires refs/heads/main, not $GITHUB_REF." >&2
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "OpenAdaptAI/OpenAdapt" ]; then
            echo "Tag creation requires OpenAdaptAI/OpenAdapt." >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "The dispatched commit is stale. main=$current_main dispatch=$GITHUB_SHA." >&2
            exit 1
          fi

          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          if [ -z "$REQUESTED_VERSION" ] || [ "$REQUESTED_VERSION" != "$project_version" ]; then
            echo "Version mismatch: input=$REQUESTED_VERSION pyproject=$project_version." >&2
            exit 1
          fi

          tag="v${project_version}"
          python - "$project_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          headers = re.findall(r"^## v([^ ]+) \(\d{4}-\d{2}-\d{2}\)$", changelog, re.MULTILINE)
          if not headers or headers[0] != version:
              actual = headers[0] if headers else "missing"
              raise SystemExit(
                  f"CHANGELOG.md must start with v{version}; found v{actual}."
              )
          PY
          python scripts/verify_release_lock.py

          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists. Rerun its tag workflow for recovery." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push only the annotated release tag
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "openadapt-release[bot]"
          git config user.email "openadapt-release[bot]@users.noreply.github.com"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main advanced before the tag push. main=$current_main candidate=$GITHUB_SHA." >&2
            exit 1
          fi

          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "OpenAdapt ${RELEASE_TAG#v}"
          git push origin "refs/tags/$RELEASE_TAG"

  build-and-attest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require the release App tag and exact candidate state
        env:
          EXPECTED_ACTOR: openadapt-release[bot]
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publication requires a tag push event." >&2
            exit 1
          fi
          if [ "$GITHUB_ACTOR" != "$EXPECTED_ACTOR" ]; then
            echo "Publication requires $EXPECTED_ACTOR, not $GITHUB_ACTOR." >&2
            exit 1
          fi

          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
          )"
          expected_tag="v${project_version}"
          if [ "$GITHUB_REF" != "refs/tags/$expected_tag" ] || [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag mismatch: ref=$GITHUB_REF version=$project_version." >&2
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$(git rev-parse HEAD)" ]; then
            echo "The release tag does not resolve to the checked-out commit." >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The release tag is not contained in protected main." >&2
            exit 1
          fi

          python - "$project_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          headers = re.findall(r"^## v([^ ]+) \(\d{4}-\d{2}-\d{2}\)$", changelog, re.MULTILINE)
          if not headers or headers[0] != version:
              actual = headers[0] if headers else "missing"
              raise SystemExit(
                  f"CHANGELOG.md must start with v{version}; found v{actual}."
              )
          PY
          python scripts/verify_release_lock.py

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Check the public source boundary
        run: python scripts/check_source_boundary.py

      - name: Build exact release artifacts
        run: |
          uv build --wheel --sdist
          python scripts/verify_release_artifacts.py

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Transfer release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-pypi:
    needs: build-and-attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish-github:
    needs: [build-and-attest, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read

    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists-${{ github.ref_name }}
          path: dist/

      - name: Create a repository-scoped release App token for GitHub publication
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - name: Require the exact release App identity for GitHub publication
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: openadapt-release
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]; then
            echo "GitHub publication requires the $EXPECTED_APP_SLUG App, not $ACTUAL_APP_SLUG." >&2
            exit 1
          fi

      - name: Publish the GitHub Release and exact artifacts
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_AUTHOR: openadapt-release[bot]
        run: |
          set -euo pipefail
          python - "$RELEASE_TAG" > /tmp/release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(tag)} \(\d{{4}}-\d{{2}}-\d{{2}}\)\n"
              rf"(?P<body>.*?)(?=^## v|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no release notes for {tag}.")
          print(match.group("body").strip())
          PY

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "The remote release tag does not resolve to the event commit." >&2
            exit 1
          fi

          release_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          release_status="$(curl --silent --show-error \
            --output /tmp/github-release.json \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$release_url")"

          if [ "$release_status" = "404" ]; then
            gh release create "$RELEASE_TAG" \
              dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest
            release_status="$(curl --silent --show-error \
              --output /tmp/github-release.json \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$release_url")"
          elif [ "$release_status" = "200" ]; then
            python scripts/verify_github_release.py \
              --metadata /tmp/github-release.json \
              --tag "$RELEASE_TAG" \
              --author "$EXPECTED_AUTHOR" \
              --expected-dir dist \
              --allow-missing \
              --missing-output /tmp/missing-release-assets.txt

            mkdir /tmp/existing-github-release-assets
            asset_count="$(python -c \
              'import json; print(len(json.load(open("/tmp/github-release.json"))["assets"]))')"
            if [ "$asset_count" -gt 0 ]; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --dir /tmp/existing-github-release-assets
            fi
            python scripts/verify_github_release.py \
              --metadata /tmp/github-release.json \
              --tag "$RELEASE_TAG" \
              --author "$EXPECTED_AUTHOR" \
              --expected-dir dist \
              --downloaded-dir /tmp/existing-github-release-assets \
              --allow-missing \
              --missing-output /tmp/missing-release-assets.txt

            while IFS= read -r missing_asset; do
              gh release upload "$RELEASE_TAG" "dist/$missing_asset" \
                --repo "$GITHUB_REPOSITORY"
            done < /tmp/missing-release-assets.txt

            release_status="$(curl --silent --show-error \
              --output /tmp/github-release.json \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$release_url")"
          fi
          if [ "$release_status" != "200" ]; then
            echo "GitHub returned HTTP $release_status for the exact release." >&2
            exit 1
          fi

          python scripts/verify_github_release.py \
            --metadata /tmp/github-release.json \
            --tag "$RELEASE_TAG" \
            --author "$EXPECTED_AUTHOR" \
            --expected-dir dist

          mkdir /tmp/github-release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/github-release-assets
          python scripts/verify_github_release.py \
            --metadata /tmp/github-release.json \
            --tag "$RELEASE_TAG" \
            --author "$EXPECTED_AUTHOR" \
            --expected-dir dist \
            --downloaded-dir /tmp/github-release-assets

  verify-publication:
    needs: [build-and-attest, publish-pypi, publish-github]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the attested source artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists-${{ github.ref_name }}
          path: dist/

      - name: Bind the published PyPI files to the exact release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if python scripts/generate_platform_manifest.py \
              --output /tmp/published-platform-manifest.json \
              --report-output /tmp/published-platform-report.md; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "PyPI did not expose the released launcher artifacts in time." >&2
              exit 1
            fi
            sleep 15
          done
          python scripts/validate_platform_manifest.py \
            --manifest /tmp/published-platform-manifest.json \
            --report /tmp/published-platform-report.md \
            --require-network

          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          manifest = json.loads(
              Path("/tmp/published-platform-manifest.json").read_text(encoding="utf-8")
          )
          target = Path("pypi-dist")
          target.mkdir()
          for artifact in manifest["components"]["launcher"]["artifacts"]:
              urllib.request.urlretrieve(artifact["url"], target / artifact["filename"])
          PY
          python scripts/verify_release_artifacts.py dist \
            | sed 's#  dist/#  #' > /tmp/source.sha256
          python scripts/verify_release_artifacts.py pypi-dist \
            | sed 's#  pypi-dist/#  #' > /tmp/pypi.sha256
          diff -u /tmp/source.sha256 /tmp/pypi.sha256

      - name: Bind the GitHub Release files to the exact release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir github-dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir github-dist
          python scripts/verify_release_artifacts.py github-dist \
            | sed 's#  github-dist/#  #' > /tmp/github.sha256
          diff -u /tmp/source.sha256 /tmp/github.sha256

      - name: Record whether the committed platform manifest needs a reviewed update
        id: manifest-drift
        run: |
          set -euo pipefail
          if cmp -s platform-manifest.json /tmp/published-platform-manifest.json && \
             cmp -s docs/platform-compatibility-report.md /tmp/published-platform-report.md; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain the exact published platform manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-platform-manifest-${{ github.ref_name }}
          path: |
            /tmp/published-platform-manifest.json
            /tmp/published-platform-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Report the required reviewed manifest update
        if: steps.manifest-drift.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "platform-manifest.json needs the published launcher release"
          BODY: >-
            Release ${{ github.ref_name }} passed PyPI and GitHub byte verification.
            The committed platform manifest still needs a reviewed update. Download
            the generated manifest and report from
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

  report-release-failure:
    needs:
      - create-release-tag
      - build-and-attest
      - publish-pypi
      - publish-github
      - verify-publication
    if: >-
      ${{ always() &&
          (needs.create-release-tag.result == 'failure' ||
           needs.build-and-attest.result == 'failure' ||
           needs.publish-pypi.result == 'failure' ||
           needs.publish-github.result == 'failure' ||
           needs.verify-publication.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: File or update the release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_TAG_RESULT: ${{ needs.create-release-tag.result }}
          BUILD_RESULT: ${{ needs.build-and-attest.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
          GITHUB_RESULT: ${{ needs.publish-github.result }}
          VERIFY_RESULT: ${{ needs.verify-publication.result }}
        run: |
          set -euo pipefail
          TITLE="Release workflow failed"
          BODY="The release workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          create-tag=${CREATE_TAG_RESULT}, build-and-attest=${BUILD_RESULT}, publish-pypi=${PYPI_RESULT}, publish-github=${GITHUB_RESULT}, verify-publication=${VERIFY_RESULT}.

          If the annotated tag exists, rerun this exact tag workflow. Do not create a recovery tag."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
