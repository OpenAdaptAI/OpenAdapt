name: Protected safety review

# Manual-only (workflow_dispatch). The automatic PR/comment/merge_group gate
# is disabled; PRs touching workflows or verifier code are gated by unit and
# contract tests, gitleaks, dependency-review, ci, and Merge Queue.
on:
  workflow_dispatch:

concurrency:
  group: protected-safety-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  evaluate:
    name: Evaluate protected-path evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted PR base or default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'refs/heads/main' }}
          persist-credentials: false
      - name: Record the checked-out trusted commit
        id: trusted_base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Evaluate current PR metadata and publish exact-head status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_BASE_SHA: ${{ steps.trusted_base.outputs.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # For issue_comment events GitHub attaches this job to main's head
        # commit. The verdict goes only to the protected-safety-review check
        # run on the PR head, so this step exits 0 once that is published and
        # fails only on an internal error.
        run: python3 -m scripts.ci.protected_safety_review
