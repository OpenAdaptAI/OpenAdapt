# OpenAdapt Desktop native installers: publish one immutable desktop-vX.Y.Z
# prerelease from reviewed main.
#
# Dispatch from main with the version that main carries. The engine (PyPI)
# release openadapt-desktop-vX.Y.Z must already be published by
# release-package.yml, and packages/desktop must be unchanged since it.
#
# OpenAdapt's releases are immutable, so this workflow never edits a published
# release. It builds and smoke-tests every installer, attests the exact bytes,
# writes this release's own openadapt-desktop-channel.json (schema v3; it names
# the previous release's channel by hash), attaches everything to a draft, and
# publishes the draft once. Consumers pick the newest valid desktop-v* release.
#
# Signing: macOS DMGs are ad-hoc signed unless Developer ID credentials are
# configured. Windows installers are signed by SignPath when the four SIGNPATH_*
# secrets are set in the native-release environment, and ship unsigned
# otherwise. Linux bytes are covered by the GitHub attestation. File names,
# metadata, the website manifest, the channel and the release notes all state
# the mode each platform used. The result is an unadmitted release candidate;
# it creates no Production state.
name: Desktop native installer release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed main Desktop version to publish (X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/desktop

concurrency:
  # One transaction owns the tag and the release. Never run two at once.
  group: desktop-native-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed main release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      native_tag: ${{ steps.release.outputs.native_tag }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      engine_tag: ${{ steps.release.outputs.engine_tag }}
      engine_commit: ${{ steps.release.outputs.engine_commit }}
      engine_release_id: ${{ steps.engine.outputs.engine_release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Enforce the public source boundary
        run: python scripts/check_source_boundary.py

      - name: Require current main, its published engine release, and a new tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          current_main="$(git rev-parse --verify refs/remotes/origin/main)"
          if [ "${current_main}" != "${GITHUB_SHA}" ]; then
            echo "error: dispatch source ${GITHUB_SHA} is not current main ${current_main}" >&2
            exit 1
          fi
          version="$(python scripts/native_release.py version)"
          python scripts/check_release_consistency.py
          engine_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${REQUESTED_VERSION}" != "${version}" ] || [ "${engine_version}" != "${version}" ]; then
            echo "error: requested ${REQUESTED_VERSION}; main has native ${version}, engine ${engine_version}" >&2
            exit 1
          fi
          native_tag="desktop-v${version}"
          python scripts/native_release.py validate-tag "${native_tag}"
          engine_tag="openadapt-desktop-v${version}"
          git fetch --force --no-tags origin "refs/tags/${engine_tag}:refs/tags/${engine_tag}" || {
            echo "error: engine release ${engine_tag} does not exist; release-package.yml publishes it" >&2
            exit 1
          }
          engine_commit="$(git rev-parse --verify "${engine_tag}^{commit}")"
          if ! git merge-base --is-ancestor "${engine_commit}" "${GITHUB_SHA}"; then
            echo "error: ${engine_tag} is not an ancestor of reviewed main" >&2
            exit 1
          fi
          # packages/desktop must be byte-identical to the engine release, apart
          # from a native version transform (which, at the same version, is none).
          python scripts/native_release.py validate-version-transform \
            --base-ref "${engine_commit}" \
            --candidate-ref "${GITHUB_SHA}" \
            --version "${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${native_tag}" >/dev/null; then
            echo "error: immutable native tag ${native_tag} already exists" >&2
            exit 1
          fi
          git ls-remote --tags origin > remote-tags.txt
          python scripts/native_release.py validate-release-order \
            --candidate-tag "${native_tag}" \
            --tags remote-tags.txt
          {
            echo "native_tag=${native_tag}"
            echo "source_commit=${GITHUB_SHA}"
            echo "engine_tag=${engine_tag}"
            echo "engine_commit=${engine_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require the immutable engine release from release-package.yml
        id: engine
        env:
          ENGINE_TAG: ${{ steps.release.outputs.engine_tag }}
          ENGINE_COMMIT: ${{ steps.release.outputs.engine_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${ENGINE_TAG}" \
            --json databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release.json
          python scripts/native_release.py validate-engine-release \
            --file engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${ENGINE_TAG}" \
            --engine-commit "${ENGINE_COMMIT}" \
            --github-output "${GITHUB_OUTPUT}"
          author="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${ENGINE_TAG}" --jq '.author.login')"
          if [ "${author}" != "openadapt-release[bot]" ]; then
            echo "error: ${ENGINE_TAG} was not published by the openadapt-release App (${author})" >&2
            exit 1
          fi

  build-macos:
    name: macOS ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.os }}
    # The protected environment holds the Developer ID identity and notary
    # credentials if they are ever configured. Without them the DMG is ad-hoc
    # signed, and its file name, metadata and the release notes say so.
    environment: native-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Validate complete-or-absent Apple signing credentials
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          python scripts/native_signing.py preflight
          --platform macos
          --github-output "${GITHUB_OUTPUT}"

      - name: Import Developer ID certificate into an ephemeral keychain
        if: steps.signing.outputs.mode == 'developer-id-notarized'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/openadapt-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/openadapt-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          echo "OPENADAPT_APPLE_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          echo "OPENADAPT_APPLE_CERTIFICATE=${certificate_path}" >> "${GITHUB_ENV}"

      - name: Install locked Tauri CLI
        run: npm ci --ignore-scripts

      - name: Build engine sidecar for Tauri externalBin
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.mode == 'developer-id-notarized' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.29
          python scripts/sync_frozen_dependencies.py
          uv run python scripts/build_frozen_engine.py
          uv run python scripts/verify_build_artifact.py sidecar
          uv run python scripts/smoke_test_frozen_flow.py
          mkdir -p src-tauri/binaries
          cp dist/openadapt-engine \
            "src-tauri/binaries/openadapt-engine-${{ matrix.target }}"

      - name: Build Developer ID signed and notarized DMG
        if: steps.signing.outputs.mode == 'developer-id-notarized'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npm run tauri build --
          --bundles dmg
          --target ${{ matrix.target }}

      - name: Build ad-hoc signed DMG
        if: steps.signing.outputs.mode == 'adhoc'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          npm run tauri build --
          --bundles dmg
          --target ${{ matrix.target }}
          --config src-tauri/tauri.adhoc.conf.json

      - name: Smoke-test DMG install, signature policy, launch, and uninstall
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#artifacts[@]}" -eq 1
          python scripts/smoke_test_native_installer.py \
            --artifact "${artifacts[0]}" \
            --app-path "${RUNNER_TEMP}/OpenAdapt Desktop.app" \
            --expected-architecture "${{ matrix.architecture }}" \
            --signing-mode "${{ steps.signing.outputs.mode }}" \
            --signing-identity "${APPLE_SIGNING_IDENTITY}" \
            --signing-team-id "${APPLE_TEAM_ID}" \
            --launch-seconds 20

      - name: Stage exact native DMG
        run: >-
          python scripts/native_release.py stage
          --bundle-root src-tauri/target/${{ matrix.target }}/release/bundle
          --output dist/native
          --platform macos
          --architecture ${{ matrix.architecture }}
          --signing ${{ steps.signing.outputs.mode }}

      - name: Upload smoke-tested DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-${{ matrix.architecture }}
          path: packages/desktop/dist/native/*
          if-no-files-found: error

      - name: Remove ephemeral Apple signing material
        if: always() && steps.signing.outputs.mode == 'developer-id-notarized'
        shell: bash
        run: |
          security delete-keychain "${OPENADAPT_APPLE_KEYCHAIN}" || true
          rm -f "${OPENADAPT_APPLE_CERTIFICATE}"


  build-windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-2022
    # The protected environment holds the SignPath credentials. With all four,
    # one SignPath request deep-signs the MSI (the installer and the program
    # files in it) and signs the NSIS setup; with none, both ship unsigned and
    # say so; with some, the build fails. The artifact configuration is
    # .signpath/artifact-configurations/openadapt-desktop-installers.xml.
    environment: native-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc

      - name: Validate complete-or-absent SignPath credentials
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        shell: pwsh
        run: >-
          python scripts/native_signing.py preflight
          --platform windows
          --github-output "$env:GITHUB_OUTPUT"

      - name: Install locked Tauri CLI
        run: npm ci --ignore-scripts

      - name: Build engine sidecar for Tauri externalBin
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.29
          python scripts/sync_frozen_dependencies.py
          uv run python scripts/build_frozen_engine.py
          uv run python scripts/verify_build_artifact.py sidecar
          uv run python scripts/smoke_test_frozen_flow.py
          mkdir -p src-tauri/binaries
          cp dist/openadapt-engine.exe \
            src-tauri/binaries/openadapt-engine-x86_64-pc-windows-msvc.exe

      - name: Build MSI and NSIS installers
        run: >-
          npm run tauri build --
          --bundles msi,nsis
          --target x86_64-pc-windows-msvc

      - name: Collect the installers for signing
        if: steps.signing.outputs.method == 'signpath'
        shell: pwsh
        run: |
          $Bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $Msi = @(Get-ChildItem "$Bundle/msi/*.msi")
          $Nsis = @(Get-ChildItem "$Bundle/nsis/*-setup.exe")
          if ($Msi.Count -ne 1 -or $Nsis.Count -ne 1) { throw "Expected one MSI and one NSIS installer" }
          New-Item -ItemType Directory -Path signing-input | Out-Null
          Copy-Item $Msi[0].FullName signing-input/
          Copy-Item $Nsis[0].FullName signing-input/

      - name: Upload the unsigned installers for SignPath
        if: steps.signing.outputs.method == 'signpath'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-installers
          path: packages/desktop/signing-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installers with SignPath
        if: steps.signing.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: packages/desktop/signing-output

      - name: Replace the built installers with the signed ones
        if: steps.signing.outputs.method == 'signpath'
        shell: pwsh
        run: |
          $Bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          foreach ($Pattern in @("msi/*.msi", "nsis/*-setup.exe")) {
            $Built = @(Get-ChildItem "$Bundle/$Pattern")
            if ($Built.Count -ne 1) { throw "Expected one built $Pattern" }
            $Signed = Join-Path "signing-output" $Built[0].Name
            if (-not (Test-Path -LiteralPath $Signed -PathType Leaf)) {
              throw "SignPath returned no $($Built[0].Name)"
            }
            $Signature = Get-AuthenticodeSignature -LiteralPath $Signed
            if ($Signature.Status -ne "Valid") {
              throw "SignPath returned $($Built[0].Name) with signature status $($Signature.Status)"
            }
            Copy-Item -LiteralPath $Signed -Destination $Built[0].FullName -Force
          }

      - name: Smoke-test MSI and NSIS install, signature policy, launch, and uninstall
        timeout-minutes: 15
        shell: pwsh
        run: |
          $Msi = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi")
          $Nsis = @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe")
          if ($Msi.Count -ne 1 -or $Nsis.Count -ne 1) { throw "Expected one MSI and one NSIS installer" }
          $Signature = @("--signing-mode", "${{ steps.signing.outputs.mode }}")
          # SignPath deep-signs the MSI, so the program it installs must carry
          # a valid signature too. It cannot open an NSIS archive, so for the
          # NSIS setup only the installer itself is signed.
          $NsisSignature = $Signature
          if ("${{ steps.signing.outputs.mode }}" -eq "authenticode") {
            $NsisSignature += @("--installer-only-signature")
          }
          python scripts/smoke_test_native_installer.py `
            --artifact $Msi[0].FullName `
            --app-path "$env:ProgramFiles/OpenAdapt Desktop/openadapt-desktop.exe" `
            --expected-architecture x86_64 `
            --allow-system-install `
            --launch-seconds 20 @Signature
          python scripts/smoke_test_native_installer.py `
            --artifact $Nsis[0].FullName `
            --app-path "$env:LOCALAPPDATA/OpenAdapt Desktop/openadapt-desktop.exe" `
            --uninstaller-path "$env:LOCALAPPDATA/OpenAdapt Desktop/uninstall.exe" `
            --expected-architecture x86_64 `
            --allow-system-install `
            --launch-seconds 20 @NsisSignature

      - name: Stage exact native Windows installers
        run: >-
          python scripts/native_release.py stage
          --bundle-root src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          --output dist/native
          --platform windows
          --architecture x86_64
          --signing ${{ steps.signing.outputs.mode }}

      - name: Upload smoke-tested Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-x86_64
          path: packages/desktop/dist/native/*
          if-no-files-found: error

  build-linux:
    name: Linux x86_64 (GitHub-attested bytes)
    needs: validate
    runs-on: ubuntu-22.04
    # DEB and AppImage have no one shared native signing format. The attest job
    # below uses GitHub OIDC to sign provenance for the exact staged bytes and
    # verifies those attestations before any release can be created.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux bundle dependencies
        timeout-minutes: 10
        run: |
          set -uo pipefail
          # The hosted runner resolves its Ubuntu mirror through
          # /etc/apt/apt-mirrors.txt, which points at azure.archive.ubuntu.com.
          # That mirror fails intermittently, and each failure costs minutes of
          # apt retries. Prefer the canonical archive. Best-effort: an absent or
          # already-canonical file changes nothing.
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          update_ok=""
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              update_ok=1
              break
            fi
            echo "::warning::apt-get update failed (attempt ${attempt}/3); retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$update_ok" ]; then
            echo "::error::apt-get update failed three times; the Ubuntu mirror is unreachable"
            exit 1
          fi
          set -e
          sudo apt-get install -y --no-install-recommends \
            dbus \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils \
            xvfb

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          targets: x86_64-unknown-linux-gnu

      - name: Install locked Tauri CLI
        run: npm ci --ignore-scripts

      - name: Build engine sidecar for Tauri externalBin
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.29
          python scripts/sync_frozen_dependencies.py
          uv run python scripts/build_frozen_engine.py
          uv run python scripts/verify_build_artifact.py sidecar
          uv run python -m playwright install-deps chromium
          sudo python scripts/alias_lowercase_x11_sonames.py
          uv run python scripts/smoke_test_frozen_flow.py
          mkdir -p src-tauri/binaries
          cp dist/openadapt-engine \
            src-tauri/binaries/openadapt-engine-x86_64-unknown-linux-gnu

      - name: Build DEB and AppImage
        run: >-
          npm run tauri build --
          --bundles deb,appimage
          --target x86_64-unknown-linux-gnu

      - name: Smoke-test DEB and AppImage install, launch, and uninstall
        shell: bash
        env:
          # WebKitGTK's DMA-BUF renderer is unreliable under Xvfb on CI.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -euo pipefail
          deb=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test "${#deb[@]}" -eq 1
          test "${#appimage[@]}" -eq 1
          dbus-run-session -- xvfb-run --auto-servernum \
            python scripts/smoke_test_native_installer.py \
            --artifact "${deb[0]}" \
            --app-path /usr/bin/openadapt-desktop \
            --expected-architecture x86_64 \
            --allow-system-install \
            --launch-seconds 20
          dbus-run-session -- xvfb-run --auto-servernum \
            python scripts/smoke_test_native_installer.py \
            --artifact "${appimage[0]}" \
            --app-path "${RUNNER_TEMP}/OpenAdapt-Desktop.AppImage" \
            --expected-architecture x86_64 \
            --launch-seconds 20

      - name: Stage exact native Linux packages
        run: >-
          python scripts/native_release.py stage
          --bundle-root src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          --output dist/native
          --platform linux
          --architecture x86_64
          --signing github-attested

      - name: Upload smoke-tested Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x86_64
          path: packages/desktop/dist/native/*
          if-no-files-found: error


  attest:
    name: Checksum and attest exact release bytes
    needs: [validate, build-macos, build-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_TAG: ${{ needs.validate.outputs.native_tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      ENGINE_TAG: ${{ needs.validate.outputs.engine_tag }}
      ENGINE_COMMIT: ${{ needs.validate.outputs.engine_commit }}
      ENGINE_RELEASE_ID: ${{ needs.validate.outputs.engine_release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download all smoke-tested platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: packages/desktop/release-assets
          merge-multiple: true

      - name: Reject missing, duplicate, or unexpected release files
        run: python scripts/native_release.py validate-set --directory release-assets

      - name: Generate a machine-readable SBOM from the exact installer set
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: packages/desktop/release-assets
          format: cyclonedx-json
          output-file: packages/desktop/release-assets/OpenAdapt-Desktop-${{ needs.validate.outputs.native_tag }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Refuse an empty or malformed release SBOM
        run: >-
          python scripts/native_release.py validate-sbom
          --file release-assets/OpenAdapt-Desktop-${{ needs.validate.outputs.native_tag }}.cyclonedx.json

      - name: Generate the website-readable release manifest
        run: >-
          python scripts/native_release.py website-manifest
          --directory release-assets
          --tag "${{ needs.validate.outputs.native_tag }}"
          --sbom release-assets/OpenAdapt-Desktop-${{ needs.validate.outputs.native_tag }}.cyclonedx.json

      - name: Bind the exact source, engine release, and workflow invocation
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/native_release.py write-provenance \
            --output release-assets/openadapt-desktop-native-release-provenance.json \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${NATIVE_TAG}" \
            --source-commit "${SOURCE_COMMIT}" \
            --workflow-ref "${WORKFLOW_REF}" \
            --workflow-commit "${WORKFLOW_COMMIT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --runner-environment "${RUNNER_ENVIRONMENT}" \
            --engine-tag "${ENGINE_TAG}" \
            --engine-commit "${ENGINE_COMMIT}" \
            --engine-release-id "${ENGINE_RELEASE_ID}" \
            --engine-release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${ENGINE_TAG}"

      - name: Add the standalone exact-inventory verifier
        run: >-
          cp scripts/verify_native_release_download.py
          release-assets/verify-openadapt-native-release.py

      - name: Generate and verify final checksums
        run: |
          python scripts/native_release.py checksums \
            --directory release-assets \
            --output release-assets/SHA256SUMS
          python scripts/native_release.py verify-checksums \
            --directory release-assets \
            --manifest release-assets/SHA256SUMS

      - name: Validate the website manifest against exact checksummed bytes
        run: >-
          python scripts/native_release.py validate-website-manifest
          --file release-assets/openadapt-desktop-release-manifest.json
          --checksums release-assets/SHA256SUMS

      - name: Attest the exact files named by SHA256SUMS
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: packages/desktop/release-assets/SHA256SUMS

      - name: Attest SHA256SUMS as the consumer trust root
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: packages/desktop/release-assets/SHA256SUMS

      - name: Verify the signed workflow and exact subject inventory
        shell: bash
        run: |
          set -euo pipefail
          provenance=release-assets/openadapt-desktop-native-release-provenance.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-native-release.yml@refs/heads/main"
          gh attestation verify "${provenance}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners \
            --format json > attestation.json
          gh attestation verify release-assets/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners
          python scripts/native_release.py validate-attestation \
            --file attestation.json \
            --directory release-assets \
            --checksums release-assets/SHA256SUMS \
            --provenance "${provenance}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${NATIVE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"

      - name: Fetch and authenticate the previous release's channel
        shell: bash
        run: |
          set -euo pipefail
          # The newest published desktop-v* release below this one that carries
          # a channel. Drafts and other packages' releases are ignored.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false)
                  | select(.tag_name | test("^desktop-v[0-9]+[.][0-9]+[.][0-9]+$"))
                  | select(any(.assets[]; .name == "openadapt-desktop-channel.json"))
                  | .tag_name' > channel-releases.txt
          previous="$(python - "${NATIVE_TAG}" <<'PY'
          import sys
          def key(tag):
              return tuple(int(part) for part in tag.removeprefix("desktop-v").split("."))
          current = key(sys.argv[1])
          tags = [line.strip() for line in open("channel-releases.txt") if line.strip()]
          older = sorted((tag for tag in tags if key(tag) < current), key=key)
          print(older[-1] if older else "")
          PY
          )"
          mkdir previous-channel
          if [ -n "${previous}" ]; then
            gh release download "${previous}" --dir previous-channel \
              --pattern openadapt-desktop-channel.json
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-native-release.yml@refs/heads/main"
            gh attestation verify previous-channel/openadapt-desktop-channel.json \
              --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${identity}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners
            python scripts/native_release.py validate-channel \
              --file previous-channel/openadapt-desktop-channel.json
            echo "Previous channel: ${previous}"
          else
            echo "No earlier desktop-v* release carries a channel; this one starts the chain."
          fi

      - name: Write this release's channel
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          previous=()
          if [ -f previous-channel/openadapt-desktop-channel.json ]; then
            previous=(--previous previous-channel/openadapt-desktop-channel.json)
          fi
          python scripts/native_release.py write-channel \
            --output release-assets/openadapt-desktop-channel.json \
            --directory release-assets \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${NATIVE_TAG}" \
            --source-commit "${SOURCE_COMMIT}" \
            --workflow-ref "${WORKFLOW_REF}" \
            --workflow-commit "${WORKFLOW_COMMIT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            "${previous[@]}"
          python scripts/native_release.py validate-channel \
            --file release-assets/openadapt-desktop-channel.json \
            --directory release-assets \
            "${previous[@]}"

      - name: Attest this release's channel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: packages/desktop/release-assets/openadapt-desktop-channel.json

      - name: Upload the exact attested release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-${{ needs.validate.outputs.native_tag }}
          path: packages/desktop/release-assets/*
          if-no-files-found: error

  publish-native:
    name: Publish the immutable candidate prerelease
    needs: [validate, attest]
    runs-on: ubuntu-22.04
    # The irreversible boundary: one approval of the native-release environment
    # publishes the exact attested set. A published release is never edited.
    environment: native-release
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_TAG: ${{ needs.validate.outputs.native_tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned GitHub release verification CLI
        id: release-cli
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_2.98.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz \
            --output "${archive}"
          echo "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          cli="${RUNNER_TEMP}/gh_2.98.0_linux_amd64/bin/gh"
          test -x "${cli}"
          echo "path=${cli}" >> "${GITHUB_OUTPUT}"

      - name: Download the exact attested release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-${{ needs.validate.outputs.native_tag }}
          path: packages/desktop/release-assets

      - name: Reverify the exact bytes and every attestation
        shell: bash
        run: |
          set -euo pipefail
          # The channel binds SHA256SUMS, so it is not one of its entries.
          mkdir channel
          mv release-assets/openadapt-desktop-channel.json channel/
          provenance=release-assets/openadapt-desktop-native-release-provenance.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-native-release.yml@refs/heads/main"
          python scripts/native_release.py verify-checksums \
            --directory release-assets \
            --manifest release-assets/SHA256SUMS
          for subject in "${provenance}" release-assets/SHA256SUMS channel/openadapt-desktop-channel.json; do
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${identity}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners \
              --format json > "attestation-$(basename "${subject}").json"
          done
          python scripts/native_release.py validate-attestation \
            --file "attestation-$(basename "${provenance}").json" \
            --directory release-assets \
            --checksums release-assets/SHA256SUMS \
            --provenance "${provenance}" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${NATIVE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"
          python scripts/native_release.py validate-channel \
            --file channel/openadapt-desktop-channel.json \
            --directory release-assets
          python scripts/native_release.py release-signing --directory release-assets \
            > release-signing.json

      - name: Require that the source is still on main and the tag order holds
        shell: bash
        run: |
          set -euo pipefail
          # Builds take a while and main moves on; publishing is still sound as
          # long as the source is on main and no newer desktop-v* tag exists.
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${SOURCE_COMMIT}" refs/remotes/origin/main
          git ls-remote --tags origin > remote-tags.txt
          if grep -q "refs/tags/${NATIVE_TAG}$" remote-tags.txt; then
            git fetch --force --no-tags origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
            observed="$(git rev-parse --verify "${NATIVE_TAG}^{commit}")"
            if [ "${observed}" != "${SOURCE_COMMIT}" ]; then
              echo "error: ${NATIVE_TAG} resolves to ${observed}, not ${SOURCE_COMMIT}" >&2
              exit 1
            fi
            grep -v "refs/tags/${NATIVE_TAG}$" remote-tags.txt > remote-other-tags.txt
          else
            cp remote-tags.txt remote-other-tags.txt
          fi
          python scripts/native_release.py validate-release-order \
            --candidate-tag "${NATIVE_TAG}" \
            --tags remote-other-tags.txt

      - name: Write release notes that state each platform's signing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > release-notes.md
          import json
          from pathlib import Path

          signing = json.loads(Path("release-signing.json").read_text())
          lines = {
              ("macos", "adhoc"): (
                  "- **macOS**: ad-hoc signed, not notarized. macOS asks you to confirm "
                  "the first time you open it (System Settings > Privacy & Security)."
              ),
              ("macos", "developer-id-notarized"): (
                  "- **macOS**: Developer ID signed and notarized."
              ),
              ("windows", "unsigned"): (
                  "- **Windows**: unsigned. SmartScreen warns before install; choose "
                  "More info > Run anyway."
              ),
              ("windows", "authenticode"): (
                  "- **Windows**: signed through SignPath. The MSI and the program it "
                  "installs are Authenticode-signed; the NSIS setup is signed, but the "
                  "files it installs and its uninstaller are not. Prefer the MSI."
              ),
              ("linux", "github-attested"): (
                  "- **Linux**: no package signature; the GitHub attestation covers the "
                  "exact DEB and AppImage bytes."
              ),
          }
          print("<!-- installer-release -->")
          print("## Signing in this release\n")
          for platform in ("macos", "windows", "linux"):
              print(lines[(platform, signing[platform])])
          print(
              "\nVerify any download against `SHA256SUMS` and its GitHub attestation "
              "with `verify-openadapt-native-release.py`.\n"
          )
          print(Path("docs/RELEASE_CANDIDATE_INSTALLERS.md").read_text())
          PY
          test -s release-notes.md

      - name: Create or resume the draft, verify its bytes, and publish it once
        env:
          GH_CLI: ${{ steps.release-cli.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          title="OpenAdapt Desktop release candidate ${NATIVE_TAG#desktop-v}"
          mkdir upload
          cp release-assets/* channel/openadapt-desktop-channel.json upload/
          state="$("${GH_CLI}" api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | python -c '
          import json, sys
          tag = sys.argv[1]
          found = [r for page in json.load(sys.stdin) for r in page if r.get("tag_name") == tag]
          if len(found) > 1:
              sys.exit(f"more than one release for {tag}")
          print("none" if not found else ("draft" if found[0]["draft"] else "published"))
          ' "${NATIVE_TAG}")"
          echo "Release ${NATIVE_TAG}: ${state}"
          if [ "${state}" = none ]; then
            "${GH_CLI}" release create "${NATIVE_TAG}" upload/* \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --prerelease \
              --latest=false \
              --target "${SOURCE_COMMIT}" \
              --title "${title}" \
              --notes-file release-notes.md
            state=draft
          fi
          if [ "${state}" = draft ]; then
            # Resume: upload what is missing, then compare every byte.
            "${GH_CLI}" release view "${NATIVE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' > draft-assets.txt
            for path in upload/*; do
              name="$(basename "${path}")"
              grep -qxF "${name}" draft-assets.txt || \
                "${GH_CLI}" release upload "${NATIVE_TAG}" "${path}" --repo "${GITHUB_REPOSITORY}"
            done
            mkdir draft-download
            "${GH_CLI}" release download "${NATIVE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --dir draft-download --pattern '*'
            diff -r upload draft-download
            "${GH_CLI}" release edit "${NATIVE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi
          mkdir published
          "${GH_CLI}" release download "${NATIVE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir published --pattern '*'
          diff -r upload published
          git fetch --force --no-tags origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
          test "$(git rev-parse --verify "${NATIVE_TAG}^{commit}")" = "${SOURCE_COMMIT}"
          # GitHub's own attestation that the published release is immutable and
          # carries exactly these assets.
          for attempt in $(seq 1 12); do
            if "${GH_CLI}" release verify "${NATIVE_TAG}" --repo "${GITHUB_REPOSITORY}"; then
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "GitHub did not produce a valid release attestation in time." >&2
              exit 1
            fi
            sleep 10
          done
          for path in upload/*; do
            "${GH_CLI}" release verify-asset "${NATIVE_TAG}" "${path}" --repo "${GITHUB_REPOSITORY}"
          done
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${NATIVE_TAG}"
