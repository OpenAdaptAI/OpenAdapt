name: Launcher quickstart lifecycle

on:
  schedule:
    - cron: "15 8 * * 3" # Wednesdays 08:15 UTC
  workflow_dispatch:

concurrency:
  # A pull request's newer push cancels its older run. Every other event (the
  # merge queue, main, schedules, dispatches) gets a group of its own, so it
  # is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quickstart:
    name: public launcher command (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: .github/ci-tools/uv.lock

      # build comes from the CI tools lock. The quickstart itself installs the
      # wheel into a clean environment from PyPI, as a user would.
      - name: Build launcher wheel
        run: |
          python scripts/ci/locked_install.py --lock .github/ci-tools:build
          python -m build --wheel --outdir lifecycle-dist

      - name: Run the public quickstart from a clean environment
        run: >-
          python scripts/quickstart_lifecycle.py
          --launcher-wheel "lifecycle-dist/*.whl"
          --work-dir "runs/launcher-lifecycle"
          --browser-system-deps
          --source-revision "${{ github.sha }}"

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-quickstart-ubuntu
          path: |
            runs/launcher-lifecycle/summary.json
            runs/launcher-lifecycle/logs/*.log
            runs/launcher-lifecycle/artifacts/**/REPORT.md
            runs/launcher-lifecycle/artifacts/**/report.json
            runs/launcher-lifecycle/artifacts/**/receipt.json
          if-no-files-found: warn
