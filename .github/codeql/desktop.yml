# CodeQL scope for the JavaScript/TypeScript analyses: OpenAdapt Desktop
# (React UI and Tauri shell) and the optional Flow Chrome extension (MV3).
# Rust analysis uses the same file; only packages/desktop has Rust sources.
# The frozen pre-1.0 monolith under legacy/ is not analyzed for these languages.
name: openadapt-desktop
paths:
  - packages/desktop
  - packages/flow/chrome_extension
