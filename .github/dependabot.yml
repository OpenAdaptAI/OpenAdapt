# SOC 2: automated dependency updates (OA-C-23).
#
# Each entry opens at most one version-update pull request per group a week.
# CI runner time is the scarce resource (the org is on the free GitHub Actions
# plan), and one grouped PR runs CI once instead of once per dependency.
# Security updates are not grouped and still open as they are published.
version: 2
updates:
  # Every uv.lock except Desktop's, in one entry. CI installs from these locks
  # (scripts/ci/locked_install.py, `uv sync --locked`), so a test tool moves
  # only when a lock changes. Two weekly pull requests at most, each across
  # all of these directories, so every package moves to the same version:
  # the test tools in one, everything else in the other.
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/packages/types"
      - "/packages/flow"
      - "/packages/agent"
      - "/packages/capture"
      - "/packages/privacy"
      - "/packages/tray"
      - "/.github/ci-tools"
      - "/.github/ci-tools/audit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Listed first: a dependency joins the first group it matches.
      test-tools:
        patterns:
          - "pytest"
          - "pytest-*"
          - "hypothesis"
          - "coverage"
          - "ruff"
          - "mypy"
          - "playwright"
          - "build"
          - "pip"
          - "pip-audit"
          - "twine"
      python:
        patterns: ["*"]
    ignore:
      # Keep PyGObject >=3.46,<3.51 so the Linux extra installs on GLib 2.64
      # distros; 3.51+ needs newer GLib. See packages/capture/docs/DESIGN.md.
      - dependency-name: "pygobject"
        versions: [">=3.51"]
  # packages/desktop: its uv.lock, the frontend's package-lock.json and the
  # Tauri shell's Cargo.lock, each in one weekly group.
  - package-ecosystem: "uv"
    directory: "/packages/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      uv-desktop:
        patterns: ["*"]
    ignore:
      # Each version is a reviewed pin. A PyInstaller bump needs a new
      # bootloader license review (scripts/frozen_notices.py), and the
      # Playwright version is part of the bundled Flow runtime that
      # docs/RELEASE_CANDIDATE_INSTALLERS.md describes. Bump them by hand.
      - dependency-name: "pyinstaller"
      - dependency-name: "playwright"
      # The macOS Intel pin must stay on 1.20.1, the last release with an Intel
      # wheel; dependabot's bump to 1.31.0 broke the Intel installer build.
      # Bump onnxruntime by hand, and keep the Intel pin where it is.
      - dependency-name: "onnxruntime"
  - package-ecosystem: "npm"
    directory: "/packages/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-desktop:
        patterns: ["*"]
    ignore:
      # Tauri's JavaScript packages pair with the Rust crates in src-tauri, and
      # tests/test_native_release.py requires the two sides to match. Dependabot
      # bumps npm and cargo in separate pull requests, so each one fails alone.
      # Bump the Tauri core and plugins on both sides together, by hand.
      - dependency-name: "@tauri-apps/*"
  - package-ecosystem: "cargo"
    directory: "/packages/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      cargo-desktop:
        patterns: ["*"]
    ignore:
      # The Rust side of the Tauri pairs above; bumped with them, by hand.
      # Build the Linux installer before taking a plugin bump: for example,
      # tauri-plugin-deep-link 2.6.2 does not compile against rust-ini 0.21.3.
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # v4 breaks the docs dispatch with a mismatched Content-Length on
      # GitHub-hosted runners. Bumping it silently red-mains the docs sync;
      # this already happened twice (#1049, #1079). Remove once upstream
      # ships a fixed release.
      - dependency-name: "peter-evans/repository-dispatch"
        versions: ["4.x"]
    groups:
      # One PR for every action. That also keeps CodeQL's init and analyze,
      # which share version-specific state, on the same version.
      github-actions:
        patterns: ["*"]
