# SOC 2: automated dependency updates (OA-C-23).
#
# Each ecosystem and directory opens at most one version-update pull request a
# week: every update is in one group (`patterns: ["*"]`). CI runner time is
# the scarce resource (the org is on the free GitHub Actions plan), and one
# grouped PR runs CI once instead of once per dependency. Security updates are
# not grouped and still open as they are published.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      pip-root:
        patterns: ["*"]
  # packages/capture keeps its own uv.lock. The uv ecosystem updates it with
  # pyproject.toml, so the capture lanes' `uv sync --locked` accepts the bump.
  - package-ecosystem: "uv"
    directory: "/packages/capture"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      uv-capture:
        patterns: ["*"]
    ignore:
      # Keep PyGObject >=3.46,<3.51 so the Linux extra installs on GLib 2.64
      # distros; 3.51+ needs newer GLib. See packages/capture/docs/DESIGN.md.
      - dependency-name: "pygobject"
        versions: [">=3.51"]
  # packages/privacy keeps its own uv.lock, like packages/capture.
  - package-ecosystem: "uv"
    directory: "/packages/privacy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      uv-privacy:
        patterns: ["*"]
  # packages/tray keeps its own uv.lock, like packages/capture.
  - package-ecosystem: "uv"
    directory: "/packages/tray"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      uv-tray:
        patterns: ["*"]
  # packages/desktop: its uv.lock, the frontend's package-lock.json and the
  # Tauri shell's Cargo.lock, each in one weekly group.
  - package-ecosystem: "uv"
    directory: "/packages/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      uv-desktop:
        patterns: ["*"]
    ignore:
      # Each version is a reviewed pin. A PyInstaller bump needs a new
      # bootloader license review (scripts/frozen_notices.py), and the
      # Playwright version is part of the bundled Flow runtime that
      # docs/RELEASE_CANDIDATE_INSTALLERS.md describes. Bump them by hand.
      - dependency-name: "pyinstaller"
      - dependency-name: "playwright"
      # ONNX Runtime 1.31.0 is the newest release with macOS Intel wheels,
      # which the macOS Intel lock and installer need (see the onnxruntime pins
      # in packages/desktop/pyproject.toml). A bump breaks that lane.
      - dependency-name: "onnxruntime"
  - package-ecosystem: "npm"
    directory: "/packages/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-desktop:
        patterns: ["*"]
    ignore:
      # Tauri's JavaScript packages pair with the Rust crates in src-tauri, and
      # tests/test_native_release.py requires the two sides to match. Dependabot
      # bumps npm and cargo in separate pull requests, so each one fails alone.
      # Bump the Tauri core and plugins on both sides together, by hand.
      - dependency-name: "@tauri-apps/*"
  - package-ecosystem: "cargo"
    directory: "/packages/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      cargo-desktop:
        patterns: ["*"]
    ignore:
      # The Rust side of the Tauri pairs above; bumped with them, by hand.
      # Build the Linux installer before taking a plugin bump: for example,
      # tauri-plugin-deep-link 2.6.2 does not compile against rust-ini 0.21.3.
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # v4 breaks the docs dispatch with a mismatched Content-Length on
      # GitHub-hosted runners. Bumping it silently red-mains the docs sync;
      # this already happened twice (#1049, #1079). Remove once upstream
      # ships a fixed release.
      - dependency-name: "peter-evans/repository-dispatch"
        versions: ["4.x"]
    groups:
      # One PR for every action. That also keeps CodeQL's init and analyze,
      # which share version-specific state, on the same version.
      github-actions:
        patterns: ["*"]
