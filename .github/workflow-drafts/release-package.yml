name: Release a workspace package

# DRAFT, NOT ENABLED. GitHub runs only files in .github/workflows/, and this
# file is in .github/workflow-drafts/. README.md next to it lists the settings
# and script changes that must land before it moves.
#
# One workflow releases any package under packages/ to its existing PyPI name.
# The launcher (`openadapt`, repository root) keeps release-and-publish.yml and
# its plain v* tags. Package tags carry the directory name: types-v0.20.0,
# capture-v1.3.0, flow-v1.36.0.
#
# Release model, the one openadapt-flow, openadapt-capture, openadapt-evals,
# and the launcher already use:
#   1. A reviewed pull request sets the version in packages/<pkg>/pyproject.toml
#      (and CHANGELOG.md where the package keeps one).
#   2. A person dispatches this workflow from protected main with that version.
#      It re-checks the candidate, requires green CI on the exact commit, builds
#      and verifies the artifacts, and has the release App create one annotated
#      tag. Nothing else is pushed.
#   3. The tag event rebuilds the exact source, attests the artifacts, publishes
#      to PyPI with Trusted Publishing from a per-package environment, creates
#      the GitHub Release through the release App, and verifies both surfaces.
#
# Each package's own gates from its standalone release workflow run in the
# "Package release gates" steps. openadapt-types, -privacy, and -viewer used
# python-semantic-release to choose the version and push a version commit to
# main; under this draft they move to the reviewed-version model above, which
# adds gates and removes no gate.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace package directory under packages/"
        type: choice
        required: true
        options:
          - types
          - privacy
          - capture
          - agent
          - evals
          - viewer
          # - flow   (after openadapt-flow is imported; its gates are below)
      version:
        description: "Reviewed version already in packages/<package>/pyproject.toml on protected main"
        type: string
        required: true
  push:
    tags:
      - "types-v*"
      - "privacy-v*"
      - "capture-v*"
      - "agent-v*"
      - "evals-v*"
      - "viewer-v*"
      # - "flow-v*"

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event_name == 'workflow_dispatch' && inputs.package || github.ref_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.29"
  RELEASE_ACTOR: "openadapt-release[bot]"

jobs:
  # ---------------------------------------------------------------- dispatch
  validate-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      short: ${{ steps.candidate.outputs.short }}
      name: ${{ steps.candidate.outputs.name }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Require a versioned dispatch from protected main by a person
        id: candidate
        env:
          PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          # From openadapt-evals: the lifecycle App may never start a release.
          test "$ACTOR" != 'openadapt-lifecycle[bot]'
          test "$TRIGGERING_ACTOR" != 'openadapt-lifecycle[bot]'
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Release tag creation must be dispatched from protected main."
            exit 1
          fi
          case "$PACKAGE" in
            types|privacy|capture|agent|evals|viewer) ;;
            *) echo "Unknown package directory: $PACKAGE"; exit 1 ;;
          esac
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be an exact stable semantic version such as 1.3.0"
            exit 1
          fi
          {
            echo "short=$PACKAGE"
            echo "name=openadapt-$PACKAGE"
            echo "version=$RELEASE_VERSION"
            echo "tag=$PACKAGE-v$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

  create-release-tag:
    needs: validate-dispatch
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      actions: read
      contents: read
    env:
      SHORT: ${{ needs.validate-dispatch.outputs.short }}
      NAME: ${{ needs.validate-dispatch.outputs.name }}
      RELEASE_VERSION: ${{ needs.validate-dispatch.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-dispatch.outputs.tag }}
    steps:
      - name: Create the release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Verify the release App identity
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: test "$APP_SLUG" = 'openadapt-release'

      - name: Checkout the dispatched main commit with the release App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}

      # The reviewed-version gate from openadapt-flow and openadapt-capture,
      # applied to every package.
      - name: Require the reviewed release candidate on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Refusing a stale release dispatch. Current main is $current_main; the dispatch is $GITHUB_SHA."
            exit 1
          fi
          project_version="$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "packages/$SHORT/pyproject.toml")"
          if [ "$project_version" != "$RELEASE_VERSION" ]; then
            echo "packages/$SHORT/pyproject.toml contains $project_version; the reviewed version input is $RELEASE_VERSION."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists. Rerun its tag workflow instead of creating another ref."
            exit 1
          fi
          git fetch --force --tags origin
          python - "$SHORT" "$RELEASE_VERSION" <<'PY'
          import re, subprocess, sys
          short, version = sys.argv[1], sys.argv[2]
          requested = tuple(int(p) for p in version.split("."))
          tags = subprocess.check_output(["git", "tag", "--list", f"{short}-v*"], text=True).split()
          existing = [tuple(int(g) for g in m.groups()) for t in tags
                      if (m := re.fullmatch(rf"{re.escape(short)}-v(\d+)\.(\d+)\.(\d+)", t))]
          if existing and requested <= max(existing):
              raise SystemExit(f"{version} is not newer than the latest {short} tag")
          PY

      - name: Package release gates (from the standalone release workflows)
        working-directory: packages/${{ env.SHORT }}
        shell: bash
        run: |
          set -euo pipefail
          first_heading() { grep -Em1 '^## v[0-9]+\.[0-9]+\.[0-9]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$' CHANGELOG.md; }
          case "$SHORT" in
            capture)
              python scripts/check_changelog.py
              grep -Eq "^## v${RELEASE_VERSION} \(" CHANGELOG.md
              ;;
            evals)
              first_heading | grep -Eq "^## v${RELEASE_VERSION} \("
              # TODO before enabling: verify_release_lock.py reads packages/evals/uv.lock,
              # which uv no longer uses inside the workspace. Point it at the root lock.
              python scripts/verify_release_lock.py
              ;;
            agent)
              # Version consistency across pyproject.toml, __init__.py, server.json, manifest.json.
              uv run --package openadapt-agent --extra dev pytest tests/test_distribution.py -q
              ;;
            flow)
              python scripts/check_release_consistency.py
              grep -Eq "^## v${RELEASE_VERSION} \(" CHANGELOG.md
              pip install "pyyaml>=6"
              python scripts/validate_claims.py --check --structure-only
              ;;
            types|privacy|viewer)
              # No pre-tag gate today: python-semantic-release chose the version.
              ;;
          esac

      - name: Require green Monorepo CI on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monorepo-ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
          if [ "$runs" -lt 1 ]; then
            echo "No successful Monorepo CI run for $GITHUB_SHA."
            exit 1
          fi

      # TODO before enabling: these scripts look up the standalone repository's
      # workflow names. Until they read the monorepo workflows they fail closed.
      - name: Package CI evidence (from the standalone release workflows)
        working-directory: packages/${{ env.SHORT }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SHORT" in
            capture)
              python scripts/check_release_ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
                --dispatch-missing --ref "$GITHUB_REF_NAME" --timeout-seconds 5400
              ;;
            evals)
              python scripts/verify_release_ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
              ;;
            flow)
              python scripts/check_release_ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
                --dispatch-missing --ref "$GITHUB_REF_NAME" --wait-seconds 5400 --poll-seconds 10
              ;;
            *) ;;
          esac

      - name: Build and verify the exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          dist="packages/$SHORT/dist"
          rm -rf "$dist"
          uv build --package "$NAME" --wheel --sdist --out-dir "$dist"
          python scripts/check_source_boundary.py --dist "$dist"
          (cd "packages/$SHORT" && bash "$GITHUB_WORKSPACE/.github/workflow-drafts/package-artifact-gates.sh" "$SHORT")
          rm -rf "$dist"
          if ! git diff --quiet --exit-code; then
            echo "The release build changed tracked files. Prepare those changes in the reviewed release pull request."
            git --no-pager diff
            exit 1
          fi

      - name: Create and push one annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Refusing a stale release tag. Current main is $current_main; the qualified candidate is $GITHUB_SHA."
            exit 1
          fi
          git config user.name "$RELEASE_ACTOR"
          git config user.email "openadapt-release[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "$NAME $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

  # ---------------------------------------------------------------- tag
  validate-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      short: ${{ steps.tag.outputs.short }}
      name: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require an exact package release tag from the release App
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "The publication path accepts a pushed tag only."
            exit 1
          fi
          if [ "$GITHUB_ACTOR" != "$RELEASE_ACTOR" ]; then
            echo "Only the release App can start the tag publication path."
            exit 1
          fi
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/(types|privacy|capture|agent|evals|viewer)-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "The tag must be <package>-v<X.Y.Z>, for example capture-v1.3.0."
            exit 1
          fi
          short="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          {
            echo "short=$short"
            echo "name=openadapt-$short"
            echo "version=$version"
            echo "tag=$short-v$version"
          } >> "$GITHUB_OUTPUT"

  build-and-attest:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      SHORT: ${{ needs.validate-tag.outputs.short }}
      NAME: ${{ needs.validate-tag.outputs.name }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Checkout the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify the exact protected tag and reviewed version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          project_version="$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "packages/$SHORT/pyproject.toml")"
          if [ "$project_version" != "$RELEASE_VERSION" ]; then
            echo "The tag says $RELEASE_VERSION; packages/$SHORT/pyproject.toml says $project_version."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "The tagged commit is not contained in protected main."
            exit 1
          fi

      - name: Package release gates on the exact tag
        working-directory: packages/${{ env.SHORT }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SHORT" in
            capture)
              python scripts/check_changelog.py
              grep -Eq "^## v${RELEASE_VERSION} \(" CHANGELOG.md
              ;;
            evals)
              grep -Em1 '^## v[0-9]+\.[0-9]+\.[0-9]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$' CHANGELOG.md | grep -Eq "^## v${RELEASE_VERSION} \("
              python scripts/verify_release_lock.py
              ;;
            agent)
              uv run --package openadapt-agent --extra dev pytest tests/test_distribution.py -q
              ;;
            flow)
              python scripts/check_release_consistency.py
              grep -Eq "^## v${RELEASE_VERSION} \(" CHANGELOG.md
              pip install "pyyaml>=6"
              python scripts/validate_claims.py --check --structure-only
              ;;
            *) ;;
          esac

      - name: Require green Monorepo CI on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/monorepo-ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
          test "$runs" -ge 1

      - name: Build and verify publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          dist="packages/$SHORT/dist"
          rm -rf "$dist"
          uv build --package "$NAME" --wheel --sdist --out-dir "$dist"
          python scripts/check_source_boundary.py --dist "$dist"
          (cd "packages/$SHORT" && bash "$GITHUB_WORKSPACE/.github/workflow-drafts/package-artifact-gates.sh" "$SHORT")
          mkdir -p release-dist
          cp "$dist"/*.whl "$dist"/*.tar.gz release-dist/
          ls -l release-dist

      # Sigstore-signed build provenance, as the launcher release already does.
      # PyPI Trusted Publishing below adds PEP 740 attestations on upload.
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-dist/*.whl
            release-dist/*.tar.gz

      - name: Transfer release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists-${{ env.RELEASE_TAG }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    needs: [validate-tag, build-and-attest]
    runs-on: ubuntu-latest
    # One environment per package. Each PyPI project's trusted publisher names
    # this repository, this workflow file, and only its own environment, so a
    # run for one package cannot publish another.
    environment:
      name: pypi-${{ needs.validate-tag.outputs.short }}
      url: https://pypi.org/project/${{ needs.validate-tag.outputs.name }}/${{ needs.validate-tag.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    env:
      NAME: ${{ needs.validate-tag.outputs.name }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Checkout the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists-${{ env.RELEASE_TAG }}
          path: dist/

      - name: Refuse conflicting immutable PyPI files
        run: python3 scripts/monorepo/verify_pypi_files.py --project "$NAME" --version "$RELEASE_VERSION" --directory dist --mode preflight

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true

      - name: Verify immutable PyPI publication bytes
        run: python3 scripts/monorepo/verify_pypi_files.py --project "$NAME" --version "$RELEASE_VERSION" --directory dist --mode verify --wait-seconds 300 --poll-seconds 10

  publish-github:
    needs: [validate-tag, build-and-attest, publish-pypi]
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      contents: read
    env:
      SHORT: ${{ needs.validate-tag.outputs.short }}
      NAME: ${{ needs.validate-tag.outputs.name }}
      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Checkout the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists-${{ env.RELEASE_TAG }}
          path: dist/

      - name: Create the release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Verify the release App identity
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: test "$APP_SLUG" = 'openadapt-release'

      - name: Publish the GitHub Release with the exact artifacts
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub Release."
          else
            notes="$RUNNER_TEMP/release-notes.md"
            changelog="packages/$SHORT/CHANGELOG.md"
            if [ -f "$changelog" ]; then
              awk -v heading="## v$RELEASE_VERSION (" '
                index($0, heading) == 1 { inside = 1; print; print ""; print "_This release is published under the MIT License._"; next }
                inside && /^## / { exit }
                inside { print }
              ' "$changelog" > "$notes"
            fi
            if [ ! -s "$notes" ]; then
              printf '%s %s\n\n_This release is published under the MIT License._\n' "$NAME" "$RELEASE_VERSION" > "$notes"
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$NAME $RELEASE_VERSION" --notes-file "$notes" --latest=false \
              dist/*.whl dist/*.tar.gz
          fi
          author="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
          test "$author" = "$RELEASE_ACTOR"

  # openadapt-agent only: publish server.json to the official MCP registry
  # after the package is live on PyPI, as the standalone workflow does.
  publish-mcp-registry:
    needs: [validate-tag, publish-pypi]
    if: needs.validate-tag.outputs.short == 'agent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO before enabling: pin an exact mcp-publisher release and its
      # SHA-256. The standalone workflow downloads "latest".
      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to the MCP registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        working-directory: packages/agent
        run: ../../mcp-publisher publish
