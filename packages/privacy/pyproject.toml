[project]
name = "openadapt-privacy"
version = "1.1.3"
description = "Find and redact personal and health data in GUI recordings: typed text, accessibility trees, and screenshots"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MLDSAI Inc.", email = "richard@mldsai.com"}
]
keywords = ["privacy", "pii", "phi", "scrubbing", "redaction", "gui", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "presidio-image-redactor>=0.0.50",
    "spacy>=3.7.0",
]

# Git/CI gate. Stdlib only; no extra packages. Clinic installs this extra to
# mean "the scanner, not Presidio".
scan = []

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
openadapt-privacy-scan = "openadapt_privacy.scan:main"

[project.urls]
Homepage = "https://github.com/OpenAdaptAI/OpenAdapt/tree/main/packages/privacy"
Repository = "https://github.com/OpenAdaptAI/OpenAdapt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openadapt_privacy"]

[tool.hatch.build.targets.wheel.force-include]
"openadapt_privacy/gitleaks.toml" = "openadapt_privacy/gitleaks.toml"
"openadapt_privacy/phi-patterns.txt" = "openadapt_privacy/phi-patterns.txt"

[tool.uv]
# presidio-anonymizer 2.2.364 (the newest) caps cryptography below 49, and
# cryptography 48.x has two high advisories (GHSA-g6cj-pr64-35w5,
# GHSA-jwv3-5hgf-82ww; fixed in 50.0.0). This override applies to the locked
# development and CI environment, where the Presidio suite proves the fixed
# release works. A pip install of the presidio extra still follows Presidio's cap.
override-dependencies = ["cryptography>=50.0.2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
