name: Release and PyPI Publish

# ADMIN_TOKEN is the same organization-scoped release credential used by the
# canonical Flow release. The default GITHUB_TOKEN cannot push the generated
# version commit through protected main.

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}

      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: |
          uv build
          python scripts/check_source_boundary.py --require-dist

      # v1.14.0 bundles twine 6.1.0 and packaging 25.0, which reject the
      # Metadata-Version 2.5 that current hatchling emits. That pin failed the
      # openadapt-evals 0.91.0 publish after the tag, the release commit and
      # the GitHub release had already landed, leaving PyPI stale. v1.14.2
      # bundles twine 7.0.0 and packaging 26.2, and is the same pin
      # openadapt-flow and openadapt-capture use.
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish to GitHub Releases
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}
