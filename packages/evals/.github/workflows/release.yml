name: Release and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version on protected main
        required: true
        type: string
      source_commit:
        description: Full protected-main commit SHA to tag
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reject-lifecycle-app:
    if: github.event_name == 'workflow_dispatch'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Reject the lifecycle App
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$ACTOR" != 'openadapt-lifecycle[bot]'
          test "$TRIGGERING_ACTOR" != 'openadapt-lifecycle[bot]'

  authorize-release-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Accept tags from the release App only
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$ACTOR" = 'openadapt-release[bot]'

  create-release-tag:
    needs: reject-lifecycle-app
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor != 'openadapt-lifecycle[bot]' &&
      github.triggering_actor != 'openadapt-lifecycle[bot]'
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the request to the reviewed release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'OpenAdaptAI/openadapt-evals'
          test "$GITHUB_REF" = 'refs/heads/main'
          if ! printf '%s' "$REQUESTED_SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::The requested source commit is not a full commit ID.'
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_VERSION" | \
            grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo '::error::The requested version is not a stable X.Y.Z version.'
            exit 1
          fi
          test "$GITHUB_SHA" = "$REQUESTED_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_COMMIT"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$REQUESTED_SOURCE_COMMIT"
          python scripts/verify_release_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$REQUESTED_SOURCE_COMMIT"
          python scripts/verify_release_lock.py

          project_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          document = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(document['project']['version'])
          PY
          )
          test "$project_version" = "$REQUESTED_VERSION"
          first_release_heading=$(grep -Em1 \
            '^## v[0-9]+\.[0-9]+\.[0-9]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$' \
            CHANGELOG.md)
          printf '%s\n' "$first_release_heading" | \
            grep -Eq "^## v${REQUESTED_VERSION} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$"

          release_tag="v${REQUESTED_VERSION}"
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${release_tag}" >/dev/null 2>&1; then
            git fetch --force origin \
              "refs/tags/${release_tag}:refs/tags/${release_tag}"
            test "$(git cat-file -t "refs/tags/${release_tag}")" = 'tag'
            test "$(git rev-parse "refs/tags/${release_tag}^{commit}")" = \
              "$REQUESTED_SOURCE_COMMIT"
            tag_exists=true
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --sort=-version:refname | head -1)
            if [ -n "$latest" ]; then
              python - "$REQUESTED_VERSION" "${latest#v}" <<'PY'
          import re
          import sys

          def stable(value: str) -> tuple[int, int, int]:
              match = re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
                  value,
              )
              if match is None:
                  raise SystemExit(f"REFUSED: invalid stable version {value!r}")
              return tuple(int(part) for part in match.groups())

          if stable(sys.argv[1]) <= stable(sys.argv[2]):
              raise SystemExit(
                  f"REFUSED: requested version {sys.argv[1]} does not follow {sys.argv[2]}"
              )
          PY
            fi
            tag_exists=false
          fi
          {
            echo "exists=${tag_exists}"
            echo "source_commit=${REQUESTED_SOURCE_COMMIT}"
            echo "tag=${release_tag}"
            echo "version=${REQUESTED_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release App token
        if: steps.release.outputs.exists != 'true'
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: OpenAdaptAI
          repositories: openadapt-evals
          permission-contents: write

      - name: Verify the release App identity
        if: steps.release.outputs.exists != 'true'
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          APP_TOKEN: ${{ steps.release-app.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = 'openadapt-release'
          test -n "$APP_TOKEN"
          case "$EXPECTED_APP_ID" in
            ''|*[!0-9]*)
              echo '::error::OPENADAPT_RELEASE_APP_ID must be a positive integer.'
              exit 1
              ;;
          esac
          test "$EXPECTED_APP_ID" -gt 0

      - name: Create and push only the annotated release tag
        if: steps.release.outputs.exists != 'true'
        env:
          APP_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo '::error::The release tag appeared after validation.'
            exit 1
          fi
          git config user.name 'OpenAdapt Release App'
          git config user.email 'openadapt-release[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$SOURCE_COMMIT" \
            -m "OpenAdapt Evals ${RELEASE_VERSION}"
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

  publish-pypi:
    needs: authorize-release-tag
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.authorize-release-tag.result == 'success' &&
      github.actor == 'openadapt-release[bot]'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact tag and release state
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'OpenAdaptAI/openadapt-evals'
          test "$(git cat-file -t "$GITHUB_REF")" = 'tag'
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          document = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(document['project']['version'])
          PY
          )
          test "$GITHUB_REF" = "refs/tags/v${version}"
          first_release_heading=$(grep -Em1 \
            '^## v[0-9]+\.[0-9]+\.[0-9]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$' \
            CHANGELOG.md)
          printf '%s\n' "$first_release_heading" | \
            grep -Eq "^## v${version} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python scripts/verify_release_lock.py

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Build the exact tag
        run: uv build

      - name: Verify the public distribution boundary
        run: python scripts/check_source_boundary.py --require-dist

      - name: Verify third-party notices
        run: python scripts/check_third_party_notices.py --require-dist

      - name: Refuse conflicting immutable PyPI files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v${version}"
          python scripts/verify_pypi_release.py \
            --directory dist \
            --version "$version" \
            --allow-matching-subset \
            --wait-seconds 300 \
            --poll-seconds 10

      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          skip-existing: true

      - name: Verify immutable PyPI publication bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v${version}"
          python scripts/verify_pypi_release.py \
            --directory dist \
            --version "$version" \
            --wait-seconds 300 \
            --poll-seconds 10

  publish-github-release:
    needs:
      - authorize-release-tag
      - publish-pypi
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.authorize-release-tag.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      github.actor == 'openadapt-release[bot]'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: OpenAdaptAI
          repositories: openadapt-evals
          permission-contents: write

      - name: Verify the release App identity
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          APP_TOKEN: ${{ steps.release-app.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = 'openadapt-release'
          test -n "$APP_TOKEN"
          case "$EXPECTED_APP_ID" in
            ''|*[!0-9]*)
              echo '::error::OPENADAPT_RELEASE_APP_ID must be a positive integer.'
              exit 1
              ;;
          esac
          test "$EXPECTED_APP_ID" -gt 0

      - name: Publish the exact GitHub release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF")" = 'tag'
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'The exact GitHub release already exists.'
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
          state=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,isDraft,isPrerelease,tagName)
          test "$(jq -r '.tagName' <<<"$state")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$state")" = 'false'
          test "$(jq -r '.isPrerelease' <<<"$state")" = 'false'
          test "$(jq -r '.author.login' <<<"$state")" = 'openadapt-release[bot]'
