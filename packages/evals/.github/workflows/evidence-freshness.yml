name: evidence-freshness

# Published evidence is bound to one exact openadapt-flow wheel. A Flow release
# can therefore invalidate it without any commit landing here, so the check runs
# on a schedule as well as on changes to the evidence itself. It is one small
# job, so it costs a few seconds a day rather than a matrix.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/eval_results/**'
      - 'scripts/check_published_evidence_freshness.py'
      - 'scripts/import_production_acceptance.py'
      - '.github/workflows/evidence-freshness.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reject-lifecycle-app:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Reject the lifecycle App
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$ACTOR" != 'openadapt-lifecycle[bot]'
          test "$TRIGGERING_ACTOR" != 'openadapt-lifecycle[bot]'

  freshness:
    needs: reject-lifecycle-app
    if: >-
      github.actor != 'openadapt-lifecycle[bot]' &&
      github.triggering_actor != 'openadapt-lifecycle[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Standard library only: no dependency install, no lockfile, no cache.
      - name: Check published evidence against the current published release
        env:
          APPROVED_CLOUD_ACCEPTANCE_COMMIT: ${{ vars.APPROVED_CLOUD_ACCEPTANCE_COMMIT }}
          QUALIFICATION_ADMISSION_SIGNERS_JSON: ${{ vars.QUALIFICATION_ADMISSION_SIGNERS_JSON }}
          REVOKED_QUALIFICATION_ADMISSION_IDS_JSON: ${{ vars.REVOKED_QUALIFICATION_ADMISSION_IDS_JSON }}
          REVOKED_QUALIFICATION_SIGNER_KEY_IDS_JSON: ${{ vars.REVOKED_QUALIFICATION_SIGNER_KEY_IDS_JSON }}
        run: >-
          python scripts/check_published_evidence_freshness.py
          --approved-cloud-source-commit "$APPROVED_CLOUD_ACCEPTANCE_COMMIT"
          --trusted-admission-signers-json "$QUALIFICATION_ADMISSION_SIGNERS_JSON"
          --revoked-admission-ids-json "$REVOKED_QUALIFICATION_ADMISSION_IDS_JSON"
          --revoked-admission-signer-key-ids-json "$REVOKED_QUALIFICATION_SIGNER_KEY_IDS_JSON"

  # GitHub turns off a public repository's scheduled workflows after 60 days
  # without a commit, and a red schedule that stops running looks the same as
  # one that was fixed. A failing scheduled run therefore leaves one open issue
  # that outlives the schedule. One issue, rewritten in place: a new issue
  # every day stops being read, and editing a body does not notify.
  report-stale-evidence:
    needs: [reject-lifecycle-app, freshness]
    if: >-
      failure() &&
      needs.freshness.result == 'failure' &&
      github.event_name == 'schedule' &&
      github.actor != 'openadapt-lifecycle[bot]' &&
      github.triggering_actor != 'openadapt-lifecycle[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the published-evidence issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Published evidence check failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > body.md <<BODY
          The scheduled published-evidence check failed: ${RUN_URL}

          Usually this means a newer openadapt-flow release shipped and the
          numbers in README.md and docs/eval_results were measured on an older
          one. Re-run the comparison against the current release and publish a
          new evidence set (see the current set's REPRODUCE.md). Until then the
          public numbers describe a release nobody installs.

          This issue stays open after the schedule stops. Close it when the
          check is green again.
          BODY
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "in:title \"${TITLE}\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --repo "${GITHUB_REPOSITORY}" --body-file body.md
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body-file body.md
          fi
