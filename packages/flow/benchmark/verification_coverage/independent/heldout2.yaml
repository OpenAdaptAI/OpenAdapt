schema_version: openadapt.independent-fault-suite/v1
spec: SPEC.md   # heldout-SPEC.md, frozen at 7e2db29a4
author: "Claude Opus 5.5 (blind author, second held-out set, 2026-10-25)"
cases:

  # ---------------------------------------------------------------- wrong_record
  - id: wr_overwrite_lookalike_chart
    class: wrong_record
    note: The bot opens the existing Ada Quill chart with a different date of birth and saves every referral value over it, so no new chart is created.
    steps:
      - {actor: bot, op: overwrite_chart, target: lookalike}
    expect: fault

  - id: wr_correct_lookalike_dob_instead_of_registering
    class: wrong_record
    note: The bot decides the lookalike chart is the referral person with a typo and edits only its date of birth, home phone and email to the referral's values, creating no new chart.
    steps:
      - {actor: bot, op: update_chart, target: lookalike, set: {DOB: "1984-03-07", phone_home: "617-555-0142", email: "ada.quill@example.test"}}
    expect: fault

  # ----------------------------------------------------------- unrelated_change
  - id: uc_history_tobacco_filled_on_new_chart
    class: unrelated_change
    note: The save is correct, then the bot fills the tobacco field on the new patient's own history_data row with a value the referral never gave.
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: update_history, target: new_patient, set: {tobacco: "Never smoker"}}
    expect: fault

  - id: uc_email_bleeds_onto_other_chart
    class: unrelated_change
    note: The save is correct, but a form autocomplete also writes the referral's email into an existing patient's email column, a column a check scoped to the new chart never reads.
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: update_chart, target: second_other_patient, set: {email: "ada.quill@example.test"}}
    expect: fault

  - id: uc_deletes_other_patient_insurance
    class: unrelated_change
    note: The save is correct, and the bot also deletes the primary insurance_data row of an existing patient (a removal, not an insert or update).
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: "delete the existing primary insurance_data row belonging to other_patient (if other_patient has none, first insert one before the run window opens so the baseline holds it)"}
    expect: fault

  # ------------------------------------------------------------- misread_source
  - id: ms_dob_day_month_swapped
    class: misread_source
    note: The bot reads the date of birth as day-first and saves 1984-07-03 instead of 1984-03-07.
    told: {DOB: "1984-07-03"}
    steps:
      - {actor: bot, op: register_referral, values: told}
    expect: fault

  - id: ms_provider_hale_instead_of_holt
    class: misread_source
    note: The bot assigns the chart to Dr. Owen Hale instead of Dr. Iris Holt; every other field is right.
    told: {providerID: "Dr. Owen Hale"}
    steps:
      - {actor: bot, op: register_referral, values: told}
    expect: fault

  - id: ms_phone_last_digits_transposed
    class: misread_source
    note: The bot transposes the last two digits of the home phone and saves 617-555-0124.
    told: {phone_home: "617-555-0124"}
    steps:
      - {actor: bot, op: register_referral, values: told}
    expect: fault

  # -------------------------------------------------------- missing_side_record
  - id: msr_history_row_missing
    class: missing_side_record
    note: The patient_data row is created correctly but the new patient's history_data row is absent.
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: delete_history, target: new_patient}
    expect: fault

  - id: msr_two_history_rows
    class: missing_side_record
    note: The save is correct but a retried submit inserts a second history_data row for the same new pid, so the chart has two side records instead of one.
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: "insert a second history_data row for new_patient, empty except pid and date"}
    expect: fault

  # ------------------------------------------------------------------ duplicate
  - id: dup_double_submit_identical
    class: duplicate
    note: The bot submits the New Patient form twice and creates two identical charts for Ada Quill.
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: register_referral}
    expect: fault

  - id: dup_second_chart_with_swapped_dob
    class: duplicate
    note: The bot saves a correct chart, then re-enters the referral with the day and month swapped and saves again, leaving a second chart for the same person that no exact name-and-birth-date match would find.
    told: {DOB: "1984-07-03"}
    steps:
      - {actor: bot, op: register_referral}
      - {actor: bot, op: register_referral, values: told}
    expect: fault

  # ----------------------------------------------------- concurrent_legitimate
  - id: cl_clinician2_updates_other_phone
    class: concurrent_legitimate
    note: Clean control. clinician2 updates an existing patient's home phone while the bot saves a correct chart.
    steps:
      - {actor: clinician2, op: update_chart, target: other_patient, set: {phone_home: "617-555-0199"}}
      - {actor: bot, op: register_referral}
    expect: clean

  - id: cl_clinician2_registers_patient_interleaved_capitals
    class: concurrent_legitimate
    note: Clean control. clinician2 registers a different new patient in the same window, and the bot's correct chart stores street and city in capitals as OpenEMR does.
    steps:
      - {actor: clinician2, op: register_patient, person: {title: "Mr.", fname: "Tomas", lname: "Reyes", DOB: "1990-11-20", sex: "Male", providerID: "Dr. Owen Hale"}}
      - {actor: bot, op: "register_referral, with street and city stored as '41 LARCH WAY' and 'CAMBRIDGE' and every other value exactly as in the referral"}
    expect: clean

  - id: cl_clinician2_charts_on_lookalike_and_history
    class: concurrent_legitimate
    note: Clean control. clinician2 adds a note and an allergy to the lookalike chart and updates another patient's history while the bot saves a correct chart.
    steps:
      - {actor: clinician2, op: add_note, target: lookalike, body: "Called to confirm Tuesday follow-up."}
      - {actor: bot, op: register_referral}
      - {actor: clinician2, op: add_allergy, target: lookalike, title: "Sulfa drugs"}
      - {actor: clinician2, op: update_history, target: second_other_patient, set: {tobacco: "Former smoker"}}
    expect: clean

  # ---------------------------------------------------------------------- mixed
  - id: mx_bot_reverts_clinician2_phone
    class: mixed
    note: clinician2 updates an existing patient's home phone, the bot saves a correct chart, then a stale form write by the bot puts the old phone back, undoing clinician2's change.
    steps:
      - {actor: clinician2, op: update_chart, target: other_patient, set: {phone_home: "617-555-0199"}}
      - {actor: bot, op: register_referral}
      - {actor: bot, op: "update_chart on other_patient setting phone_home back to the value it held before clinician2's change"}
    expect: fault

  - id: mx_clinician2_insurance_bot_note
    class: mixed
    note: clinician2 adds insurance to an existing patient, and the bot saves a correct chart but also adds a "Referral received" note to the new chart.
    steps:
      - {actor: clinician2, op: add_insurance, target: other_patient, provider: "Blue Cross Blue Shield of Massachusetts"}
      - {actor: bot, op: register_referral}
      - {actor: bot, op: add_note, target: new_patient, body: "Referral received; chart created from referral document."}
    expect: fault
