effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__assignee:
      param: assignee
    p__due_date:
      literal: '1'
    p__priority:
      param: priority
    p__project:
      param: project
    subject:
      param: subject
    p__tracker:
      param: tracker
    author_id:
      param: bot_user_id
    pin__category_id:
      literal: '1'
    pin__closed_on:
      literal: '1'
    pin__done_ratio:
      literal: '1'
    pin__estimated_hours:
      literal: '1'
    pin__fixed_version_id:
      literal: '1'
    pin__is_private:
      literal: '1'
    pin__lft:
      literal: '1'
    pin__lock_version:
      literal: '1'
    pin__parent_id:
      literal: '1'
    pin__rgt:
      literal: '1'
    pin__start_date:
      literal: '1'
    pin__status_id:
      literal: '1'
    empty__description:
      literal: '1'
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=rows_custom_values|a row beside the main record holds customer_ref
  match:
    main__assignee:
      param: assignee
    main__due_date:
      literal: '1'
    main__priority:
      param: priority
    main__project:
      param: project
    main__subject:
      param: subject
    main__tracker:
      param: tracker
    value:
      param: customer_ref
    pin__custom_field_id:
      literal: '1'
    customized_type:
      literal: Issue
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=rows_custom_values|a row beside the main record holds environment
  match:
    main__assignee:
      param: assignee
    main__due_date:
      literal: '1'
    main__priority:
      param: priority
    main__project:
      param: project
    main__subject:
      param: subject
    main__tracker:
      param: tracker
    value:
      param: environment
    pin__custom_field_id__47c66b:
      literal: '1'
    customized_type:
      literal: Issue
  expected_count: 1
  count_new_only: true
frame:
  ignore_fields:
  - lock_version
  - others
  - updated_on
  target_fields: []
