# Generated by openadapt_flow.generate.verify_contract: kind create_issue, create, fields assignee, customer_ref, description, environment, priority, project, subject, tracker.
# Proposed, not admitted: a person answers QUESTIONS.md first.
schema_version: openadapt.verify/v1
environment_id: generated-redmine
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: &id001
        dbname: redmine
        host: 127.0.0.1
        port: 9606
        user: oa_reader
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."tracker_id" AS TEXT) AS "tracker_id", CAST(t."project_id"
        AS TEXT) AS "project_id", CAST(t."subject" AS TEXT) AS "subject", CAST(t."description" AS TEXT)
        AS "description", CAST(t."due_date" AS TEXT) AS "due_date", CAST(t."category_id" AS TEXT) AS "category_id",
        CAST(t."status_id" AS TEXT) AS "status_id", CAST(t."assigned_to_id" AS TEXT) AS "assigned_to_id",
        CAST(t."priority_id" AS TEXT) AS "priority_id", CAST(t."fixed_version_id" AS TEXT) AS "fixed_version_id",
        CAST(t."author_id" AS TEXT) AS "author_id", CAST(t."lock_version" AS TEXT) AS "lock_version",
        CAST(t."created_on" AS TEXT) AS "created_on", CAST(t."updated_on" AS TEXT) AS "updated_on", CAST(t."start_date"
        AS TEXT) AS "start_date", CAST(t."done_ratio" AS TEXT) AS "done_ratio", CAST(t."estimated_hours"
        AS TEXT) AS "estimated_hours", CAST(t."parent_id" AS TEXT) AS "parent_id", CAST(t."root_id" AS
        TEXT) AS "root_id", CAST(t."lft" AS TEXT) AS "lft", CAST(t."rgt" AS TEXT) AS "rgt", CAST(t."is_private"
        AS TEXT) AS "is_private", CAST(t."closed_on" AS TEXT) AS "closed_on", (SELECT CASE WHEN (SELECT
        COUNT(*) FROM "users" u1 WHERE CAST(CAST(u1."firstname" AS TEXT) || ' ' || CAST(u1."lastname"
        AS TEXT) AS TEXT) = CAST(CAST(a1."firstname" AS TEXT) || ' ' || CAST(a1."lastname" AS TEXT) AS
        TEXT)) = 1 THEN CAST(a1."firstname" AS TEXT) || ' ' || CAST(a1."lastname" AS TEXT) END FROM "users"
        a1 WHERE CAST(a1."id" AS TEXT) = CAST(t."assigned_to_id" AS TEXT)) AS "p__assignee", (SELECT CASE
        WHEN (SELECT COUNT(*) FROM "enumerations" u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name"
        AS TEXT) AS TEXT)) = 1 THEN CAST(a1."name" AS TEXT) END FROM "enumerations" a1 WHERE CAST(a1."id"
        AS TEXT) = CAST(t."priority_id" AS TEXT)) AS "p__priority", (SELECT CASE WHEN (SELECT COUNT(*)
        FROM "projects" u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name" AS TEXT)
        AS TEXT)) = 1 THEN CAST(a1."name" AS TEXT) END FROM "projects" a1 WHERE CAST(a1."id" AS TEXT)
        = CAST(t."project_id" AS TEXT)) AS "p__project", (SELECT CASE WHEN (SELECT COUNT(*) FROM "trackers"
        u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name" AS TEXT) AS TEXT)) = 1 THEN
        CAST(a1."name" AS TEXT) END FROM "trackers" a1 WHERE CAST(a1."id" AS TEXT) = CAST(t."tracker_id"
        AS TEXT)) AS "p__tracker", CASE WHEN t."category_id" IS NULL THEN '1' ELSE '0' END AS "pin__category_id",
        CASE WHEN t."closed_on" IS NULL THEN '1' ELSE '0' END AS "pin__closed_on", CASE WHEN CAST(t."done_ratio"
        AS numeric) = CAST('0' AS numeric) THEN '1' ELSE '0' END AS "pin__done_ratio", CASE WHEN t."estimated_hours"
        IS NULL THEN '1' ELSE '0' END AS "pin__estimated_hours", CASE WHEN t."fixed_version_id" IS NULL
        THEN '1' ELSE '0' END AS "pin__fixed_version_id", CASE WHEN CAST(CAST(t."is_private" AS integer)
        AS numeric) = CAST('0' AS numeric) THEN '1' ELSE '0' END AS "pin__is_private", CASE WHEN CAST(t."lft"
        AS numeric) = CAST('1' AS numeric) THEN '1' ELSE '0' END AS "pin__lft", CASE WHEN CAST(t."lock_version"
        AS numeric) = CAST('1' AS numeric) THEN '1' ELSE '0' END AS "pin__lock_version", CASE WHEN t."parent_id"
        IS NULL THEN '1' ELSE '0' END AS "pin__parent_id", CASE WHEN CAST(t."rgt" AS numeric) = CAST('2'
        AS numeric) THEN '1' ELSE '0' END AS "pin__rgt", CASE WHEN t."start_date" IS NULL THEN '1' ELSE
        '0' END AS "pin__start_date", CASE WHEN CAST(t."status_id" AS numeric) = CAST('1' AS numeric)
        THEN '1' ELSE '0' END AS "pin__status_id", CASE WHEN t."due_date" IS NULL THEN '1' ELSE '0' END
        AS "empty__due_date" FROM "issues" t
    rows_custom_values:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."customized_type" AS TEXT) AS "customized_type",
        CAST(t."customized_id" AS TEXT) AS "customized_id", CAST(t."custom_field_id" AS TEXT) AS "custom_field_id",
        CAST(t."value" AS TEXT) AS "value", (SELECT (SELECT CASE WHEN (SELECT COUNT(*) FROM "users" u2
        WHERE CAST(CAST(u2."firstname" AS TEXT) || ' ' || CAST(u2."lastname" AS TEXT) AS TEXT) = CAST(CAST(a2."firstname"
        AS TEXT) || ' ' || CAST(a2."lastname" AS TEXT) AS TEXT)) = 1 THEN CAST(a2."firstname" AS TEXT)
        || ' ' || CAST(a2."lastname" AS TEXT) END FROM "users" a2 WHERE CAST(a2."id" AS TEXT) = CAST(a1."assigned_to_id"
        AS TEXT)) FROM "issues" a1 WHERE a1."id" = t."customized_id") AS "main__assignee", (SELECT CAST(a1."description"
        AS TEXT) FROM "issues" a1 WHERE a1."id" = t."customized_id") AS "main__description", (SELECT (SELECT
        CASE WHEN (SELECT COUNT(*) FROM "enumerations" u2 WHERE CAST(CAST(u2."name" AS TEXT) AS TEXT)
        = CAST(CAST(a2."name" AS TEXT) AS TEXT)) = 1 THEN CAST(a2."name" AS TEXT) END FROM "enumerations"
        a2 WHERE CAST(a2."id" AS TEXT) = CAST(a1."priority_id" AS TEXT)) FROM "issues" a1 WHERE a1."id"
        = t."customized_id") AS "main__priority", (SELECT (SELECT CASE WHEN (SELECT COUNT(*) FROM "projects"
        u2 WHERE CAST(CAST(u2."name" AS TEXT) AS TEXT) = CAST(CAST(a2."name" AS TEXT) AS TEXT)) = 1 THEN
        CAST(a2."name" AS TEXT) END FROM "projects" a2 WHERE CAST(a2."id" AS TEXT) = CAST(a1."project_id"
        AS TEXT)) FROM "issues" a1 WHERE a1."id" = t."customized_id") AS "main__project", (SELECT CAST(a1."subject"
        AS TEXT) FROM "issues" a1 WHERE a1."id" = t."customized_id") AS "main__subject", (SELECT (SELECT
        CASE WHEN (SELECT COUNT(*) FROM "trackers" u2 WHERE CAST(CAST(u2."name" AS TEXT) AS TEXT) = CAST(CAST(a2."name"
        AS TEXT) AS TEXT)) = 1 THEN CAST(a2."name" AS TEXT) END FROM "trackers" a2 WHERE CAST(a2."id"
        AS TEXT) = CAST(a1."tracker_id" AS TEXT)) FROM "issues" a1 WHERE a1."id" = t."customized_id")
        AS "main__tracker", CASE WHEN CAST(t."custom_field_id" AS numeric) = CAST('1' AS numeric) THEN
        '1' ELSE '0' END AS "pin__custom_field_id", CASE WHEN CAST(t."custom_field_id" AS numeric) = CAST('2'
        AS numeric) THEN '1' ELSE '0' END AS "pin__custom_field_id__47c66b" FROM "custom_values" t
    raw_user_preferences:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."user_id" AS TEXT) AS "user_id", CAST(t."others"
        AS TEXT) AS "others", CAST(t."hide_mail" AS TEXT) AS "hide_mail", CAST(t."time_zone" AS TEXT)
        AS "time_zone" FROM "user_preferences" t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__assignee:
      param: assignee
    description:
      param: description
    p__priority:
      param: priority
    p__project:
      param: project
    subject:
      param: subject
    p__tracker:
      param: tracker
    author_id:
      param: bot_user_id
    pin__category_id:
      literal: '1'
    pin__closed_on:
      literal: '1'
    pin__done_ratio:
      literal: '1'
    pin__estimated_hours:
      literal: '1'
    pin__fixed_version_id:
      literal: '1'
    pin__is_private:
      literal: '1'
    pin__lft:
      literal: '1'
    pin__lock_version:
      literal: '1'
    pin__parent_id:
      literal: '1'
    pin__rgt:
      literal: '1'
    pin__start_date:
      literal: '1'
    pin__status_id:
      literal: '1'
    empty__due_date:
      literal: '1'
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=rows_custom_values|a row beside the main record holds customer_ref
  match:
    main__assignee:
      param: assignee
    main__description:
      param: description
    main__priority:
      param: priority
    main__project:
      param: project
    main__subject:
      param: subject
    main__tracker:
      param: tracker
    value:
      param: customer_ref
    pin__custom_field_id:
      literal: '1'
    customized_type:
      literal: Issue
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=rows_custom_values|a row beside the main record holds environment
  match:
    main__assignee:
      param: assignee
    main__description:
      param: description
    main__priority:
      param: priority
    main__project:
      param: project
    main__subject:
      param: subject
    main__tracker:
      param: tracker
    value:
      param: environment
    pin__custom_field_id__47c66b:
      literal: '1'
    customized_type:
      literal: Issue
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=raw_user_preferences|user_preferences row id=1, changed by the app
  match:
    id:
      literal: '1'
  expected_count: 1
frame:
  target_fields:
  - others
  database:
    dialect: postgresql
    read:
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
    allow_tables:
    - table: journal_details
    - table: custom_values
    - table: issues
    views:
      user_preferences: raw_user_preferences
    settle_s: 1
    settle_attempts: 5
    recheck_after_s: 300.0
