# Generated by openadapt_flow.generate.verify_contract: kind log_time, found, fields activity, comments, hours, issue_subject, project, spent_on.
# Proposed, not admitted: a person answers QUESTIONS.md first.
schema_version: openadapt.verify/v1
environment_id: generated-redmine
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: &id001
        dbname: redmine
        host: 127.0.0.1
        port: 9606
        user: oa_reader
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."project_id" AS TEXT) AS "project_id", CAST(t."user_id"
        AS TEXT) AS "user_id", CAST(t."issue_id" AS TEXT) AS "issue_id", CAST(t."hours" AS TEXT) AS "hours",
        CAST(t."comments" AS TEXT) AS "comments", CAST(t."activity_id" AS TEXT) AS "activity_id", CAST(t."spent_on"
        AS TEXT) AS "spent_on", CAST(t."tyear" AS TEXT) AS "tyear", CAST(t."tmonth" AS TEXT) AS "tmonth",
        CAST(t."tweek" AS TEXT) AS "tweek", CAST(t."created_on" AS TEXT) AS "created_on", CAST(t."updated_on"
        AS TEXT) AS "updated_on", CAST(t."author_id" AS TEXT) AS "author_id", (SELECT CASE WHEN (SELECT
        COUNT(*) FROM "enumerations" u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name"
        AS TEXT) AS TEXT)) = 1 THEN CAST(a1."name" AS TEXT) END FROM "enumerations" a1 WHERE CAST(a1."id"
        AS TEXT) = CAST(t."activity_id" AS TEXT)) AS "p__activity", CASE WHEN CAST(t."hours" AS numeric)
        = CAST(%(v0)s AS numeric) THEN '1' ELSE '0' END AS "p__hours", (SELECT CASE WHEN (SELECT COUNT(*)
        FROM "issues" u1 WHERE CAST(CAST(u1."subject" AS TEXT) AS TEXT) = CAST(CAST(a1."subject" AS TEXT)
        AS TEXT)) = 1 THEN CAST(a1."subject" AS TEXT) END FROM "issues" a1 WHERE CAST(a1."id" AS TEXT)
        = CAST(t."issue_id" AS TEXT)) AS "p__issue_subject", (SELECT CASE WHEN (SELECT COUNT(*) FROM "projects"
        u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name" AS TEXT) AS TEXT)) = 1 THEN
        CAST(a1."name" AS TEXT) END FROM "projects" a1 WHERE CAST(a1."id" AS TEXT) = CAST(t."project_id"
        AS TEXT)) AS "p__project", CASE WHEN t."spent_on" = CAST(%(v1)s AS date) THEN '1' ELSE '0' END
        AS "p__spent_on" FROM "time_entries" t
      sql_query_params:
        v0:
          param: hours
        v1:
          param: spent_on
    raw_user_preferences:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."user_id" AS TEXT) AS "user_id", CAST(t."others"
        AS TEXT) AS "others", CAST(t."hide_mail" AS TEXT) AS "hide_mail", CAST(t."time_zone" AS TEXT)
        AS "time_zone" FROM "user_preferences" t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__activity:
      param: activity
    comments:
      param: comments
    p__hours:
      literal: '1'
    p__issue_subject:
      param: issue_subject
    p__project:
      param: project
    p__spent_on:
      literal: '1'
  expected_count: 1
- kind: record_written
  probe: surface=raw_user_preferences|user_preferences row id=1, changed by the app
  match:
    id:
      literal: '1'
  expected_count: 1
frame:
  target_fields:
  - others
  database:
    dialect: postgresql
    read:
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
    allow_tables:
    - table: journal_details
    - table: time_entries
    views:
      user_preferences: raw_user_preferences
    settle_s: 1
    settle_attempts: 5
    recheck_after_s: 300.0
