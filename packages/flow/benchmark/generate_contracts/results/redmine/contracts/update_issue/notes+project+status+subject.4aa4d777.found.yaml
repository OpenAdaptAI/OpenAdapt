# Generated by openadapt_flow.generate.verify_contract: kind update_issue, found, fields notes, project, status, subject.
# Proposed, not admitted: a person answers QUESTIONS.md first.
schema_version: openadapt.verify/v1
environment_id: generated-redmine
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: &id001
        dbname: redmine
        host: 127.0.0.1
        port: 9606
        user: oa_reader
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."tracker_id" AS TEXT) AS "tracker_id", CAST(t."project_id"
        AS TEXT) AS "project_id", CAST(t."subject" AS TEXT) AS "subject", CAST(t."description" AS TEXT)
        AS "description", CAST(t."due_date" AS TEXT) AS "due_date", CAST(t."category_id" AS TEXT) AS "category_id",
        CAST(t."status_id" AS TEXT) AS "status_id", CAST(t."assigned_to_id" AS TEXT) AS "assigned_to_id",
        CAST(t."priority_id" AS TEXT) AS "priority_id", CAST(t."fixed_version_id" AS TEXT) AS "fixed_version_id",
        CAST(t."author_id" AS TEXT) AS "author_id", CAST(t."lock_version" AS TEXT) AS "lock_version",
        CAST(t."created_on" AS TEXT) AS "created_on", CAST(t."updated_on" AS TEXT) AS "updated_on", CAST(t."start_date"
        AS TEXT) AS "start_date", CAST(t."done_ratio" AS TEXT) AS "done_ratio", CAST(t."estimated_hours"
        AS TEXT) AS "estimated_hours", CAST(t."parent_id" AS TEXT) AS "parent_id", CAST(t."root_id" AS
        TEXT) AS "root_id", CAST(t."lft" AS TEXT) AS "lft", CAST(t."rgt" AS TEXT) AS "rgt", CAST(t."is_private"
        AS TEXT) AS "is_private", CAST(t."closed_on" AS TEXT) AS "closed_on", (SELECT CASE WHEN (SELECT
        COUNT(*) FROM "projects" u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name"
        AS TEXT) AS TEXT)) = 1 THEN CAST(a1."name" AS TEXT) END FROM "projects" a1 WHERE CAST(a1."id"
        AS TEXT) = CAST(t."project_id" AS TEXT)) AS "p__project", (SELECT CASE WHEN (SELECT COUNT(*) FROM
        "issue_statuses" u1 WHERE CAST(CAST(u1."name" AS TEXT) AS TEXT) = CAST(CAST(a1."name" AS TEXT)
        AS TEXT)) = 1 THEN CAST(a1."name" AS TEXT) END FROM "issue_statuses" a1 WHERE CAST(a1."id" AS
        TEXT) = CAST(t."status_id" AS TEXT)) AS "p__status" FROM "issues" t
    rows_journals:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."journalized_id" AS TEXT) AS "journalized_id",
        CAST(t."journalized_type" AS TEXT) AS "journalized_type", CAST(t."user_id" AS TEXT) AS "user_id",
        CAST(t."notes" AS TEXT) AS "notes", CAST(t."created_on" AS TEXT) AS "created_on", CAST(t."private_notes"
        AS TEXT) AS "private_notes", CAST(t."updated_on" AS TEXT) AS "updated_on", CAST(t."updated_by_id"
        AS TEXT) AS "updated_by_id", (SELECT (SELECT CASE WHEN (SELECT COUNT(*) FROM "projects" u2 WHERE
        CAST(CAST(u2."name" AS TEXT) AS TEXT) = CAST(CAST(a2."name" AS TEXT) AS TEXT)) = 1 THEN CAST(a2."name"
        AS TEXT) END FROM "projects" a2 WHERE CAST(a2."id" AS TEXT) = CAST(a1."project_id" AS TEXT)) FROM
        "issues" a1 WHERE a1."id" = t."journalized_id") AS "main__project", (SELECT CAST(a1."subject"
        AS TEXT) FROM "issues" a1 WHERE a1."id" = t."journalized_id") AS "main__subject", CASE WHEN CAST(CAST(t."private_notes"
        AS integer) AS numeric) = CAST('0' AS numeric) THEN '1' ELSE '0' END AS "pin__private_notes",
        CASE WHEN t."updated_by_id" IS NULL THEN '1' ELSE '0' END AS "pin__updated_by_id", CASE WHEN CAST(t."user_id"
        AS numeric) = CAST('5' AS numeric) THEN '1' ELSE '0' END AS "pin__user_id" FROM "journals" t
    raw_user_preferences:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."user_id" AS TEXT) AS "user_id", CAST(t."others"
        AS TEXT) AS "others", CAST(t."hide_mail" AS TEXT) AS "hide_mail", CAST(t."time_zone" AS TEXT)
        AS "time_zone" FROM "user_preferences" t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__project:
      param: project
    p__status:
      param: status
    subject:
      param: subject
  expected_count: 1
- kind: record_written
  probe: surface=rows_journals|a row beside the main record holds notes
  match:
    main__project:
      param: project
    main__subject:
      param: subject
    notes:
      param: notes
    journalized_type:
      literal: Issue
    pin__private_notes:
      literal: '1'
    pin__updated_by_id:
      literal: '1'
    pin__user_id:
      literal: '1'
  expected_count: 1
- kind: record_written
  probe: surface=raw_user_preferences|user_preferences row id=1, changed by the app
  match:
    id:
      literal: '1'
  expected_count: 1
frame:
  target_fields:
  - others
  versions:
    read:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
      sql_query: SELECT CAST(t."journalized_id" AS TEXT) AS "id", CAST(t."id" AS TEXT) AS "ver", CAST(t."user_id"
        AS TEXT) AS "author" FROM "journals" t
    record_field: id
    target_field: id
    version_field: ver
    author_field: author
    self:
    - param: bot_user_id
  database:
    dialect: postgresql
    read:
      sql_driver: psycopg2
      sql_connect_args: *id001
      sql_password_env: REDMINE_RO_DB_PASSWORD
    allow_tables:
    - table: journal_details
    - table: issues
    - table: journals
    views:
      user_preferences: raw_user_preferences
    settle_s: 1
    settle_attempts: 5
    recheck_after_s: 300.0
