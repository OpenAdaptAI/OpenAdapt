# Generated by openadapt_flow.generate.verify_contract: kind create_opportunity, create, fields account, account_city, amount, close_date, currency, name, stage.
# Proposed, not admitted: a person answers QUESTIONS.md first.
schema_version: openadapt.verify/v1
environment_id: generated-espocrm
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: pymysql
      sql_connect_args: &id001
        charset: utf8mb4
        database: espocrm
        host: 127.0.0.1
        port: 9621
        user: deployer_ro
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
      sql_query: SELECT CAST(t.`id` AS CHAR) AS `id`, CAST(t.`name` AS CHAR) AS `name`, CAST(t.`deleted`
        AS CHAR) AS `deleted`, CAST(t.`amount` AS CHAR) AS `amount`, CAST(t.`stage` AS CHAR) AS `stage`,
        CAST(t.`last_stage` AS CHAR) AS `last_stage`, CAST(t.`probability` AS CHAR) AS `probability`,
        CAST(t.`lead_source` AS CHAR) AS `lead_source`, CAST(t.`close_date` AS CHAR) AS `close_date`,
        CAST(t.`description` AS CHAR) AS `description`, CAST(t.`created_at` AS CHAR) AS `created_at`,
        CAST(t.`modified_at` AS CHAR) AS `modified_at`, CAST(t.`amount_currency` AS CHAR) AS `amount_currency`,
        CAST(t.`stream_updated_at` AS CHAR) AS `stream_updated_at`, CAST(t.`account_id` AS CHAR) AS `account_id`,
        CAST(t.`contact_id` AS CHAR) AS `contact_id`, CAST(t.`campaign_id` AS CHAR) AS `campaign_id`,
        CAST(t.`created_by_id` AS CHAR) AS `created_by_id`, CAST(t.`modified_by_id` AS CHAR) AS `modified_by_id`,
        CAST(t.`assigned_user_id` AS CHAR) AS `assigned_user_id`, CAST(t.`version_number` AS CHAR) AS
        `version_number`, (SELECT CAST(a1.`name` AS CHAR) FROM `account` a1 WHERE CAST(a1.`id` AS BINARY)
        = CAST(t.`account_id` AS BINARY)) AS `p__account`, (SELECT CAST(a1.`billing_address_city` AS CHAR)
        FROM `account` a1 WHERE CAST(a1.`id` AS BINARY) = CAST(t.`account_id` AS BINARY)) AS `p__account_city`,
        CASE WHEN CAST(%(v0)s AS CHAR) REGEXP '^-?[0-9]+([.][0-9]+)?$' AND t.`amount` = CAST(%(v0)s AS
        DECIMAL(65,30)) THEN '1' ELSE '0' END AS `p__amount`, CASE WHEN t.`close_date` = CAST(%(v1)s AS
        DATE) THEN '1' ELSE '0' END AS `p__close_date`, CASE WHEN t.`deleted` = CAST('0' AS DECIMAL(65,30))
        THEN '1' ELSE '0' END AS `pin__deleted`, CASE WHEN t.`version_number` = (SELECT s.`version_number`
        FROM `account` s WHERE s.`id` = t.`account_id`) THEN '1' ELSE '0' END AS `pin__version_number`
        FROM `opportunity` t
      sql_query_params:
        v0:
          param: amount
        v1:
          param: close_date
    raw_note:
      kind: sql
      sql_driver: pymysql
      sql_connect_args: *id001
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
      sql_query: SELECT CAST(t.`id` AS CHAR) AS `id`, CAST(t.`deleted` AS CHAR) AS `deleted`, CAST(t.`post`
        AS CHAR) AS `post`, CAST(t.`data` AS CHAR) AS `data`, CAST(t.`type` AS CHAR) AS `type`, CAST(t.`target_type`
        AS CHAR) AS `target_type`, CAST(t.`number` AS CHAR) AS `number`, CAST(t.`is_global` AS CHAR) AS
        `is_global`, CAST(t.`is_internal` AS CHAR) AS `is_internal`, CAST(t.`is_pinned` AS CHAR) AS `is_pinned`,
        CAST(t.`created_at` AS CHAR) AS `created_at`, CAST(t.`modified_at` AS CHAR) AS `modified_at`,
        CAST(t.`parent_id` AS CHAR) AS `parent_id`, CAST(t.`parent_type` AS CHAR) AS `parent_type`, CAST(t.`related_id`
        AS CHAR) AS `related_id`, CAST(t.`related_type` AS CHAR) AS `related_type`, CAST(t.`created_by_id`
        AS CHAR) AS `created_by_id`, CAST(t.`modified_by_id` AS CHAR) AS `modified_by_id`, CAST(t.`super_parent_id`
        AS CHAR) AS `super_parent_id`, CAST(t.`super_parent_type` AS CHAR) AS `super_parent_type` FROM
        `note` t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__account:
      param: account
    p__account_city:
      param: account_city
    p__amount:
      literal: '1'
    p__close_date:
      literal: '1'
    amount_currency:
      param: currency
    name:
      param: name
    stage:
      param: stage
    created_by_id:
      param: bot_user_id
    pin__deleted:
      literal: '1'
    pin__version_number:
      literal: '1'
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=raw_note|1 row(s) the app adds to note
  match:
    created_by_id:
      param: bot_user_id
    deleted:
      literal: '0'
    is_global:
      literal: '0'
    is_internal:
      literal: '0'
    is_pinned:
      literal: '0'
    parent_type:
      literal: Opportunity
    super_parent_type:
      literal: Account
    type:
      literal: Create
  expected_count: 1
  count_new_only: true
frame:
  ignore_fields:
  - modified_at
  - modified_by_id
  - stream_updated_at
  target_fields: []
  database:
    dialect: mysql
    read:
      sql_driver: pymysql
      sql_connect_args: *id001
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
    allow_tables:
    - table: action_history_record
    - table: auth_log_record
    - table: opportunity
    views:
      note: raw_note
    settle_s: 1
    settle_attempts: 5
    new_row_fields:
      note:
      - created_at
      - data
      - id
      - modified_at
      - modified_by_id
      - number
      - parent_id
      - post
      - related_id
      - related_type
      - super_parent_id
      - target_type
    ignore_columns:
      account:
      - stream_updated_at
      lead:
      - modified_at
      - modified_by_id
      - stream_updated_at
      contact:
      - stream_updated_at
    recheck_after_s: 300.0
