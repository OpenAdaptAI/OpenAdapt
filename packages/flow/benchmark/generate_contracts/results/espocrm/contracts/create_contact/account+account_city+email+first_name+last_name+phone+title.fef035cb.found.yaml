        `contact` a1 WHERE a1.`id` = t.`entity_id`) AS `main__account`, (SELECT (SELECT CAST(a2.`billing_address_city`
        AS CHAR) FROM `account` a2 WHERE CAST(a2.`id` AS BINARY) = CAST(a1.`account_id` AS BINARY)) FROM
        `contact` a1 WHERE a1.`id` = t.`entity_id`) AS `main__account_city`, (SELECT CAST(a1.`first_name`
