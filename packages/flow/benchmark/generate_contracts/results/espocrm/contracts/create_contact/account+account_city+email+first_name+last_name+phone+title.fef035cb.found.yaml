        AS CHAR) FROM `contact` a1 WHERE a1.`id` = t.`entity_id`) AS `main__first_name`, (SELECT CAST(a1.`last_name`
        AS CHAR) FROM `contact` a1 WHERE a1.`id` = t.`entity_id`) AS `main__last_name`, (SELECT CAST(a1.`name`
