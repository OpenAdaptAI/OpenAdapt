# Generated by openadapt_flow.generate.verify_contract: kind update_lead, found, fields company, field, first_name, last_name, value.
# Proposed, not admitted: a person answers QUESTIONS.md first.
schema_version: openadapt.verify/v1
environment_id: generated-espocrm
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: pymysql
      sql_connect_args: &id001
        charset: utf8mb4
        database: espocrm
        host: 127.0.0.1
        port: 9621
        user: deployer_ro
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
      sql_query: SELECT CAST(t.`id` AS CHAR) AS `id`, CAST(t.`deleted` AS CHAR) AS `deleted`, CAST(t.`salutation_name`
        AS CHAR) AS `salutation_name`, CAST(t.`first_name` AS CHAR) AS `first_name`, CAST(t.`last_name`
        AS CHAR) AS `last_name`, CAST(t.`title` AS CHAR) AS `title`, CAST(t.`status` AS CHAR) AS `status`,
        CAST(t.`source` AS CHAR) AS `source`, CAST(t.`industry` AS CHAR) AS `industry`, CAST(t.`opportunity_amount`
        AS CHAR) AS `opportunity_amount`, CAST(t.`website` AS CHAR) AS `website`, CAST(t.`address_street`
        AS CHAR) AS `address_street`, CAST(t.`address_city` AS CHAR) AS `address_city`, CAST(t.`address_state`
        AS CHAR) AS `address_state`, CAST(t.`address_country` AS CHAR) AS `address_country`, CAST(t.`address_postal_code`
        AS CHAR) AS `address_postal_code`, CAST(t.`do_not_call` AS CHAR) AS `do_not_call`, CAST(t.`description`
        AS CHAR) AS `description`, CAST(t.`converted_at` AS CHAR) AS `converted_at`, CAST(t.`created_at`
        AS CHAR) AS `created_at`, CAST(t.`modified_at` AS CHAR) AS `modified_at`, CAST(t.`account_name`
        AS CHAR) AS `account_name`, CAST(t.`middle_name` AS CHAR) AS `middle_name`, CAST(t.`opportunity_amount_currency`
        AS CHAR) AS `opportunity_amount_currency`, CAST(t.`stream_updated_at` AS CHAR) AS `stream_updated_at`,
        CAST(t.`created_by_id` AS CHAR) AS `created_by_id`, CAST(t.`modified_by_id` AS CHAR) AS `modified_by_id`,
        CAST(t.`assigned_user_id` AS CHAR) AS `assigned_user_id`, CAST(t.`campaign_id` AS CHAR) AS `campaign_id`,
        CAST(t.`created_account_id` AS CHAR) AS `created_account_id`, CAST(t.`created_contact_id` AS CHAR)
        AS `created_contact_id`, CAST(t.`created_opportunity_id` AS CHAR) AS `created_opportunity_id`
        FROM `lead` t
    rows_entity_email_address:
      kind: sql
      sql_driver: pymysql
      sql_connect_args: *id001
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
      sql_query: SELECT CAST(t.`id` AS CHAR) AS `id`, CAST(t.`entity_id` AS CHAR) AS `entity_id`, CAST(t.`email_address_id`
        AS CHAR) AS `email_address_id`, CAST(t.`entity_type` AS CHAR) AS `entity_type`, CAST(t.`primary`
        AS CHAR) AS `primary`, CAST(t.`deleted` AS CHAR) AS `deleted`, (SELECT CAST(a1.`account_name`
        AS CHAR) FROM `lead` a1 WHERE a1.`id` = t.`entity_id`) AS `main__company`, (SELECT CAST(a1.`first_name`
        AS CHAR) FROM `lead` a1 WHERE a1.`id` = t.`entity_id`) AS `main__first_name`, (SELECT CAST(a1.`last_name`
        AS CHAR) FROM `lead` a1 WHERE a1.`id` = t.`entity_id`) AS `main__last_name`, (SELECT CAST(a1.`name`
        AS CHAR) FROM `email_address` a1 WHERE CAST(a1.`id` AS BINARY) = CAST(t.`email_address_id` AS
        BINARY)) AS `p__value` FROM `entity_email_address` t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    account_name:
      param: company
    first_name:
      param: first_name
    last_name:
      param: last_name
  expected_count: 1
- kind: record_written
  probe: surface=rows_entity_email_address|a row beside the main record holds value
  match:
    main__company:
      param: company
    main__first_name:
      param: first_name
    main__last_name:
      param: last_name
    p__value:
      param: value
      kind: email
  expected_count: 1
frame:
  ignore_fields:
  - modified_at
  - modified_by_id
  - stream_updated_at
  target_fields: []
  versions:
    read:
      kind: sql
      sql_driver: pymysql
      sql_connect_args: *id001
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
      sql_query: SELECT CAST(t.`target_id` AS CHAR) AS `id`, CAST(t.`id` AS CHAR) AS `ver`, CAST(t.`user_id`
        AS CHAR) AS `author` FROM `action_history_record` t WHERE CAST(t.`target_type` AS CHAR) = 'Lead'
    record_field: id
    target_field: id
    version_field: ver
    author_field: author
    self:
    - param: bot_user_id
  database:
    dialect: mysql
    read:
      sql_driver: pymysql
      sql_connect_args: *id001
      sql_password_env: ESPOCRM_DB_RO_PASSWORD
    allow_tables:
    - table: action_history_record
    - table: auth_log_record
    - table: note
    - table: entity_email_address
    - table: lead
    views: {}
    settle_s: 1
    settle_attempts: 5
    ignore_columns:
      account:
      - stream_updated_at
      contact:
      - stream_updated_at
    recheck_after_s: 300.0
