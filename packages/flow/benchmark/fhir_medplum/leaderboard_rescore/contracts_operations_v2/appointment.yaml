# public/contracts/appointment.yaml, unchanged, plus the Medplum operation semantics version 2 it pins (exploratory)
# (app_semantics/medplum.yaml). test_ensure_record_operations.py checks the rest stays equal.
# Book an appointment exactly once, checked through FHIR only.
schema_version: openadapt.ensure-record/v1
resource_type: Appointment
base_url: ${BENCH_FHIR_URL}
access_token_env: BENCH_RECORD_TOKEN
self: ["${BENCH_AGENT_REF}"]

fields:
  status: {path: status}
  start: {path: start, compare: instant}
  end: {path: end, compare: instant}
  patient: {path: "participant[actor.reference^=Patient/].actor.reference"}
  practitioner: {path: "participant[actor.reference^=Practitioner/].actor.reference"}

identity:
  - [patient, start]
search: {patient: patient}

closed: true
allow:
  - participant.status="accepted"
  - participant.actor.display

change_feed:
  audit: {heartbeat: true}
  history: true
  history_author: false
  sweep_types: [Patient, AllergyIntolerance, Appointment, Observation, Condition, Encounter]
settle_s: 1

semantics: {path: ../../app_semantics/medplum-v2.yaml, app: medplum, version: 2, sha256: 6b6accdd943039a6f9d46d05a23f37b596ba7dd0557414922d478385989dcc34}
