# public/contracts/patient.yaml, unchanged, plus the Medplum operation semantics version 2 it pins (exploratory)
# (app_semantics/medplum.yaml). test_ensure_record_operations.py checks the rest stays equal.
# Register a person on Medplum exactly once, checked through FHIR only.
# The same shape as ../../readpath/ensure_patient.yaml, with the task's
# parameter names, and the `use` codes FHIR clients commonly add allowed.
schema_version: openadapt.ensure-record/v1
resource_type: Patient
base_url: ${BENCH_FHIR_URL}
access_token_env: BENCH_RECORD_TOKEN
self: ["${BENCH_AGENT_REF}"]

fields:
  given: {path: name.given, compare: casefold}
  family: {path: name.family, compare: casefold}
  birthDate: {path: birthDate, compare: date}
  gender: {path: gender}
  line: {path: address.line, compare: casefold}
  city: {path: address.city, compare: casefold}
  state: {path: address.state}
  postalCode: {path: address.postalCode}
  phone: {path: "telecom[system=phone].value", compare: digits}
  email: {path: "telecom[system=email].value", compare: casefold}

identity:
  - [given, family, birthDate]
  - [email]
search: {given: given, family: family, birthDate: birthdate, email: email}

closed: true
allow:
  - active=true
  - name.use="official"
  - address.use="home"
  - telecom.use="home"
  - telecom.use="mobile"

change_feed:
  audit: {heartbeat: true}
  history: true
  history_author: false
  sweep_types: [Patient, AllergyIntolerance, Appointment, Observation, Condition, Encounter]
settle_s: 1

semantics: {path: ../../app_semantics/medplum-v2.yaml, app: medplum, version: 2, sha256: 6b6accdd943039a6f9d46d05a23f37b596ba7dd0557414922d478385989dcc34}
