# Written with expected outcomes before any run (2026-10-29). Synthetic data.
schema: openadapt.medplum-fault-suite/v1
resource_type: Immunization
cases:
- id: v1
  class: void_lookalike_then_create
  why: an entered-in-error record asserts nothing, so the create is the only fact
  params:
    patient:
      ref: patient
    vaccine_code: '140'
    vaccine_display: Influenza, seasonal, injectable, preservative free
    occurrence_date: '2025-10-14'
    lot_number: VD1001
  seed:
  - &id001
    as: patient
    resource:
      resourceType: Patient
      name:
      - use: official
        family: Okafor
        given:
        - Ngozi
      birthDate: '1971-02-03'
      gender: female
  - as: void
    resource:
      resourceType: Immunization
      status: entered-in-error
      vaccineCode:
        coding:
        - system: http://hl7.org/fhir/sid/cvx
          code: '140'
          display: Influenza, seasonal, injectable, preservative free
      patient:
        ref: patient
      occurrenceDateTime: '2025-10-14'
      primarySource: false
      lotNumber: VD1001
  run:
  - &id002
    actor: bot
    op: create
    resource:
      resourceType: Immunization
      status: completed
      vaccineCode:
        coding:
        - system: http://hl7.org/fhir/sid/cvx
          code: '140'
          display: Influenza, seasonal, injectable, preservative free
      patient:
        ref: patient
      occurrenceDateTime: '2025-10-14'
      primarySource: false
      lotNumber: VD1001
    as: created
  expected:
    outcome: created_verified
    id: created
