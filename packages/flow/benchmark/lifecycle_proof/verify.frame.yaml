# CANDIDATE (not admitted): the OpenEMR referral contract with the fixes the
# Phase 0 independent fault suite asked for. verify.yaml is the admitted one.
#
# Beyond verify.yaml it:
#   - reads history_data, pnotes, lists and insurance_data (read-only SQL)
#     beside the patient, so the frame sees writes there (record.surface);
#   - requires one history_data row per new chart (frame.side_records);
#   - checks the primary care provider, mapped from the name the referral
#     prints to the users.id the chart stores;
#   - attributes changes through OpenEMR's audit trail: UI writes in `log` by
#     user name, API writes in `api_log` by user id, keyed by pid on every
#     table (frame.attribution.record_key).
# The source check (provenance against the referral) is a run input
# (verify-run --provenance/--source), not part of this file.
#
# Needs #1570, #1571, #1572 and #1576. Made-up patients only.
schema_version: openadapt.verify/v1
environment_id: openemr-local-fixture-7c96c8eefe46
minimum_effect_strength: independent_system_of_record

verifier:
  kind: surfaces
  surfaces:
    patient:
      kind: rest
      base_url: ${OPENEMR_API_URL:-https://127.0.0.1:9300}
      records_path: /apis/default/api/patient?_limit=1000
      records_key: data
      auth:
        bearer_env: OPENEMR_ORACLE_TOKEN
    history: &readonly
      kind: sql
      sql_driver: benchmark.lifecycle_proof.readonly_db
      sql_connect_args:
        container: ${OPENEMR_DB_CONTAINER}
        user: ${OPENEMR_READONLY_DB_USER:-oa_audit_reader}
        database: openemr
      sql_password_env: OPENEMR_READONLY_DB_PASSWORD
      sql_query: SELECT * FROM history_data
    notes:
      <<: *readonly
      sql_query: SELECT * FROM pnotes
    allergies:
      <<: *readonly
      sql_query: SELECT * FROM lists
    insurance:
      <<: *readonly
      sql_query: SELECT * FROM insurance_data

record:
  name: patient
  surface: patient
  match: [email, lname]
  duplicate_key: email
  exact_new_set: true
  identity_field: uuid
  fields:
    email: email
    lname: lname
    title: title
    fname: fname
    DOB: DOB
    sex: sex
    street: street
    city: city
    state: {param: state_label, map: {Massachusetts: MA}}
    postal_code: postal_code
    phone_home: phone_home
    country_code: country_code
    # The fixture's two providers (users.id as seeded by the suite).
    providerID: {param: provider, map: {"Dr. Iris Holt": "6", "Dr. Owen Hale": "7"}}

frame:
  identity_field: id
  side_records:
    - {surface: history, link_field: pid, of_surface: patient, of_field: pid}
  attribution:
    kind: audit_read
    actor_field: user
    record_field: patient_id
    record_key: pid
    self: [openadapt_actor]
    read:
      <<: *readonly
      sql_query: >-
        SELECT CONCAT('log-', id) AS id, user, patient_id FROM log
        WHERE event LIKE 'patient-record-%' AND event <> 'patient-record-select'
        AND patient_id > 0 AND user <> ''
        UNION ALL
        SELECT CONCAT('api-', a.id) AS id, u.username AS user, a.patient_id
        FROM api_log a JOIN users u ON u.id = a.user_id
        WHERE a.method IN ('POST', 'PUT', 'PATCH', 'DELETE') AND a.patient_id > 0
