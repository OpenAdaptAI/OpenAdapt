# Proposed by `openadapt-flow record --verify` from the records read before and
# after the demonstration. Nothing here is trusted yet. For each effect:
#   - remove match fields that change on every save (timestamps, versions);
#   - check that each {param: ...} is the input that should fill that field;
#   - delete the `needs_operator_confirmation: true` line.
# verify-run refuses this file, and qualify reports a problem, until every
# such line is gone.
schema_version: openadapt.verify/v1
verifier:
  kind: rest
  base_url: ${APP_URL}
  records_path: /api/db
  records_complete: true
effects:
- kind: record_written
  match:
    amount:
      param: amount
    loan_id:
      param: loan_id
    memo:
      param: memo
    product:
      param: product
    source:
      literal: replay
    surface:
      literal: disbursements
  count_new_only: true
  probe: exactly one new record with amount=parameter 'amount', loan_id=parameter
    'loan_id', memo=parameter 'memo', product=parameter 'product', source='replay',
    surface='disbursements' (proposed from the records read while recording)
  needs_operator_confirmation: true
