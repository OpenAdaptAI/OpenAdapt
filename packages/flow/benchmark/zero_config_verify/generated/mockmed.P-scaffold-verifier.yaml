# DRAFT record check from `openadapt-flow scaffold-verifier`. It is NOT working:
# its fault test found misses (listed below and in record_check.proof.json). Fix the reads
# or add the missing ones, then run scaffold-verifier again.
#
# MISS: collateral_unaudited: a stray row written to a table this check does not read (the check reads only rest_read; a write anywhere else passes it (give a database read path with --db, or more reads))
#
# verify-run refuses this file until every `needs_operator_confirmation: true`
# line is gone; do not remove them while misses remain.
schema_version: openadapt.verify/v1
verifier:
  kind: surfaces
  surfaces:
    rest_read:
      kind: rest
      base_url: ${APP_URL}
      records_path: /api/db
      records_complete: true
    rest_read.content:
      kind: rest
      base_url: ${APP_URL}
      records_path: /api/db
      records_complete: true
      records_drop_fields:
      - id
effects:
- kind: record_written
  match:
    note:
      param: note
    patient_id:
      param: patient_id
    type:
      param: type
  count_new_only: true
  risk: irreversible
  probe: surface=rest_read|exactly one new record with the run's values; no record
    that was there before may disappear
  needs_operator_confirmation: true
- kind: record_written
  match:
    _openadapt_no_such_field:
      literal: '-'
  expected_count: 0
  count_new_only: true
  risk: irreversible
  probe: surface=rest_read.content|no record that was there before changes or disappears
    (records compared by content, not id)
  needs_operator_confirmation: true
