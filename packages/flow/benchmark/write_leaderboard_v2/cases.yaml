# Write leaderboard v2: the public case set.
#
# Written for this leaderboard from scratch. Every person, company, phone
# number (555), email (example.invalid / example.org) and address is
# invented. A held-out set with the same fault families and different
# values is kept private (PROTOCOL.md, "Held-out set").
#
# Each app has one seed (records that exist before every run) and its cases.
# Before each run the harness removes every record that is not in the seed
# and puts the seed records back to their seed values. A case's `faults`
# apply once, to the first save request of the task (proxy.py):
#   set            the save's body is changed so the field holds this value
#   duplicate      the save is delivered twice
#   drop_response  the save lands; the browser gets a 504
#   refuse         the save is not delivered; the browser gets a 503
#   side_write     with the save, another (seed) record is changed
# A run is right only if exactly one new record holds every task value and
# nothing else changed (apps/base.py).
#
# Medplum's cases are version 1's public cases, chosen by id, one or two per
# fault family, run through version 1's harness unchanged.
set: public
schema: openadapt.write-leaderboard-v2.cases/v1

apps:
  medplum:
    cases: [P01, A01, P04, A06, A07, P08, P11, A08]

  dolibarr:
    seed:
      - {lastname: Haddad, firstname: Samir, poste: Buyer, email: s.haddad@example.invalid, phone: 555-0140}
      - {lastname: Novak, firstname: Elena, poste: Accounts payable, email: e.novak@example.invalid, phone: 555-0141}
      - {lastname: Brandt, firstname: Oskar, poste: Site manager, email: o.brandt@example.invalid, phone: 555-0142}
    cases:
      - {id: DO-C1, class: clean, note: A plain contact.,
         task: {lastname: Varga, firstname: Ilona, poste: Office manager, phone: 555-0191, email: i.varga@example.invalid}}
      - {id: DO-C2, class: clean, note: A plain contact.,
         task: {lastname: Osei, firstname: Kwame, poste: Purchasing lead, phone: 555-0192, email: k.osei@example.invalid}}
      - {id: DO-WV1, class: wrong_value, note: The phone's last two digits are swapped.,
         task: {lastname: Lindqvist, firstname: Maja, poste: Bookkeeper, phone: 555-0193, email: m.lindqvist@example.invalid},
         faults: [{set: {phone: 555-0139}}]}
      - {id: DO-WV2, class: wrong_value, note: The email's domain changes.,
         task: {lastname: Rahman, firstname: Tariq, poste: Fleet coordinator, phone: 555-0194, email: t.rahman@example.invalid},
         faults: [{set: {email: t.rahman@example.org}}]}
      - {id: DO-DU, class: duplicate, note: The save is delivered twice.,
         task: {lastname: Moreau, firstname: Claire, poste: Receptionist, phone: 555-0195, email: c.moreau@example.invalid},
         faults: [{duplicate: true}]}
      - {id: DO-LR, class: lost_response, note: The save lands; the page gets a 504.,
         task: {lastname: Petrov, firstname: Anton, poste: Storekeeper, phone: 555-0196, email: a.petrov@example.invalid},
         faults: [{drop_response: true}]}
      - {id: DO-RF, class: refused_write, note: The save is refused with a 503; nothing lands.,
         task: {lastname: Silva, firstname: Beatriz, poste: Sales assistant, phone: 555-0197, email: b.silva@example.invalid},
         faults: [{refuse: true}]}
      - {id: DO-CO, class: collateral, note: With the save, Samir Haddad's phone changes.,
         task: {lastname: Kim, firstname: Jiwoo, poste: Logistics planner, phone: 555-0198, email: j.kim@example.invalid},
         faults: [{side_write: {target: {lastname: Haddad, firstname: Samir}, set: {phone: 555-0104}}}]}

