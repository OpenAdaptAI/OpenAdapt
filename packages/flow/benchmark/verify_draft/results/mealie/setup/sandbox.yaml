schema_version: openadapt.verify-sandbox/v1
app:
  base_url: http://127.0.0.1:9664
actors:
  agent:
    id: 2c154b37-6a87-4f15-8e2a-40e67cf3f48a
    login:
      method: POST
      path: /api/auth/token
      token_field: access_token
      form:
        username: changeme@example.com
        password: ${VD_MEALIE_ADMIN_PW}
  other:
    id: fba45ac9-e83c-43c7-b1d4-6681298112bd
    login:
      method: POST
      path: /api/auth/token
      token_field: access_token
      form:
        username: cook2
        password: ${VD_MEALIE_COOK_PW}
store:
  dialect: postgresql
  read:
    sql_driver: psycopg2
    sql_connect_args:
      host: 127.0.0.1
      port: 9665
      dbname: mealie
      user: vd_reader
    sql_password_env: VD_MEALIE_READER_PW
  admin:
    sql_driver: psycopg2
    sql_connect_args:
      host: 127.0.0.1
      port: 9665
      dbname: mealie
      user: mealie
    sql_password_env: VD_MEALIE_PG_PW
