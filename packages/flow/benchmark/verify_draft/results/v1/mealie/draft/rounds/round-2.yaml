schema_version: openadapt.verify/v1
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_query: SELECT CAST(r."id" AS TEXT) AS "id", CAST(r."slug" AS TEXT) AS "slug", CAST(r."name" AS TEXT) AS "name", CAST(r."description" AS TEXT) AS "description", CAST(r."description_normalized" AS TEXT) AS "description_normalized", CAST(r."recipe_yield" AS TEXT) AS "recipe_yield", CAST(r."group_id" AS TEXT) AS "group_id" FROM "recipes" r
effects:
- kind: record_written
  probe: "surface=record|recipe by slug has the new description and yield"
  match:
    slug: {param: slug}
    description: {param: description}
    recipe_yield: {param: recipe_yield}
  expected_count: 1
frame:
  identity_field: id
  target_fields_by_surface:
    record: [description, description_normalized, recipe_yield]
  database:
    dialect: postgresql
    allow_tables:
    - {table: recipe_instructions, mode: skip, reason: "Mealie deletes and re-inserts the recipe instruction rows with new ids on every PATCH; contents are unchanged"}
    - {table: recipe_nutrition, mode: skip, reason: "Mealie deletes and re-inserts the recipe nutrition row with a new id on every PATCH"}
    - {table: recipe_settings, mode: skip, reason: "Mealie deletes and re-inserts the recipe settings row with a new id on every PATCH"}
    - {table: recipes_ingredients, mode: skip, reason: "Mealie deletes and re-inserts the recipe ingredient rows with new ids on every PATCH; contents are unchanged"}
    ignore_columns:
      recipes: [date_updated, update_at]
    views:
      recipes: record
    settle_s: 1
    settle_attempts: 3
    recheck_after_s: 300
