schema_version: openadapt.verify/v1
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."loan_id" AS TEXT) AS "loan_id", CAST(t."product" AS TEXT) AS "product", CAST(t."amount" AS TEXT) AS "amount", CAST(t."memo" AS TEXT) AS "memo", CAST(t."source" AS TEXT) AS "source", CAST(t."record_key" AS TEXT) AS "record_key", CAST(t."surface" AS TEXT) AS "surface" FROM "records" t
effects:
- kind: record_written
  probe: surface=record|one new disbursement on the named loan with the requested amount and memo
  match:
    loan_id: {param: loan_id}
    product: {param: product}
    amount: {param: amount}
    memo: {param: memo}
    surface: {literal: disbursements}
  expected_count: 1
  count_new_only: true
frame:
  identity_field: id
  target_fields_by_surface:
    record: []
  database:
    dialect: sqlite
    views:
      records: record
    new_row_fields:
      records: [id, source, record_key]
    settle_s: 1
    settle_attempts: 3
    recheck_after_s: 300
