# Drafted by a model and admitted by OpenAdapt qualification (openadapt verify draft). Runs make no model calls.
schema_version: openadapt.verify/v1
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_query: SELECT CAST(p."id" AS TEXT) AS "id", CAST(p."mrn" AS TEXT) AS "mrn",
        CAST(p."first_name" AS TEXT) AS "first_name", CAST(p."last_name" AS TEXT)
        AS "last_name", CAST(p."dob" AS TEXT) AS "dob", CAST(p."phone" AS TEXT) AS
        "phone", CAST(p."email" AS TEXT) AS "email", CAST(p."status" AS TEXT) AS "status",
        CAST(p."merged_into" AS TEXT) AS "merged_into", CAST(p."version" AS TEXT)
        AS "version", CAST(p."updated_by" AS TEXT) AS "updated_by" FROM "patients"
        p
      sql_driver: psycopg2
      sql_connect_args: &id001
        host: 127.0.0.1
        port: 9796
        dbname: wb_mockmed
        user: wb_reader
    audit:
      kind: sql
      sql_query: SELECT CAST(a."id" AS TEXT) AS "id", CAST(a."actor" AS TEXT) AS "actor",
        CAST(a."table_name" AS TEXT) AS "table_name", CAST(a."record_id" AS TEXT)
        AS "record_id", CAST(a."event" AS TEXT) AS "event", CAST(p."mrn" AS TEXT)
        AS "mrn" FROM "audit_log" a JOIN "patients" p ON a."table_name" = 'patients'
        AND a."record_id" = p."id"
      sql_driver: psycopg2
      sql_connect_args: *id001
effects:
- kind: record_written
  probe: surface=record|patient by MRN has the new phone and email
  match:
    mrn:
      param: mrn
    phone:
      param: phone
    email:
      param: email
  expected_count: 1
- kind: record_written
  probe: surface=audit|exactly one new update audit row for this patient
  match:
    mrn:
      param: mrn
    table_name:
      literal: patients
    event:
      literal: update
  expected_count: 1
  count_new_only: true
frame:
  identity_field: id
  target_fields_by_surface:
    record:
    - phone
    - email
    - version
    - updated_by
  database:
    dialect: postgresql
    views:
      patients: record
    judged_by:
      audit_log: audit
    new_row_fields:
      audit_log:
      - id
      - record_id
      - actor
    settle_s: 1
    settle_attempts: 3
    recheck_after_s: 300
    read:
      sql_driver: psycopg2
      sql_connect_args: *id001
