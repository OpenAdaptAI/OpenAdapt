actors:
  agent:
    id: clinician
    login:
      method: POST
      path: /login
      form:
        username: clinician
        password: synthetic
  other:
    id: clinician
    login:
      method: POST
      path: /login
      form:
        username: clinician
        password: synthetic
store:
