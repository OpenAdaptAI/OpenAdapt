      host: 127.0.0.1
      port: 9796
      dbname: wb_mockmed
      user: wb_reader
  admin:
    sql_driver: psycopg2
    sql_connect_args:
      host: 127.0.0.1
      port: 9796
      dbname: wb_mockmed
      user: wb_admin
