schema_version: openadapt.verify/v1
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_query: SELECT CAST(r."id" AS TEXT) AS "id", CAST(r."slug" AS TEXT) AS "slug", CAST(r."name" AS TEXT) AS "name", CAST(r."description" AS TEXT) AS "description", CAST(r."description_normalized" AS TEXT) AS "description_normalized", CAST(r."recipe_yield" AS TEXT) AS "recipe_yield", CAST(r."group_id" AS TEXT) AS "group_id" FROM "recipes" r
effects:
- kind: record_written
  probe: surface=record|recipe named by slug has the new description and yield
  match:
    slug: {param: slug}
    description: {param: description}
    recipe_yield: {param: recipe_yield}
  expected_count: 1
frame:
  identity_field: id
  target_fields_by_surface:
    record: [description, description_normalized, recipe_yield]
  database:
    dialect: postgresql
    allow_tables:
    - {table: recipe_instructions, mode: skip, reason: "Mealie deletes and re-inserts every instruction row of the saved recipe with fresh ids on each save regardless of values written"}
    - {table: recipe_nutrition, mode: skip, reason: "Mealie deletes and re-inserts the nutrition row of the saved recipe with a fresh id on each save"}
    - {table: recipe_settings, mode: skip, reason: "Mealie deletes and re-inserts the settings row of the saved recipe with a fresh id on each save"}
    - {table: recipes_ingredients, mode: skip, reason: "Mealie deletes and re-inserts every ingredient row of the saved recipe with fresh ids on each save"}
    - {table: api_extras, mode: skip, reason: "read account has no SELECT on its id sequence so it cannot be snapshotted; not written by a recipe description/yield patch"}
    - {table: group_meal_plans, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: ingredient_food_extras, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: invite_tokens, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: long_live_tokens, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: notes, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: password_reset_tokens, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: recipe_assets, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: recipe_ingredient_ref_link, mode: skip, reason: "read account has no SELECT on its id sequence; child link rows rewritten with instructions on save and never hold a task value"}
    - {table: server_tasks, mode: skip, reason: "read account has no SELECT on its id sequence; background task log"}
    - {table: shopping_list_extras, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    - {table: shopping_list_item_extras, mode: skip, reason: "read account has no SELECT on its id sequence; not written by a recipe description/yield patch"}
    ignore_columns:
      recipes: [date_updated, update_at]
    views:
      recipes: record
    settle_s: 1
    settle_attempts: 3
    recheck_after_s: 300
