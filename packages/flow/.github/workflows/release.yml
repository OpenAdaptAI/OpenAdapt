name: Release and PyPI Publish

# A reviewed pull request prepares the version files, lock file, changelog, and
# package inventory. A dispatch from protected main can then create one
# annotated tag through the release App. The tag event rebuilds and publishes
# the exact source through the protected PyPI environment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Reviewed version already present on protected main (for example 1.34.0)"
        type: string
        required: true
      backfill_github_release:
        description: "Recovery: create the missing GitHub Release for a version that is already tagged and already on PyPI, instead of tagging a new one"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a versioned dispatch from protected main
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "The tag-creation path accepts workflow_dispatch only."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Release tag creation must be dispatched from protected main."
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact stable semantic version such as 1.34.0"
            exit 1
          fi

  create-release-tag:
    needs: validate-dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-dispatch.result == 'success' && !inputs.backfill_github_release }}
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      actions: write
      contents: read
    steps:
      - name: Create the exact release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout the dispatched main commit with the release App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"

      - name: Require the reviewed release candidate on current main
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${current_main}" != "${GITHUB_SHA}" ] || [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Refusing a stale release dispatch. Current main is ${current_main}; the dispatch is ${GITHUB_SHA}."
            exit 1
          fi

          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${project_version}" != "${RELEASE_VERSION}" ]; then
            echo "pyproject.toml contains ${project_version}; the reviewed version input is ${RELEASE_VERSION}."
            exit 1
          fi
          python scripts/check_release_consistency.py
          if ! grep -Eq "^## v${RELEASE_VERSION} \(" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for v${RELEASE_VERSION}."
            exit 1
          fi

          release_tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "${release_tag} already exists. Rerun its tag workflow instead of creating another ref."
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_VERSION}" python - <<'PY'
          import os
          import re
          import subprocess

          requested = tuple(int(part) for part in os.environ["RELEASE_VERSION"].split("."))
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()
          existing = [
              tuple(int(part) for part in match.groups())
              for tag in tags
              if (match := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag))
          ]
          if existing and requested <= max(existing):
              raise SystemExit(
                  f"reviewed version {os.environ['RELEASE_VERSION']} is not newer than the latest tag"
              )
          PY

      - name: Require exact-main release qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_ci.py \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --dispatch-missing \
            --ref "${GITHUB_REF_NAME}" \
            --wait-seconds 5400 \
            --poll-seconds 10

      # The validator needs only PyYAML + stdlib (no package install, no
      # browser), matching the gate in validate-claims.yml. Installing the
      # whole package here would let a heavy dependency break the release.
      - name: Install PyYAML
        run: pip install "pyyaml>=6"

      - name: Verify the claims registry
        run: python scripts/validate_claims.py --check --structure-only

      - name: Build and verify the exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --sdist
          python scripts/check_release_consistency.py --require-dist
          if ! git diff --quiet --exit-code; then
            echo "The release build changed tracked files. Prepare those changes in the reviewed release pull request."
            git --no-pager diff
            exit 1
          fi

      - name: Create and push one annotated release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${current_main}" != "${GITHUB_SHA}" ]; then
            echo "Refusing a stale release tag. Current main is ${current_main}; the qualified candidate is ${GITHUB_SHA}."
            exit 1
          fi
          git config user.name "openadapt-release[bot]"
          git config user.email "openadapt-release[bot]@users.noreply.github.com"
          git tag --annotate "${release_tag}" "${GITHUB_SHA}" --message "${release_tag}"
          git push origin "refs/tags/${release_tag}"

  # Recovery path for a publication that reached PyPI and stopped before the
  # GitHub Release. The tag cannot be pushed twice, so the tag event cannot be
  # replayed; this job completes the second surface for the newest release tag
  # and never touches PyPI. It republishes nothing: it attaches the exact files
  # PyPI already holds, verified against the digests PyPI declares for them.
  backfill-github-release:
    needs: validate-dispatch
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-dispatch.result == 'success' && inputs.backfill_github_release }}
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      actions: read
      contents: read
    steps:
      - name: Create the exact release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout the published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the newest release tag and its reviewed version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          if [ "$(git cat-file -t "refs/tags/${release_tag}")" != "tag" ]; then
            echo "${release_tag} is not an annotated tag."
            exit 1
          fi
          tagged_commit="$(git rev-parse "refs/tags/${release_tag}^{}")"
          if [ "$(git rev-parse HEAD)" != "${tagged_commit}" ]; then
            echo "The checkout does not match ${release_tag}."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tagged_commit}" refs/remotes/origin/main; then
            echo "${release_tag} is not contained in protected main."
            exit 1
          fi
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${project_version}" != "${RELEASE_VERSION}" ]; then
            echo "${release_tag} carries version ${project_version}; the input is ${RELEASE_VERSION}."
            exit 1
          fi
          python scripts/check_release_consistency.py
          if ! grep -Eq "^## ${release_tag} \(" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for ${release_tag}."
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_VERSION}" python - <<'PY'
          import os
          import re
          import subprocess

          requested = tuple(int(part) for part in os.environ["RELEASE_VERSION"].split("."))
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()
          existing = [
              tuple(int(part) for part in match.groups())
              for tag in tags
              if (match := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag))
          ]
          if existing and requested != max(existing):
              raise SystemExit(
                  "the backfill path accepts the newest release tag only"
              )
          PY

      - name: Require exact-tag release qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_ci.py \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "$(git rev-parse HEAD)"

      # The validator needs only PyYAML + stdlib (no package install, no
      # browser), matching the gate in validate-claims.yml. Installing the
      # whole package here would let a heavy dependency break the release.
      - name: Install PyYAML
        run: pip install "pyyaml>=6"

      - name: Verify the claims registry
        run: python scripts/validate_claims.py --check --structure-only

      # Rebuilding here would produce different bytes from the artifacts PyPI
      # already serves, and the release must mirror those exact files.
      - name: Fetch the exact published artifacts from PyPI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          RELEASE_VERSION="${RELEASE_VERSION}" python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          version = os.environ["RELEASE_VERSION"]
          url = f"https://pypi.org/pypi/openadapt-flow/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              document = json.load(response)
          artifacts = document["urls"]
          if len(artifacts) != 2:
              raise SystemExit(
                  f"PyPI holds {len(artifacts)} files for {version}; "
                  "expected exactly one wheel and one sdist"
              )
          for artifact in artifacts:
              name = artifact["filename"]
              expected = artifact["digests"]["sha256"]
              with urllib.request.urlopen(artifact["url"], timeout=300) as response:
                  payload = response.read()
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f"{name} arrived with digest {actual}; PyPI declares {expected}"
                  )
              with open(os.path.join("dist", name), "wb") as handle:
                  handle.write(payload)
              print(f"{name} {actual}")
          PY
          python scripts/check_release_consistency.py --require-dist

      - name: Create the GitHub Release through the release App
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${release_tag} already has a GitHub Release. Nothing to backfill."
            exit 1
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## ${release_tag} (" '
            index($0, heading) == 1 {
              inside = 1
              print
              print ""
              print "_This release is published under the MIT License._"
              next
            }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "${notes}"
          if [ ! -s "${notes}" ]; then
            echo "CHANGELOG.md has no ${release_tag} entry to publish."
            exit 1
          fi
          gh release create "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${release_tag}" \
            --notes-file "${notes}" \
            --verify-tag \
            "dist/openadapt_flow-${RELEASE_VERSION}-py3-none-any.whl" \
            "dist/openadapt_flow-${RELEASE_VERSION}.tar.gz"

      - name: Verify both publication surfaces and artifact digests
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          python scripts/verify_release_publication.py \
            --dist dist \
            --package openadapt-flow \
            --version "${{ inputs.version }}" \
            --tag "v${{ inputs.version }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --wait-seconds 180 \
            --poll-seconds 10

  validate-tag:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require an exact stable release tag event
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "The publication path accepts a pushed tag only."
            exit 1
          fi
          if [ "${GITHUB_ACTOR}" != "openadapt-release[bot]" ]; then
            echo "Only the release App can start the tag publication path."
            exit 1
          fi
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "The release tag must be an exact stable semantic version such as v1.34.0."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "The event ref and tag name differ."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  publish-tag:
    needs: validate-tag
    if: ${{ github.event_name == 'push' && needs.validate-tag.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Create the exact release App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"

      - name: Verify the exact protected tag and reviewed version
        env:
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "The checkout does not match the tag event commit."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]; then
            echo "${RELEASE_TAG} is not an annotated tag."
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" != "${GITHUB_SHA}" ]; then
            echo "${RELEASE_TAG} does not resolve to the event commit."
            exit 1
          fi
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${RELEASE_TAG}" != "v${project_version}" ] || [ "${project_version}" != "${RELEASE_VERSION}" ]; then
            echo "The tag, workflow version, and pyproject version differ."
            exit 1
          fi
          python scripts/check_release_consistency.py
          if ! grep -Eq "^## ${RELEASE_TAG} \(" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for ${RELEASE_TAG}."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "The tagged commit is not contained in protected main."
            exit 1
          fi

      - name: Require exact-tag release qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_ci.py \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}"

      # The validator needs only PyYAML + stdlib (no package install, no
      # browser), matching the gate in validate-claims.yml. Installing the
      # whole package here would let a heavy dependency break the release.
      - name: Install PyYAML
        run: pip install "pyyaml>=6"

      - name: Verify the claims registry
        run: python scripts/validate_claims.py --check --structure-only

      - name: Build and verify publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --sdist
          python scripts/check_release_consistency.py --require-dist

      - name: Check for exact existing publication artifacts
        id: publication
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          python scripts/verify_release_publication.py \
            --dist dist \
            --package openadapt-flow \
            --version "${{ needs.validate-tag.outputs.version }}" \
            --tag "${{ needs.validate-tag.outputs.tag }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --allow-missing \
            --github-output "${GITHUB_OUTPUT}"

      - name: Publish to PyPI with trusted publishing
        if: ${{ steps.publication.outputs.publish_pypi == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # The release object is created directly with the App token. Two facts
      # about python-semantic-release make its publish action unusable here.
      # First, `semantic-release publish` only uploads assets to a release that
      # already exists; it never creates one. Second, every subcommand resolves
      # the checked-out branch against `[tool.semantic_release.branches.*]`
      # before it runs, and a tag checkout is a detached HEAD, which matches no
      # release group and exits non-zero.
      #
      # Exactly the wheel and the sdist are attached. The PyPI publish step
      # above leaves `*.publish.attestation` files beside them in dist/, and
      # the digest verification below compares the release assets against the
      # wheel and the sdist alone.
      - name: Create the GitHub Release through the release App
        if: ${{ steps.publication.outputs.create_github_release == 'true' }}
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## ${RELEASE_TAG} (" '
            index($0, heading) == 1 {
              inside = 1
              print
              print ""
              print "_This release is published under the MIT License._"
              next
            }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "${notes}"
          if [ ! -s "${notes}" ]; then
            echo "CHANGELOG.md has no ${RELEASE_TAG} entry to publish."
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --notes-file "${notes}" \
            --verify-tag \
            "dist/openadapt_flow-${RELEASE_VERSION}-py3-none-any.whl" \
            "dist/openadapt_flow-${RELEASE_VERSION}.tar.gz"

      - name: Verify both publication surfaces and artifact digests
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          python scripts/verify_release_publication.py \
            --dist dist \
            --package openadapt-flow \
            --version "${{ needs.validate-tag.outputs.version }}" \
            --tag "${{ needs.validate-tag.outputs.tag }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --wait-seconds 180 \
            --poll-seconds 10
