# Strict policy for write workflows against any system of record.
#
# The general counterpart of clinical-write, for systems that are not
# clinical: claims, billing, back-office and line-of-business apps. It asks for
# exactly the same evidence as clinical-write (a test pins the two rule sets
# together), so choosing it never lowers the bar; it only stops a non-clinical
# app from having to certify under a policy named for clinical data. Select it
# per app with `campaign.policy: record-write` in that app's verify.yaml, or
# `--policy record-write` on certify.
name: record-write
description: >-
  Strict gate for irreversible writes against a system of record: no unarmed
  clicks, no vacuous steps, identity required on every record-navigation and
  write step, a real system-of-record effect (not just a screen assertion) plus
  an idempotency key required on every write, no unconfirmed effect bindings,
  and human sign-off for any thinly-evidenced step.

# No click may act without a verified target identity.
prohibit_unarmed_clicks: true

# Every effect-expecting step must carry outcome evidence.
prohibit_vacuous_postconditions: true

# The wrong-record surface (navigational data clicks) and every write must be
# identity-armed.
require_identity_for:
  - entity_navigation
  - write

# Every consequential write must verify its effect against the system of
# record (step.effects), not merely the screen.
require_system_effects_for:
  - write

# ...and carry an idempotency / at-most-once key, so a retried or
# double-delivered submission collapses to a single record.
require_idempotency_key_for:
  - write

# A placeholder effect whose binding was not derivable from the demonstration
# must never be certified.
prohibit_unconfirmed_effect_bindings: true

# Screen postconditions are still required, in addition to the effect above.
require_screen_postconditions_for:
  - write
  - save
  - submit
  - create
  - update
  - delete
  - confirm
  - send

# Zero tolerance for steps that assert nothing.
max_unverified_steps: 0

# Any step resolving on thin evidence needs human sign-off before it runs
# unattended.
require_human_approval_below_confidence: 0.8
