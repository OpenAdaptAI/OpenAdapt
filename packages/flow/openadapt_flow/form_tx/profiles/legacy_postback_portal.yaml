schema_version: openadapt.ui-profile/v1
profile_id: legacy_postback_portal
description: >-
  Classic server-rendered postback administrative portal with form-level
  refreshes, modal confirmation dialogs, and authenticated session keepalive.
busy_selectors:
  - '[aria-busy="true"]'
  - '[data-busy="true"]'
  - '[data-postback-pending="true"]'
  - '[data-loading="true"]'
  - '.loading-overlay'
error_banner_selectors:
  - '[role="alert"]'
  - '[data-validation-banner]'
  - '.validation-banner'
  - '.error-banner'
  - '[data-error-summary]'
field_error_selectors:
  - '[aria-invalid="true"]'
  - '[data-field-error]'
  - '.field-error'
  - '.validation-error'
portal_listbox_selectors:
  - '[role="listbox"]'
  - '[data-portal-listbox]'
portal_option_selectors:
  - '[role="option"]'
  - '[data-option-value]'
modal_dialog_selectors:
  - 'dialog[open]'
  - '[role="dialog"][aria-modal="true"]'
  - '[data-modal-open="true"]'
auth_wall_selectors:
  - 'input[type="password"]'
  - '[data-auth-wall="true"]'
  - 'form[data-login-form="true"]'
authenticated_landmark_selectors:
  - '[data-authenticated-shell="true"]'
  - '[data-hms-ready="true"]'
keepalive_path: "/api/keepalive"
debounce_grace_ms: 120
settle_window_ms: 150
max_settle_ms: 15000
