schema_version: openadapt.rl-env-manifest/v1
name: openadapt-taskgen-mockmed
title: MockMed records under adversarial conditions (generated)
description: >
  100 generated tasks on a synthetic clinic: add, change, cancel and merge
  records, under look-alike ids, near-duplicate people, an expired session,
  a late write, a lying "Saved" banner and hidden state. Each task carries
  its own contract (verify); the reward is verify-run's verdict on the
  clinic's database. Made by openadapt_flow.taskgen; see
  docs/TASK_GENERATION.md.
licence:
  environment: MIT
  app: MIT
  app_source: bundled
  notes: The workbench is OpenAdapt's own synthetic fixture (openadapt_flow.taskgen.workbench). All data is fake.
app:
  kind: inprocess
  # Needs WB_PROFILE=mockmed, WB_DSN (a PostgreSQL admin conninfo with
  # dbname) and a read-only role WB_READER (default wb_reader).
  serve: openadapt_flow.taskgen.workbench:serve_env
  reset:
    http_post: /__reset
agent:
  # The reset and state routes; the contracts read the database directly.
  blocked_paths: [/__reset, /__state]
  max_steps: 40
# Every task names its own contract in verify; this one is only the
# manifest's required default.
verify: contracts/mockmed-v1-043401de18c5.yaml
tasks: tasks/public.jsonl
