# Task mockmed-v1-20bff058580a: create_encounter, from create_encounter/mrn+note+type.c8d454d9.create.yaml (openadapt_flow.generate.verify_contract).
schema_version: openadapt.verify/v1
environment_id: taskgen-workbench-mockmed-v1
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."patient_id" AS TEXT) AS "patient_id", CAST(t."type"
        AS TEXT) AS "type", CAST(t."note" AS TEXT) AS "note", CAST(t."status" AS TEXT) AS "status", CAST(t."cancel_reason"
        AS TEXT) AS "cancel_reason", CAST(t."version" AS TEXT) AS "version", CAST(t."updated_by" AS TEXT)
        AS "updated_by", (SELECT CASE WHEN (SELECT COUNT(*) FROM "patients" u1 WHERE CAST(CAST(u1."mrn"
        AS TEXT) AS TEXT) = CAST(CAST(a1."mrn" AS TEXT) AS TEXT)) = 1 THEN CAST(a1."mrn" AS TEXT) END
        FROM "patients" a1 WHERE a1."id" = t."patient_id") AS "p__mrn", CASE WHEN t."cancel_reason" IS
        NULL OR t."cancel_reason" = '' THEN '1' ELSE '0' END AS "empty__cancel_reason", CASE WHEN CAST(t."version"
        AS numeric) = CAST('1' AS numeric) THEN '1' ELSE '0' END AS "pin__version" FROM "encounters" t
    raw_audit_log:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."actor" AS TEXT) AS "actor", CAST(t."table_name"
        AS TEXT) AS "table_name", CAST(t."record_id" AS TEXT) AS "record_id", CAST(t."event" AS TEXT)
        AS "event" FROM "audit_log" t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__mrn:
      param: mrn
    note:
      param: note
    type:
      param: type
    empty__cancel_reason:
      literal: '1'
    status:
      literal: open
    updated_by:
      param: agent_user
    pin__version:
      literal: '1'
  expected_count: 1
  count_new_only: true
- kind: record_written
  probe: surface=raw_audit_log|1 row(s) the app adds to audit_log
  match:
    actor:
      param: agent_user
    event:
      literal: insert
    table_name:
      literal: encounters
  expected_count: 1
  count_new_only: true
frame:
  target_fields: []
  target_fields_by_surface: {}
  database:
    dialect: postgresql
    read:
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
    allow_tables: []
    views:
      audit_log: raw_audit_log
    judged_by:
      encounters: record
    settle_s: 1
    settle_attempts: 5
    new_row_fields:
      audit_log:
      - id
      - record_id
      encounters:
      - cancel_reason
      - id
      - note
      - patient_id
      - status
      - type
      - updated_by
      - version
    recheck_after_s: 15.0
