# Task mockmed-v1-ebc349c7aee3: cancel_encounter, from cancel_encounter/mrn+new_cancel_reason+new_status+note.925f750c.update.yaml (openadapt_flow.generate.verify_contract).
schema_version: openadapt.verify/v1
environment_id: taskgen-workbench-mockmed-v1
max_execution_window_s: 900
verifier:
  kind: surfaces
  surfaces:
    record:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."patient_id" AS TEXT) AS "patient_id", CAST(t."type"
        AS TEXT) AS "type", CAST(t."note" AS TEXT) AS "note", CAST(t."status" AS TEXT) AS "status", CAST(t."cancel_reason"
        AS TEXT) AS "cancel_reason", CAST(t."version" AS TEXT) AS "version", CAST(t."updated_by" AS TEXT)
        AS "updated_by", (SELECT CASE WHEN (SELECT COUNT(*) FROM "patients" u1 WHERE CAST(CAST(u1."mrn"
        AS TEXT) AS TEXT) = CAST(CAST(a1."mrn" AS TEXT) AS TEXT)) = 1 THEN CAST(a1."mrn" AS TEXT) END
        FROM "patients" a1 WHERE a1."id" = t."patient_id") AS "p__mrn" FROM "encounters" t
    raw_audit_log:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."actor" AS TEXT) AS "actor", CAST(t."table_name"
        AS TEXT) AS "table_name", CAST(t."record_id" AS TEXT) AS "record_id", CAST(t."event" AS TEXT)
        AS "event" FROM "audit_log" t
effects:
- kind: record_written
  probe: surface=record|the main record holds the task's values
  match:
    p__mrn:
      param: mrn
    cancel_reason:
      param: new_cancel_reason
    status:
      param: new_status
    note:
      param: note
  expected_count: 1
- kind: record_written
  probe: surface=raw_audit_log|1 row(s) the app adds to audit_log
  match:
    actor:
      param: agent_user
    event:
      literal: update
    table_name:
      literal: encounters
  expected_count: 1
  count_new_only: true
frame:
  target_fields:
  - cancel_reason
  - status
  - updated_by
  - version
  target_fields_by_surface:
    record:
    - cancel_reason
    - status
    - updated_by
    - version
  versions:
    read:
      kind: sql
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
      sql_query: SELECT CAST(t."id" AS TEXT) AS "id", CAST(t."version" AS TEXT) AS "ver" FROM "encounters"
        t
    record_field: id
    target_field: id
    target_surface: record
    version_field: ver
  database:
    dialect: postgresql
    read:
      sql_driver: psycopg2
      sql_connect_args:
        dbname: wb_mockmed_v1
        host: 127.0.0.1
        port: 9770
        user: wb_reader
      sql_password_env: WB_READER_PASSWORD
    allow_tables: []
    views:
      audit_log: raw_audit_log
    judged_by:
      encounters: record
    settle_s: 1
    settle_attempts: 5
    new_row_fields:
      audit_log:
      - id
      - record_id
      encounters:
      - cancel_reason
      - id
      - note
      - patient_id
      - status
      - type
      - updated_by
      - version
    recheck_after_s: 15.0
