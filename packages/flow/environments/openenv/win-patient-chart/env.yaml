schema_version: openadapt.rl-env-manifest/v1
name: openadapt-win-patient-chart
title: Patient Chart (WinForms) on Windows, UI Automation surface
description: >
  Write a chart note on the right patient in a WinForms app whose save can be dropped, misplaced on a look-alike patient, duplicated, truncated or replaced by an old value while the screen still says "saved". The reward is verify-run's verdict on the app's SQLite database.
  The agent sees the screen and the window's UI Automation elements.
licence:
  environment: MIT
  app: MIT
  app_source: bundled
  notes: >
    Patient Chart is OpenAdapt's own app (environments/openenv/_windows/apps). All
    data is fictional. Windows is not part of this package: the environment
    runs on a Windows machine the user supplies (their own image, or an Azure
    or AWS Windows template).
guest_image: buyer-supplied
app:
  kind: desktop
  surface: windows_uia
  guest_app: patient_chart
  window_title: Patient Chart
  ready_automation_id: searchBox
  rdp:
    width: 1280
    height: 800
    color_depth: 32
    transport: aardwolf
agent:
  max_steps: 40
  settle_s: 0.6
verify: verify.yaml
tasks: tasks/public.jsonl
