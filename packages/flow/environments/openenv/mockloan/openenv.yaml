spec_version: 1
name: openadapt-mockloan
version: 0.1.0
type: space
runtime: fastapi
app: server.app:app
port: 8000
validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 1.0
    memory_mb: 2048
    disk_mb: 4096
    episode_timeout_s: 300.0
  network:
    # The app runs inside the container; the browser reaches only localhost.
    mode: no-network
  capabilities:
    verifier:
      kind: reward_channel
    oracle:
      form: script
      location: oracle/solve.sh
    task_api: true
    declared_task_count:
      public: 0
  types:
    tags: [computer-use, web, effect-verification, lending]
