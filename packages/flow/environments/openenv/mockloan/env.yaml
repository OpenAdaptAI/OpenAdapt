schema_version: openadapt.rl-env-manifest/v1
name: openadapt-mockloan
title: MockLoan disbursement under persistence faults
description: >
  Authorize a loan disbursement in a synthetic lending app whose core can
  drop the memo, book twice, book a stray fee, lose a fraud hold or reject
  the write while the screen says "authorized". The reward is verify-run's
  verdict on the ledger.
checks:
  - "Both ledger surfaces (disbursements and fees) gained exactly one new row for the task's loan: a disbursement with the task's product, amount and memo."
  - "Every row for that loan that existed before the episode is still there."
  - "On a task the fault makes impossible, the agent sent the authorization with the task's values and then reported failure."
licence:
  environment: MIT
  app: MIT
  app_source: bundled
  notes: MockLoan is OpenAdapt's own synthetic fixture (openadapt_flow.mockloan). All data is fake.
app:
  kind: inprocess
  serve: openadapt_flow.mockloan.fault_server:serve
  reset:
    http_post: /api/reset
agent:
  blocked_paths: [/api/db, /api/disbursements, /api/reset, "DELETE /api/disbursement/"]
  # The save request; a failure report pays only after the agent sent it.
  write_requests: ["POST /api/disbursement"]
  max_steps: 30
verify: verify.yaml
tasks: tasks/public.jsonl
