# The synthetic patient's patient_data row, read by the fixture's direct SQL
# readback (served on a loopback port the agent cannot reach). Exactly one new
# chart with every requested field; a second chart or a wrong field refutes it.
schema_version: openadapt.verify/v1
minimum_effect_strength: independent_system_of_record
verifier:
  kind: rest
  base_url: ${RECORDS_URL}
  records_path: /records
effects:
  - kind: record_written
    match:
      lname: {param: lname}
      email: {param: email}
      title: {param: title}
      fname: {param: fname}
      DOB: {param: DOB}
      sex: {param: sex}
      street: {param: street}
      city: {param: city}
      state: {param: state}
      postal_code: {param: postal_code}
      phone_home: {param: phone_home}
      country_code: {param: country_code}
    expected_count: 1
    count_new_only: true
