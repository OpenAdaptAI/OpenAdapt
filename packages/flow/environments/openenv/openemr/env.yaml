schema_version: openadapt.rl-env-manifest/v1
name: openadapt-openemr
title: OpenEMR patient registration, checked in the database
description: >
  Register a synthetic patient in a real OpenEMR 8.0.0.3 instance. The reward
  is verify-run's verdict on OpenEMR's patient_data row, read by direct SQL
  outside the agent's browser.
checks:
  - "OpenEMR's patient_data table holds exactly one new chart for the synthetic patient, with every requested demographic and contact field."
licence:
  environment: MIT
  app: GPL-3.0
  app_source: upstream_image
  upstream_images:
    - openemr/openemr:8.0.0.3@sha256:0aa4d3d52b22fa69986c087e7c99e9854d8dfd70440634eb7c8af0e08f19f3ab
    - mariadb:11.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
  notes: >
    OpenEMR is GPL-3.0. It is never copied into this package or its image: the
    operator starts it from the pinned upstream images with
    benchmark/openemr_local (scripts/openemr_local_demo.py prepare, up,
    bootstrap, snapshot), which also fetches OpenEMR's own compose file at
    prepare time. All patients are made up.
app:
  kind: external
  url_env: OPENEMR_UI_URL
  url_default: http://127.0.0.1:9301
  reset:
    python: benchmark.openemr_local.rl_env_hooks:reset
  prepare: benchmark.openemr_local.rl_env_hooks:prepare
  records: benchmark.openemr_local.rl_env_hooks:records
agent:
  # The record read is on its own loopback port, outside the app's origin, so
  # nothing on OpenEMR's origin needs blocking. Its REST API needs OAuth
  # credentials the agent is never given.
  blocked_paths: []
  max_steps: 60
  settle_s: 0.5
verify: verify.yaml
tasks: tasks/public.jsonl
