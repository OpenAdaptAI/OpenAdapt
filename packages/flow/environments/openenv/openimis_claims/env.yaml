schema_version: openadapt.rl-env-manifest/v1
name: openadapt-openimis-claims
title: openIMIS claim intake, checked in the database
description: >
  Enter one health-facility claim in openIMIS 25.10. The reward is
  verify-run's verdict on the tblClaim row, read by direct SQL.
checks:
  - "The tblClaim table holds exactly one new claim in status Entered for the synthetic policyholder."
licence:
  environment: MIT
  app: AGPL-3.0-only
  app_source: upstream_image
  upstream_images:
    - ghcr.io/openimis/openimis-be:25.10@sha256:a77228c7469fab5f3523d3f7b9877d62aa116b303fd87a6d55aa3a46c1892592
    - ghcr.io/openimis/openimis-fe:25.10@sha256:ed0e0b1dbe91308d4df3322a1aee40176b42d47bbf72fea79a59fa84ef63db4a
    - ghcr.io/openimis/openimis-pgsql:25.10@sha256:d4bc881e408b74b4cf47fb718534fe0f10940bb951b6cb7ee9a1a30048adf29d
    - redis@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    - rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
  notes: >
    openIMIS is AGPL-3.0-only. Its images are pulled by digest at start time and
    its adapted deployment files stay repository-only (benchmark/openimis_claims,
    excluded from the wheel and the sdist, as is this directory). Not yet
    servable: the fixture has no per-episode reset (snapshot and restore), so
    episodes would not start from the same record state.
app:
  kind: external
  url_env: OPENIMIS_UI_URL
  url_default: http://127.0.0.1:9401
agent:
  # The UI itself writes through /api/graphql, so nothing is blocked.
  blocked_paths: []
  max_steps: 60
verify: verify.yaml
tasks: tasks/public.jsonl
