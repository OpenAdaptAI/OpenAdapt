schema_version: openadapt.rl-env-manifest/v1
name: openadapt-frappe-lending
title: Frappe Lending loan application, checked in the database
description: >
  Create one Loan Application for a synthetic customer in Frappe/ERPNext with
  the Lending app. The reward is verify-run's verdict on the
  `tabLoan Application` row, read by direct SQL outside the agent's browser.
checks:
  - "The `tabLoan Application` table holds exactly one new application for the synthetic customer, with the requested product, amount, repayment periods, email and phone."
licence:
  environment: MIT
  app: GPL-3.0 (ERPNext, Lending) and MIT (Frappe framework)
  app_source: upstream_image
  upstream_images:
    - frappe/build:v16.27.0@sha256:03e6e1266d8427cbc8b524d5dc1afcfdf313dd3e0dc01f384e1564a10df970b2
    - frappe/base:v16.27.0@sha256:87f036846924f1b9be1b30d590e7156c1013f73bbf946e6a43d8f1560a1f0d33
    - mariadb:11.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
    - redis:6.2-alpine@sha256:c9ab371a96b057d3642be9bd71cb1b3fe97920d345dc949860578bffb3d54460
  notes: >
    ERPNext and Lending are GPL-3.0. The operator builds the app image locally
    from the pinned upstream commits in benchmark/frappe_lending/apps.json
    (scripts/frappe_lending_demo.py prepare, build, up, bootstrap, snapshot);
    no app code is copied into this package or its image.
app:
  kind: external
  url_env: FRAPPE_UI_URL
  url_default: http://127.0.0.1:8080
  reset:
    python: benchmark.frappe_lending.rl_env_hooks:reset
  records: benchmark.frappe_lending.rl_env_hooks:records
agent:
  blocked_paths: []
  max_steps: 60
  settle_s: 0.5
verify: verify.yaml
tasks: tasks/public.jsonl
