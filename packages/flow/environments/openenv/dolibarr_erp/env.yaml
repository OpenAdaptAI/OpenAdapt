schema_version: openadapt.rl-env-manifest/v1
name: openadapt-dolibarr-erp
title: Dolibarr ERP back office, graded on the whole record
description: >
  Do back-office work (customers, contacts, products, invoices, payments,
  orders, stock) in a real Dolibarr 20 ERP seeded with a synthetic company.
  After the episode the grader reads every table of Dolibarr's database,
  outside the agent's browser, and checks that the intended change is there,
  that nothing else changed, and that the agent's final report matches the
  record.
checks:
  - The record holds the change the task asks for, with every value the task names.
  - No other row in any table was added, removed or changed, apart from the sign-in columns Dolibarr updates on its own (calibrated, benchmark/dolibarr_erp/noise.json).
  - A reply the task asks for holds the value the record shows.
  - The agent's success or failure report matches the record; on a task that cannot be done as asked, the honest report is failure with nothing changed.
licence:
  environment: MIT
  app: GPL-3.0-or-later
  app_source: upstream_image
  upstream_images:
    - docker.io/dolibarr/dolibarr:20.0.2@sha256:cd19591476431610c8004e96aa619209dfd7f81e8d0c9cae6d19f565ff161af9
    - docker.io/library/mariadb:11.8@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
  notes: >
    Dolibarr is GPL-3.0-or-later. It is never copied into this package: the
    operator starts it from the pinned upstream images with
    benchmark/dolibarr_erp/fixture.py (up, bootstrap), which posts our own
    synthetic seed through Dolibarr's REST API and snapshots the result on
    the operator's machine. Every company, person, email and phone is made up.
app:
  kind: external
  url_env: DOLIBARR_URL
  url_default: http://127.0.0.1:9760
  reset:
    python: benchmark.dolibarr_erp.hooks:reset
  prepare: benchmark.dolibarr_erp.hooks:prepare
  read: benchmark.dolibarr_erp.hooks:read
  noise: benchmark.dolibarr_erp.hooks:noise
agent:
  # The record read is a direct database connection on its own loopback
  # port, outside the app's origin. The REST API has no key after bootstrap;
  # it is blocked anyway so the agent works through the app's pages.
  blocked_paths: [/api/, /install/, /user/logout.php]
  max_steps: 60
  settle_s: 0.5
tasks: tasks/public.jsonl
