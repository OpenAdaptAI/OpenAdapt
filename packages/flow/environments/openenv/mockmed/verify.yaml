# Read the encounter store through its REST read path, which the agent's
# browser cannot reach. One new encounter for the task's patient with the
# task's type and note, exactly once; a pre-existing encounter that vanishes
# (a lost update) also refutes it.
schema_version: openadapt.verify/v1
minimum_effect_strength: independent_system_of_record
verifier:
  kind: rest
  base_url: ${APP_URL}
  records_path: /api/db
effects:
  - kind: record_written
    match:
      patient_id: {param: patient_id}
      type: {param: type}
      note: {param: note}
    expected_count: 1
    count_new_only: true
