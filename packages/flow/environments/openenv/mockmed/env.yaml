schema_version: openadapt.rl-env-manifest/v1
name: openadapt-mockmed
title: MockMed encounter charting under persistence faults
description: >
  Chart an encounter in a synthetic clinical app whose backend can drop,
  duplicate, misroute or reject the save while the screen still says
  "saved". The reward is verify-run's verdict on the encounter store.
checks:
  - The encounter store holds exactly one new encounter for the task's patient, with the task's type and note.
  - Every encounter that existed before the episode is still there, unchanged.
  - On a task the fault makes impossible, the agent sent the save with the task's values and then reported failure.
licence:
  environment: MIT
  app: MIT
  app_source: bundled
  notes: MockMed is OpenAdapt's own synthetic fixture (openadapt_flow.mockmed). All data is fake.
app:
  kind: inprocess
  serve: openadapt_flow.mockmed.fault_server:serve
  reset:
    http_post: /api/reset
agent:
  # The oracle's read path, the reset route and the compensation route.
  blocked_paths: [/api/db, /api/reset, "DELETE /api/encounter/"]
  # The save request; a failure report pays only after the agent sent it.
  write_requests: ["POST /api/encounter"]
  max_steps: 30
verify: verify.yaml
tasks: tasks/public.jsonl
