# Read the adjudication log through the guest's database (pack_db.py dump
# over WinRM or SSH, served on the environment server's loopback as
# ${RECORDS_URL}/records). One new decision
# on the task's claim with the task's status, allowed amount and note,
# exactly once.
schema_version: openadapt.verify/v1
minimum_effect_strength: independent_system_of_record
verifier:
  kind: rest
  base_url: ${RECORDS_URL}
  records_path: /records
effects:
  - kind: record_written
    match:
      claim_no: {param: claim_no}
      status: {param: status}
      allowed_amount: {param: allowed_amount}
      note: {param: note}
    expected_count: 1
    count_new_only: true
