schema_version: openadapt.rl-env-manifest/v1
name: openadapt-win-claims-desk
title: Claims Desk (WPF) on Windows, UI Automation surface
description: >
  Adjudicate the right claim in a WPF app whose save can be dropped, posted to a look-alike claim, duplicated, truncated or written with a stale amount while the screen still says "saved". The reward is verify-run's verdict on the app's SQLite database.
  The agent sees the screen and the window's UI Automation elements.
licence:
  environment: MIT
  app: MIT
  app_source: bundled
  notes: >
    Claims Desk is OpenAdapt's own app (environments/openenv/_windows/apps). All
    data is fictional. Windows is not part of this package: the environment
    runs on a Windows machine the user supplies (their own image, or an Azure
    or AWS Windows template).
checks:
  - "One new decision on the task's claim with exactly the task's status, allowed amount and note, read from the app's database outside the agent's session."
  - "Exactly one such decision: a duplicate, a decision on the look-alike claim, a truncated note or a stale amount does not count."
  - "On a task whose save cannot land, the agent reports failure after asking the app to save."
app:
  kind: desktop
  surface: windows_uia
  desktop:
    guest_app: claims_desk
    window_title: Claims Desk
    ready_automation_id: searchBox
    guest_image: buyer-supplied
    rdp:
      width: 1280
      height: 800
      color_depth: 32
      transport: xfreerdp
agent:
  max_steps: 40
  settle_s: 0.6
verify: verify.yaml
tasks: tasks/public.jsonl
