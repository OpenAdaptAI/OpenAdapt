# Denylist for scripts/check_engine_generality.py.
#
# The engine (openadapt_flow/) must not name a specific application. Add a term
# here when a new application is qualified or a new app-specific identifier is
# found. Patterns are Python regular expressions, matched case-insensitively
# unless they turn that off with (?-i:...).

[names]
openemr = '\bopen[ _-]?emr'
openimis = '\bopen[ _-]?imis'
medplum = '\bmedplum'
dolibarr = '\bdolibarr'
espocrm = '\bespo[ _-]?crm'
redmine = '\bredmine'
snipe-it = '\bsnipe[ _-]?it\b'
inventree = '\binventree'
kimai = '\bkimai'
openmrs = '\bopen[ _-]?mrs'
gitea = '\bgitea'
firefly-iii = '\bfirefly[ _-]?(iii|3)\b'
vikunja = '\bvikunja'
zammad = '\bzammad'
open-dental = '\bopen[ _-]?dental'
odoo = '\bodoo'
frappe = '\b(frappe|erpnext)'
patient-notes = '\bpatient[ _-]notes\b'
epic = '(?-i:\bEpic\b)'
cerner = '\bcerner'
stedi = '\bstedi\b'
textedit = '\btextedit'
notepad = '\bnotepad\b'
mockmed = '\bmock[ _-]?med'
mockloan = '\bmock[ _-]?loan'

[identifiers]
# OpenEMR
token_main = '\btoken_main\b'
csrf_token_form = '\bcsrf_token_form\b'
clearpass = '\bclearpass\b'
pnotes = '\bpnotes\b'
patient_data = '\bpatient_data\b'
uuid_registry = '\buuid_registry\b'
openemr-fhir-path = '/apis/default/fhir'
# Frappe and Dolibarr table prefixes
frappe-table = '\btabLoan\b'
dolibarr-table = '\bllx_[a-z]'
# MockMed's REST shape
mockmed-records = '/api/db\b'
mockmed-write = '/api/encounter\b'

[allow]
# Data, loaded generically: an app profile is where one app's bookkeeping lives.
paths = ["app_profiles/"]

# OpenAdapt's own demo apps and the user-facing commands that serve them
# (tutorial, demo, demo-record, quickstart, `openadapt-agent serve` with no
# flags). They may name the demo app and its REST shape; nothing else may.
[allow.terms_in]
"mockmed/" = ["mockmed", "mockmed-records", "mockmed-write"]
"tutorial.py" = ["mockmed", "mockmed-records", "mockmed-write"]
"demo_proof.py" = ["mockmed", "mockmed-records", "mockmed-write"]
"demo_driver.py" = ["mockmed", "mockmed-records", "mockmed-write"]
"agent/sandbox.py" = ["mockmed", "mockmed-records", "mockmed-write"]
"agent/tutorial.py" = ["mockmed", "mockmed-records", "mockmed-write"]
"agent/example_app.py" = ["mockmed", "mockmed-records", "mockmed-write"]
