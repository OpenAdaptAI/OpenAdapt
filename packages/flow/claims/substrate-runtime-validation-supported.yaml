id: substrate-runtime-validation-supported
claim: >-
  Runtime-validation v3 binds Standard and Regulated hosted activation to
  the exact governed authorization template reproduced from the sealed
  qualification. It also binds the successful run's resolved target kind
  (`web|windows|macos|linux|rdp|citrix`), artifact, compiler, parameter
  schema, strict lint, policy, risk, report, and opaque environment. Web
  retains its exact HTTPS/host boundary. Native and remote execution emits
  no app, window, host, readiness, or backend-hint values to Cloud. Local
  verification retains signed v1 and v2 compatibility.
surfaces: [README.md, docs, website]
tier: supported
evidence:
  - path: tests/test_runtime_validation.py
    proves: >-
      Required CI exercises all six target kinds, validates v3 against its
      closed JSON Schema, refuses a Standard or Regulated activation without
      an exact template, binds the template SHA to the HMAC, preserves web
      URL/host checks, keeps native/remote execution empty, verifies the
      canonical HMAC vector, and retains signed v1/v2 compatibility.
  - path: tests/test_cli_new_commands.py
    proves: >-
      Required CI carries the resolved web, Windows, and Citrix backend
      token through durable resume into the new run report rather than
      trusting an upload-time relabel.
  - path: schemas/runtime-validation-attestation-v3.json
    kind: doc
    proves: >-
      The public closed envelope requires target_kind and the governed
      authorization template SHA, and conditionally permits browser
      execution fields only for web.
caveats:
  - >-
    The HMAC proves operator-token possession and envelope integrity; it is
    not independent observation of the local replay or certification of an
    arbitrary target application.
