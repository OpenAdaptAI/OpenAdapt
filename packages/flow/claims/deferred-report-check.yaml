id: deferred-report-check
claim: >-
  A save that only a later report can confirm (an X12 999 or 277CA
  acknowledgment, a CSV export, a saved status page) ends
  SAVED_AWAITING_CHECK: never VERIFIED or billable until a matching
  accepting report row settles it, and RECONCILIATION_REQUIRED when the
  report rejects it or no row arrives by the deadline.
surfaces: [docs]
tier: supported
evidence:
  - path: tests/test_deferred_report.py
    proves: >-
      Synthetic 999, 277CA, CSV and text reports parse into accepted,
      rejected, pending and conflicting rows (a 999 can only reject; a
      provider-level 277CA trace is ignored); the ledger keeps keys only as
      private digests; a real replayer run ends SAVED_AWAITING_CHECK and
      not billable; an unchecked second effect, a failed run or anything
      else uncertain stays RECONCILIATION_REQUIRED; an accepting row
      settles VERIFIED, while a rejecting row, a duplicate key, the
      deadline (checked before any report), a report older than the save,
      or a report read another way does not; the CLI settles it and never
      rewrites report.json; verify-run refuses the kind.
caveats:
  - >-
    The report confirms acceptance of the item with that key, not its
    field values. The hosted runner and the Execute v1 and
    production-receipt wire formats carry the outcome as
    RECONCILIATION_REQUIRED.
