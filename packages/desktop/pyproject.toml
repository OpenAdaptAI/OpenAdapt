[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-desktop"
version = "0.14.0"
description = "Beta desktop authoring surface and local capture/review tooling for OpenAdapt workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "OpenAdapt AI", email = "hello@openadapt.ai" },
]
keywords = ["desktop", "recording", "workflow-authoring", "human-in-the-loop", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openadapt-capture>=1.1.0",
    "openadapt-privacy>=1.0.0",
    # Exact cross-surface status/target contract used by the presentation
    # exporter and by the generated TypeScript projection checked into src/.
    # 0.6.x additionally carries the HumanDecisionTaskV1 contract that Flow's
    # attended console projects and the mobile decision portal relays; the
    # control-overlay v2 schemas are byte-identical to 0.5.0.
    "openadapt-types==0.6.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0,<7",
    "httpx>=0.27",
    "keyring>=24",
    # Qualification evidence is signed locally. Cryptography 49 no longer
    # publishes a macOS Intel wheel, so keep that platform on the latest
    # universal2 release while using the current runtime elsewhere.
    "cryptography==48.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=48,<50; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "loguru",
    "psutil",
    # Pure-Python, dependency-free, BSD-licensed QR encoder. The mobile
    # decision portal renders its one-use pairing link locally; nothing about
    # a pairing ever leaves this machine to be encoded elsewhere.
    "segno>=1.6",
    "tqdm",
]

[project.optional-dependencies]
enterprise = ["boto3"]
full = [
    "openadapt-desktop[enterprise]",
]
build = [
    "pyinstaller>=6.16,<7",
    # The native installer freezes this exact canonical runtime into the
    # engine sidecar.  Keep it exact: Desktop and Flow can release
    # independently, while each installer remains reproducible and rollbackable.
    #
    # The ``console`` extra is load-bearing, not optional polish.  The mobile
    # decision portal supervises ``openadapt-flow console --attend``; without
    # this extra the frozen sidecar carries no fastapi/uvicorn and the console
    # exits with an install hint instead of a capability banner, so the portal
    # is dead in every signed installer.  1.25.0 is also the first release
    # whose ``openadapt_flow/console/human_decisions.py`` projects the signed
    # HumanDecisionTaskV1 detail the portal shell renders and acts on.
    #
    # ``browser`` is equally load-bearing: 1.25.0 moved Playwright from a core
    # Flow dependency to that extra, and Desktop freezes the browser driver on
    # purpose (see the pin below and the embedded ``-m playwright`` process
    # mode). Without it the driver becomes build-only and the artifact gate
    # correctly refuses the archive.
    "openadapt-flow[browser,console]==1.25.0",
    # Desktop deliberately embeds the optional browser driver so selecting a
    # web workflow is one click. It does NOT bundle Chromium: that larger
    # runtime is fetched only after the operator chooses the browser surface.
    "playwright>=1.44",
    # ONNX Runtime 1.27 dropped macOS Intel wheels. Flow's RapidOCR dependency
    # accepts this universal2 release, which retains Python 3.12 Intel support.
    "onnxruntime==1.20.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Keep the current runtime everywhere it publishes a compatible wheel.
    "onnxruntime==1.27.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "python-semantic-release>=9.15.2",
]

[project.scripts]
openadapt-desktop = "engine.cli:main"

[project.urls]
Homepage = "https://openadapt.ai"
Repository = "https://github.com/OpenAdaptAI/openadapt-desktop"
Issues = "https://github.com/OpenAdaptAI/openadapt-desktop/issues"


[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["engine/__init__.py:__version__"]
commit_message = "chore: release {version}"
major_on_zero = false
allow_zero_version = true
build_command = "python -m ensurepip --upgrade && python -m pip install --disable-pip-version-check uv==0.11.29 && python scripts/check_release_consistency.py --sync && git add uv.lock && uv build --wheel --sdist && python scripts/check_release_consistency.py --require-dist && python scripts/verify_build_artifact.py python-distribution"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
