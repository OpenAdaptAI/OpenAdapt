name: Dependency Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "19 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python locked dependencies
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Export the exact locked dependency set
        run: >-
          uv export --quiet --locked --all-extras --no-emit-project
          --output-file "${{ runner.temp }}/openadapt-desktop-requirements.txt"
      - name: Audit Python dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --require-hashes --disable-pip --progress-spinner off
          --requirement "${{ runner.temp }}/openadapt-desktop-requirements.txt"

  npm:
    name: npm locked dependencies
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Refuse high-severity npm advisories
        run: npm audit --audit-level=high --package-lock-only

  rust:
    name: Rust locked dependencies
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install the RustSec scanner
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
