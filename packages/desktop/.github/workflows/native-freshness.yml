name: Native Installer Freshness

# A published engine release creates a narrow version-sync pull request from
# the current protected main. The pull request must strictly advance that base
# and contain only the exact five-file transform. A later main push repeats the
# monotonic check and creates the immutable desktop tag. The separate native
# release workflow currently starts from that tag.
#
# ADMIN_TOKEN is required for two bounded operations. It creates a pull request
# whose events run normal CI, and it pushes the protected desktop-v* tag whose
# event starts native-release.yml. The repository rules must deny this identity
# direct writes to main while granting only the documented tag authority.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Current engine version to prepare installers for (X.Y.Z; a leading v is stripped)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: native-freshness-${{ github.event_name == 'push' && 'tag' || 'proposal' }}
  cancel-in-progress: false

jobs:
  propose-native-version:
    name: Propose the exact native version transform
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v') &&
       !github.event.release.prerelease &&
       !github.event.release.draft)
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the stable engine release
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${RELEASE_TAG#v}"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: refusing non X.Y.Z version: ${version}" >&2
            exit 1
          fi

          engine_tag="v${version}"
          native_tag="desktop-v${version}"
          engine_commit="$(git rev-parse --verify "refs/tags/${engine_tag}^{commit}")" || {
            echo "error: matching engine tag ${engine_tag} does not exist" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor "${engine_commit}" origin/main; then
            echo "error: ${engine_tag} is not an ancestor of current main" >&2
            exit 1
          fi
          gh release view "${engine_tag}" \
            --json databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release.json
          python scripts/native_release.py validate-engine-release \
            --file engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${engine_tag}" \
            --engine-commit "${engine_commit}"

          {
            echo "version=${version}"
            echo "engine_tag=${engine_tag}"
            echo "engine_commit=${engine_commit}"
            echo "native_tag=${native_tag}"
            echo "branch=native-version/${engine_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Stop when the immutable native tag already exists
        id: tag
        env:
          NATIVE_TAG: ${{ steps.version.outputs.native_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${NATIVE_TAG}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${NATIVE_TAG} already exists; no version pull request is necessary."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or validate the exact version branch
        if: steps.tag.outputs.exists == 'false'
        id: branch
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          NATIVE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse origin/main)"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null; then
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            candidate="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
            parent="$(git rev-parse "${candidate}^")"
            if [ "${parent}" != "${base}" ]; then
              echo "error: existing ${BRANCH} is stale; recreate it from ${base}" >&2
              exit 1
            fi
            python scripts/native_release.py validate-version-advance \
              --base-ref "${base}" \
              --candidate-ref "${candidate}" \
              --version "${NATIVE_VERSION}"
            echo "created=false" >> "${GITHUB_OUTPUT}"
          else
            git switch --detach "${base}"
            git switch -c "${BRANCH}"
            python scripts/native_release.py set-version "${NATIVE_VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json \
              src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
            git commit -m "chore(native): sync native installer version to ${NATIVE_VERSION}"
            python scripts/native_release.py validate-version-advance \
              --base-ref "${base}" \
              --candidate-ref HEAD \
              --version "${NATIVE_VERSION}"
            git push origin "HEAD:refs/heads/${BRANCH}"
            echo "created=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or report the protected-main pull request
        if: steps.tag.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          ENGINE_TAG: ${{ steps.version.outputs.engine_tag }}
          NATIVE_TAG: ${{ steps.version.outputs.native_tag }}
          NATIVE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --state open --base main --head "${BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore(native): sync installer version to ${NATIVE_VERSION}" \
              --body "Sync the five native version files from ${ENGINE_TAG}. After protected-main review and merge, this workflow verifies the exact transform and creates ${NATIVE_TAG}."
          else
            echo "Pull request #${number} already owns ${BRANCH}."
          fi

  publish-native-tag:
    name: Publish the reviewed immutable native tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require the exact protected-main transform and stable engine release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${current_main}" != "${GITHUB_SHA}" ]; then
            echo "error: refusing a stale main event" >&2
            exit 1
          fi

          version="$(python scripts/native_release.py version)"
          engine_tag="v${version}"
          native_tag="desktop-v${version}"
          engine_commit="$(git rev-parse --verify "refs/tags/${engine_tag}^{commit}")" || {
            echo "error: matching engine tag ${engine_tag} does not exist" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor "${engine_commit}" "${GITHUB_SHA}"; then
            echo "error: ${engine_tag} is not an ancestor of current main" >&2
            exit 1
          fi
          python scripts/native_release.py validate-version-transform \
            --base-ref "${engine_commit}" \
            --candidate-ref "${GITHUB_SHA}" \
            --version "${version}"
          gh release view "${engine_tag}" \
            --json databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release.json
          python scripts/native_release.py validate-engine-release \
            --file engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${engine_tag}" \
            --engine-commit "${engine_commit}"

          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp > releases.json
          python scripts/native_release.py validate-release-order \
            --candidate-tag "${native_tag}" \
            --releases releases.json

          echo "native_tag=${native_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create or confirm the immutable native tag
        env:
          NATIVE_TAG: ${{ steps.release.outputs.native_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${NATIVE_TAG}" >/dev/null; then
            git fetch --force origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
            observed="$(git rev-parse --verify "${NATIVE_TAG}^{commit}")"
            if [ "${observed}" != "${GITHUB_SHA}" ]; then
              echo "error: immutable ${NATIVE_TAG} resolves to ${observed}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "${NATIVE_TAG} already resolves to the reviewed main commit."
          else
            git tag "${NATIVE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${NATIVE_TAG}"
          fi
