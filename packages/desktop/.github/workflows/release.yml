name: Release and PyPI Publish

# Two explicit paths, both dispatched from protected main:
#   semantic-release     -> coalesce reviewed commits into one version, tag,
#                           PyPI package, and GitHub Release.
#   publish-existing-ref -> rebuild and publish an existing main-contained ref
#                           to PyPI (recovery when its tag exists but publish
#                           failed).
#
# Ordinary merges run Test and Build artifacts only. Publication is a separate,
# deliberate operation after the release train's exact main commit is green.
# Publication creates an unadmitted release candidate. It never changes the
# admission-driven Production channel.
#
# Requires ADMIN_TOKEN (GitHub PAT with repo scope) to push the release commit
# and tag through branch protection. PyPI publication uses Trusted Publishing.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation"
        type: choice
        required: true
        default: semantic-release
        options:
          - semantic-release
          - publish-existing-ref
      ref:
        description: "Existing tag or ref to rebuild and publish to PyPI (for example v0.9.0)"
        required: false
        default: main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Version, tag, and publish the green main release train
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'semantic-release' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      engine_tag: ${{ steps.release.outputs.tag }}
      engine_commit: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout protected main at the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Refuse a release commit replay
        id: check_skip
        shell: bash
        run: |
          set -euo pipefail
          author="$(git log -1 --pretty=format:'%an')"
          subject="$(git log -1 --pretty=format:'%s')"
          if [ "${author}" = "semantic-release" ] || printf '%s' "${subject}" | grep -q '^chore: release'; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Wait for exact-head Test and Build workflows
        if: steps.check_skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          workflows=(test.yml build.yml)
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            all_green=true
            for workflow in "${workflows[@]}"; do
              response="$(
                gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                  --raw-field head_sha="${GITHUB_SHA}" \
                  --raw-field event=push \
                  --raw-field per_page=20
              )"
              status="$(
                printf '%s' "${response}" |
                  jq -r --arg sha "${GITHUB_SHA}" \
                    '[.workflow_runs[] | select(.head_sha == $sha)]
                     | sort_by(.created_at) | last | .status // "missing"'
              )"
              conclusion="$(
                printf '%s' "${response}" |
                  jq -r --arg sha "${GITHUB_SHA}" \
                    '[.workflow_runs[] | select(.head_sha == $sha)]
                     | sort_by(.created_at) | last | .conclusion // "pending"'
              )"
              echo "${workflow} for ${GITHUB_SHA}: ${status}/${conclusion}"
              if [ "${status}" = "completed" ] && [ "${conclusion}" != "success" ]; then
                echo "Refusing to publish because ${workflow} concluded ${conclusion}."
                exit 1
              fi
              if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
                all_green=false
              fi
            done
            if [ "${all_green}" = true ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Refusing to publish: exact-head Test and Build did not both succeed within 45 minutes."
          exit 1

      - name: Require dispatched head to remain current protected main
        if: steps.check_skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${current_main}" != "${GITHUB_SHA}" ]; then
            echo "Refusing stale release dispatch: main is ${current_main}, dispatched head is ${GITHUB_SHA}."
            exit 1
          fi

      - name: Set up Python
        if: steps.check_skip.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Semantic Release synchronizes the editable-root lock entry and builds
      # the wheel/sdist before it creates the release commit and tag.
      - name: Python Semantic Release
        if: steps.check_skip.outputs.skip != 'true'
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}

      - name: Publish to PyPI
        if: steps.check_skip.outputs.skip != 'true' && steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish to GitHub Releases
        if: steps.check_skip.outputs.skip != 'true' && steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}


  attest-engine-release:
    name: Attest the published engine release receipt
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      ENGINE_TAG: ${{ needs.semantic-release.outputs.engine_tag }}
      ENGINE_COMMIT: ${{ needs.semantic-release.outputs.engine_commit }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the published engine commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.engine_commit }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Write the protected-main engine release receipt
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "${ENGINE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: semantic-release returned an invalid tag: ${ENGINE_TAG}" >&2
            exit 1
          fi
          git fetch --force origin main "refs/tags/${ENGINE_TAG}:refs/tags/${ENGINE_TAG}"
          tag_commit="$(git rev-parse --verify "${ENGINE_TAG}^{commit}")"
          current_main="$(git rev-parse --verify origin/main)"
          if [ "${tag_commit}" != "${ENGINE_COMMIT}" ] || \
             [ "${ENGINE_COMMIT}" != "${current_main}" ]; then
            echo "error: engine tag, semantic-release output, and current main differ" >&2
            exit 1
          fi
          parent_commit="$(git rev-parse --verify "${ENGINE_COMMIT}^")"
          if [ "${parent_commit}" != "${GITHUB_SHA}" ]; then
            echo "error: release parent ${parent_commit} is not dispatched main ${GITHUB_SHA}" >&2
            exit 1
          fi
          gh release view "${ENGINE_TAG}" \
            --json databaseId,isDraft,isPrerelease,publishedAt,tagName,url \
            > engine-release.json
          mkdir engine-assets
          gh release download "${ENGINE_TAG}" --dir engine-assets \
            --pattern '*.whl' \
            --pattern '*.tar.gz'
          python scripts/native_release.py write-engine-provenance \
            --output openadapt-desktop-engine-release-provenance.json \
            --directory engine-assets \
            --release engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${ENGINE_TAG}" \
            --engine-commit "${ENGINE_COMMIT}" \
            --workflow-ref "${WORKFLOW_REF}" \
            --workflow-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --runner-environment "${RUNNER_ENVIRONMENT}"

      - name: Attest the engine release receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: openadapt-desktop-engine-release-provenance.json

      - name: Publish and reverify the engine release receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=openadapt-desktop-engine-release-provenance.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          gh attestation verify "${receipt}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners
          mkdir remote-engine
          gh release view "${ENGINE_TAG}" --json assets --jq '.assets[].name' \
            > engine-release-assets.txt
          if grep -qxF "${receipt}" engine-release-assets.txt; then
            gh release download "${ENGINE_TAG}" --dir remote-engine \
              --pattern '*.whl' \
              --pattern '*.tar.gz' \
              --pattern 'openadapt-desktop-engine-release-provenance.json'
          else
            gh release upload "${ENGINE_TAG}" "${receipt}"
            gh release download "${ENGINE_TAG}" --dir remote-engine \
              --pattern '*.whl' \
              --pattern '*.tar.gz' \
              --pattern 'openadapt-desktop-engine-release-provenance.json'
            cmp "${receipt}" "remote-engine/${receipt}"
          fi
          gh attestation verify "remote-engine/${receipt}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --deny-self-hosted-runners
          python scripts/native_release.py validate-engine-provenance \
            --file "remote-engine/${receipt}" \
            --directory remote-engine \
            --release engine-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --engine-tag "${ENGINE_TAG}" \
            --engine-commit "${ENGINE_COMMIT}"

  publish-existing-ref:
    name: Recover PyPI publication for an existing green ref
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish-existing-ref' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout requested publication ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: target

      - name: Checkout current protected-main release guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: guard

      - name: Resolve and authorize requested ref
        id: target
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${target_sha}" origin/main; then
            echo "Refusing to publish a ref that is not contained in protected main."
            exit 1
          fi
          echo "sha=${target_sha}" >> "${GITHUB_OUTPUT}"

      - name: Require successful exact-target Test and Build workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in test.yml build.yml; do
            response="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                --raw-field head_sha="${TARGET_SHA}" \
                --raw-field event=push \
                --raw-field per_page=20
            )"
            status="$(
              printf '%s' "${response}" |
                jq -r --arg sha "${TARGET_SHA}" \
                  '[.workflow_runs[] | select(.head_sha == $sha)]
                   | sort_by(.created_at) | last | .status // "missing"'
            )"
            conclusion="$(
              printf '%s' "${response}" |
                jq -r --arg sha "${TARGET_SHA}" \
                  '[.workflow_runs[] | select(.head_sha == $sha)]
                   | sort_by(.created_at) | last | .conclusion // "pending"'
            )"
            if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
              echo "Refusing to publish ${TARGET_SHA}: ${workflow} is ${status}/${conclusion}."
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build and validate exact recovery artifacts
        working-directory: target
        run: |
          rm -rf dist
          uv build --wheel --sdist
          python scripts/check_release_consistency.py --require-dist

      - name: Independently validate recovery artifacts with the current main guard
        run: |
          python guard/scripts/verify_build_artifact.py python-distribution --root target
          python guard/scripts/check_source_boundary.py --root target --require-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: target/dist/
