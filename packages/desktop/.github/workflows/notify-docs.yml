name: Notify docs
on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
  release:
    types: [published]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # v4.0.1 currently sends an invalid content-length through Node 24 for
      # this repository_dispatch payload. Keep the last proven v3 SHA until
      # upstream ships a working v4 release; this job is push-only, so PR CI
      # cannot exercise it.
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: OpenAdaptAI/openadapt-ops
          event-type: repo-updated
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
