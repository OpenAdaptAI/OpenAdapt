[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-eligibility"
version = "0.1.0"
description = "Optional 270/271 healthcare payer eligibility connector for OpenAdapt Flow"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "openadapt-flow>=4.0.0,<5",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openadapt_eligibility"]

[tool.uv]
# openadapt-types reaches this project only through openadapt-flow, so the
# path source below did not apply to it and the lock took openadapt-types
# from PyPI. Flow 4.0.0 needs openadapt-types 0.24.1, which PyPI does not
# serve until it releases. The override makes openadapt-types a requirement
# of this project, so the lock takes the in-tree copy, like Flow's.
# Keep its range equal to Flow's openadapt-types range; when Flow moves to
# 0.25, this must move with it or the lock won't resolve.
override-dependencies = [
    "openadapt-types>=0.24.0,<0.25.0",
]

[tool.uv.sources]
openadapt-flow = { path = "../../flow", editable = true }
openadapt-types = { path = "../../types", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
