[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-eligibility"
version = "0.1.0"
description = "Optional 270/271 healthcare payer eligibility connector for OpenAdapt Flow"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openadapt-flow>=3.4.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "cryptography>=41.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openadapt_eligibility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
