[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-eligibility"
version = "0.1.0"
description = "Optional 270/271 healthcare payer eligibility connector for OpenAdapt Flow"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "openadapt-flow>=3.4.0,<4",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openadapt_eligibility"]

[tool.uv.sources]
openadapt-flow = { path = "../../flow", editable = true }
openadapt-types = { path = "../../types", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
