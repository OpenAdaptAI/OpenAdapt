[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-agent"
version = "2.0.2"
description = "Local agent bridge for governed OpenAdapt workflows, attended actions, MCP, and Agent Skills"
readme = "README.md"
# openadapt-flow pins <3.13 (rapidocr-onnxruntime); this package inherits it.
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
    {name = "Richard Abrich", email = "richard@openadapt.ai"}
]
maintainers = [
    {name = "OpenAdaptAI", email = "contact@openadapt.ai"}
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp", "agent-skills", "gui", "automation", "workflow", "openadapt", "governed"]

dependencies = [
    # Governed workflow compiler/runtime this package bridges. Execution
    # shells out to its CLI; bundle metadata loads via its IR.
    # FLOOR IS LOAD-BEARING. `reject`, its `rejected_by_operator` disposition,
    # and the `decided_by` provenance keyword are named symbols that only exist
    # from 1.26.0. A resolver satisfied by 1.25.x fails at CALL time, inside the
    # attended decision path, with a TypeError rather than at resolve. Raise
    # this with every new symbol taken from Flow's attended contract.
    "openadapt-flow>=1.26.0,<2",
    # Flow uses cryptography for encrypted bundles and signed runtime evidence.
    # Keep the published Agent artifact above the PKCS#7 oracle fixed by 50.0.0
    # (GHSA-g6cj-pr64-35w5), even when an existing environment already has an
    # older version that still satisfies Flow's transitive requirement.
    "cryptography>=50.0.0",
    # Official Model Context Protocol SDK (stdio server transport).
    "mcp>=1.28,<2",
    # Structured concurrency runtime the mcp SDK already uses; we call
    # anyio.run / to_thread directly.
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
openadapt-agent = "openadapt_agent.cli:main"

[project.urls]
Homepage = "https://github.com/OpenAdaptAI/openadapt-agent"
Repository = "https://github.com/OpenAdaptAI/openadapt-agent"
Documentation = "https://github.com/OpenAdaptAI/openadapt-agent#readme"
"Bug Tracker" = "https://github.com/OpenAdaptAI/openadapt-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openadapt_agent"]
# Keep release metadata compatible with the current PyPI validation toolchain.
# Hatchling 1.32 changed its default to Core Metadata 2.5 before Twine's
# packaging dependency accepted that version.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin Ruff's historical default gate so future releases cannot silently expand
# the CI policy and fail unchanged code.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
