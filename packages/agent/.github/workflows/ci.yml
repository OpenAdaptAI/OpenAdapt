name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cover both dependency edges without doubling the hosted matrix.
          - python-version: "3.10"
            dependency-set: floor
          - python-version: "3.11"
            dependency-set: current
          - python-version: "3.12"
            dependency-set: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.dependency-set == 'floor'
      - name: Verify lock consistency
        if: matrix.dependency-set == 'floor'
        run: uv lock --locked
      - name: Install dependency floors
        if: matrix.dependency-set == 'floor'
        run: >-
          pip install -e ".[dev]"
          "openadapt-flow==1.26.0"
          "mcp==1.28.0"
      - name: Install current allowed dependencies
        if: matrix.dependency-set == 'current'
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Build release artifacts
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Verify MIT package boundary
        if: matrix.python-version == '3.12'
        run: |
          python scripts/check_release_artifacts.py dist
          python scripts/check_dist.py dist/*
          python scripts/check_source_boundary.py --require-dist
