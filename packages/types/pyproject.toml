[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-types"
version = "0.22.0"
description = "Pydantic models for computer-use agents: screen state (ComputerState, UINode), actions (Action), and results (ActionResult)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "OpenAdapt", email = "admin@openadapt.ai" },
]
keywords = ["computer-use", "gui-automation", "schemas", "pydantic", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Compatibility shim: the contracts live in openadapt-flow as
# openadapt_flow.contracts. The release workflow pins this to the exact
# openadapt-flow version it ships with. Python 3.13+ resolves to 0.21.x, the
# last standalone release.
dependencies = [
    "openadapt-flow>=2.1.0,<3",
]

[project.scripts]
openadapt-vocab-lint = "openadapt_types.vocabulary.lint:main"

[project.urls]
Homepage = "https://github.com/OpenAdaptAI/OpenAdapt/tree/main/packages/types"
Repository = "https://github.com/OpenAdaptAI/OpenAdapt/tree/main/packages/types"
Issues = "https://github.com/OpenAdaptAI/OpenAdapt/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]



[tool.hatch.build.targets.wheel]
packages = ["openadapt_types"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release {version}"
major_on_zero = false
allow_zero_version = true
# Semantic Release changes only project metadata. Stamp that version into the
# existing editable lock entry without resolving dependencies, stage it in the
# generated release commit, and build exactly those reviewed inputs. The PSR
# action is a Docker action, so uv must be installed inside its container.
build_command = "python -m pip install uv==0.11.29 && python scripts/verify_release_lock.py --write && git add uv.lock && uv build"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
