name: Release and PyPI Publish

# Semantic release writes a version commit to protected main, so checkout and
# publication use the same organization release credential as openadapt-flow.

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install the locked release runtime
        run: uv sync --locked --extra release

      - name: Run the locked Python Semantic Release CLI
        id: release
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: >-
          uv run --locked --extra release
          python scripts/run_semantic_release.py

      - name: Verify release workspace
        if: steps.release.outputs.released == 'true'
        run: |
          uv lock --locked
          python scripts/check_release_consistency.py --require-dist
          python scripts/check_source_boundary.py --require-dist

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish to GitHub Releases
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.ADMIN_TOKEN }}
