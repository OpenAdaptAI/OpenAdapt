[project]
name = "openadapt-tray"
version = "0.3.0"
description = "Experimental status and launcher companion for OpenAdapt workflow authoring and governed repair"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MLDSAI Inc.", email = "richard@mldsai.com"}
]
keywords = ["gui", "system-tray", "menu-bar", "workflow-automation", "openadapt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pystray>=0.19.0",
    "Pillow>=12.3.0",
    "pynput>=1.7.0",
    "click>=8.3.3",
    "desktop-notifier>=6.2.0",
    "httpx>=0.27",
    "keyring>=24.0",
]

[project.optional-dependencies]
macos-native = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=9.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.10.0",
    "Pygments>=2.20.0",
    # Bounded on purpose. `ruff>=0.1.0` unpinned is a live hazard, not a
    # theoretical one: ruff 0.16.0 grew its DEFAULT rule set from 59 rules to
    # 413, this project selects no rules explicitly, and CI runs a blocking
    # `ruff check src tests scripts`. Only the 0.14.x pin in `uv.lock` was
    # keeping `main` green -- the next dependabot bump would have turned it red
    # with 216 findings and no code change. Raise the ceiling deliberately,
    # with the findings fixed in the same change.
    "ruff>=0.16,<0.17",
]
release = [
    "uv==0.11.32",
]
all = [
    "openadapt-tray[macos-native]",
]

[project.scripts]
openadapt-tray = "openadapt_tray.app:main"

[project.gui-scripts]
openadapt-tray-gui = "openadapt_tray.app:main"

[project.urls]
Homepage = "https://openadapt.ai"
Documentation = "https://docs.openadapt.ai"
Repository = "https://github.com/OpenAdaptAI/openadapt-tray"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openadapt_tray"]

[tool.ruff]
line-length = 88
target-version = "py310"

# No `select` on purpose: this project keeps ruff's FULL default rule set.
# The residual after safe autofix was 91 findings in a 3.9k-line tree, which is
# small enough to read and judge one by one, so the coverage is worth keeping
# rather than trading away for a narrow `["E","F","I","W"]`. The ruff version
# is bounded above in `[project.optional-dependencies].dev`, so the default set
# can only change when a person raises that ceiling.
[tool.ruff.lint]
# BLE001 (blind `except Exception`) is the one rule in ruff 0.16's expanded
# defaults that is wrong for this codebase, so it is disabled deliberately
# rather than suppressed at 50-odd individual sites.
#
# The tray is almost nothing BUT boundaries to flaky, optional, platform-owned
# subsystems: pystray and pynput backends, Pillow decoders, the OS keychain via
# `keyring`, `desktop-notifier`/Cocoa, tkinter, zenity/kdialog, AppleScript via
# `osascript`, PowerShell, `winreg` and `ctypes.windll`. Every one of those
# handlers logs and degrades -- returns False, falls through to the next
# fallback, or keeps a daemon thread alive -- because a menu-bar app that dies
# when a notification daemon is missing is a worse product than one that keeps
# running without notifications.
#
# There is also nothing to narrow to. Those subsystems share no exception
# hierarchy, and several raise backend-specific errors that are not part of any
# published API. Enumerating them would silently reintroduce
# crash-on-first-surprise the next time a dependency added an exception type,
# which is a behaviour change, not a style change.
#
# Where a blind catch was hiding a real defect rather than guarding a boundary,
# the code was fixed instead (see `keychain.clear_ingest_token`,
# `NotificationManager._show_windows`, `IPCServer._accept_loop`).
ignore = ["BLE001"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/openadapt_tray/__init__.py:__version__"]
commit_message = "chore: release {version}"
# Keep Experimental releases pre-1.0 until API stability is declared.
allow_zero_version = true
major_on_zero = false
build_command = """
python -m pip install --disable-pip-version-check "uv==0.11.32" &&
python scripts/check_release_consistency.py --write-lock &&
uv lock --locked --offline &&
git add uv.lock &&
uv build --wheel --sdist &&
python scripts/check_release_consistency.py --require-dist
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
