[project]
name = "openadapt-tray"
version = "0.1.0"
description = "Experimental status and launcher companion for OpenAdapt workflow authoring and governed repair"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MLDSAI Inc.", email = "richard@mldsai.com"}
]
keywords = ["gui", "system-tray", "menu-bar", "workflow-automation", "openadapt"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
    "pynput>=1.7.0",
    "click>=8.0.0",
    "desktop-notifier>=6.2.0",
    "httpx>=0.27",
    "keyring>=24.0",
]

[project.optional-dependencies]
macos-native = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]
release = [
    "uv==0.11.26",
]
all = [
    "openadapt-tray[macos-native]",
]

[project.scripts]
openadapt-tray = "openadapt_tray.app:main"

[project.gui-scripts]
openadapt-tray-gui = "openadapt_tray.app:main"

[project.urls]
Homepage = "https://openadapt.ai"
Documentation = "https://docs.openadapt.ai"
Repository = "https://github.com/OpenAdaptAI/openadapt-tray"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openadapt_tray"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/openadapt_tray/__init__.py:__version__"]
commit_message = "chore: release {version}"
# Keep Experimental releases pre-1.0 until API stability is declared.
allow_zero_version = true
major_on_zero = false
build_command = """
python -m pip install --disable-pip-version-check "uv==0.11.26" &&
python scripts/check_release_consistency.py --write-lock &&
uv lock --locked --offline &&
git add uv.lock &&
uv build --wheel --sdist &&
python scripts/check_release_consistency.py --require-dist
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
