[project]
name = "openadapt-capture"
version = "1.2.2"
description = "GUI interaction capture - platform-agnostic event streams with time-aligned media"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MLDSAI Inc.", email = "richard@openadapt.ai"}
]
keywords = ["gui", "automation", "capture", "events", "rpa"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "Pillow>=10.1.0",
    "fire>=0.7.1",
    "mss>=6.0.0",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    # Note: openai-whisper moved to optional [transcribe] extra due to Python version conflicts
    "pydantic-settings>=2.12.0",
    # Recording-pipeline dependencies (carried forward from OpenAdapt record.py)
    "sqlalchemy>=2.0.0",
    "alembic>=1.0.0",
    "loguru>=0.7.0",
    "psutil>=5.0.0",
    "pympler>=1.0.0",
    "tqdm>=4.0.0",
    "numpy>=1.26.0",
    # Recorder generates a performance plot by default, and the package-level
    # API imports the plotting module while exposing Recorder.
    "matplotlib>=3.10.8",
    # Native macOS window/accessibility observation via permissive PyObjC.
    "pyobjc-framework-ApplicationServices>=12.2.1; sys_platform == 'darwin'",
    # Native Windows structural observation. Platform-gated so non-Windows
    # installs and imports do not load the Windows UIA stack.
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    # Checked X11 metadata and XComposite named-window pixels on Linux.
    "xcffib>=1.8.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Whisper transcription - faster-whisper (recommended, 4x faster)
transcribe-fast = [
    "faster-whisper>=1.1.0",
]

# Legacy openai-whisper support
transcribe = [
    "openai-whisper>=20230314",
]

# Privacy scrubbing support
privacy = [
    "openadapt-privacy>=0.1.0",
]

# Sharing via Magic Wormhole
share = [
    "magic-wormhole>=0.17.0",
]

# Everything
all = [
    "openadapt-capture[transcribe-fast,transcribe,privacy,share]",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.1.0",
    "numpy>=1.21.0",
]

[project.scripts]
capture = "openadapt_capture.cli:main"

[project.urls]
Homepage = "https://github.com/OpenAdaptAI/openadapt-capture"
Repository = "https://github.com/OpenAdaptAI/openadapt-capture"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openadapt_capture"]
exclude = [
    "openadapt_capture/browser_bridge.py",
]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "openadapt_capture",
    "CHANGELOG.md",
    "SECURITY.md",
    "docs",
]
exclude = [
    "/openadapt_capture/browser_bridge.py",
    "/docs/images/demo.gif",
    "/docs/whisper-integration-plan.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow / integration (deselect with '-m \"not slow\"')",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release {version}"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]



[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "psutil>=7.2.2",
    # Test-only synthetic input driver; excluded from package metadata/runtime.
    "pynput>=1.7.6",
    "pytest>=9.0.2",
    # Repository-only Chrome-extension prototype tests. The bridge and this
    # dependency are not part of wheel or source-distribution runtime.
    "websockets>=12.0",
]
