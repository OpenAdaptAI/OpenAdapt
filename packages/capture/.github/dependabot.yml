# SOC 2: automated dependency updates (OA-C-23).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # CodeQL persists version-specific state between init and analyze.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
