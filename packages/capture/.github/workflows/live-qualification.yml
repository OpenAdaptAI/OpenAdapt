# Live interactive qualification of the native recorder.
#
# These three lanes were required release-gate jobs in
# production-qualification.yml until 2026-08-28. They moved here because they
# demand a physically qualified host and no such runner is registered, so the
# release gate they guarded could never be satisfied. All three qualification
# dispatches that have ever run (32522605613, 33110517548, 33111096982) ended
# with these three jobs cancelled after waiting for a runner that never
# appeared, one of them for 24 hours.
#
# What these lanes prove, and the release gate therefore no longer proves:
#
#   - global input injected through the operating system reaches the native
#     listeners and lands in the capture (hosted runners give a session where
#     injected events never reach low-level hooks: measured on
#     ubuntu-latest, macos-latest and windows-latest on 2026-08-28);
#   - the combined multiple-monitor virtual desktop, including a secondary
#     monitor with a negative origin (every hosted runner reports exactly one
#     monitor; Xvfb with two screens and +xinerama, and a RandR --setmonitor
#     split, both still report one to MSS);
#   - live window-scoped capture across real window movement and resize;
#   - live native structural observation through AX, UIA and AT-SPI;
#   - three counted trials of the above per operating system.
#
# Nothing runs here until a qualified runner exists. Register a runner with the
# labels each lane names, then set the repository variable
# CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS to "1". Until then the weekly schedule
# reports the lanes as not runnable instead of queueing a job for 24 hours
# against a runner that is not there.

name: Live qualification

on:
  schedule:
    # Monday 07:17 UTC.
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: capture-live-qualification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner-availability:
    name: Report live qualification runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: State whether the qualified lanes can run
        shell: bash
        env:
          QUALIFIED_RUNNERS: ${{ vars.CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS }}
        run: |
          set -euo pipefail
          if [ "${QUALIFIED_RUNNERS}" = "1" ]; then
            echo "CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS=1: the interactive lanes run."
            exit 0
          fi
          echo "CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS is not \"1\"."
          echo "No openadapt-capture-qualified runner is declared, so the live"
          echo "interactive lanes are skipped. The release gate does not depend"
          echo "on them. See the comment at the top of this workflow for the"
          echo "list of properties that go unproven while they are skipped."

  build-candidate:
    name: Build candidate distributions
    if: vars.CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Build the candidate once
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --sdist
          python scripts/verify_distribution.py dist/*
          python scripts/check_source_boundary.py --require-dist
          (
            cd dist
            sha256sum -- *.whl *.tar.gz > SHA256SUMS
          )

      - name: Upload the exact candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  interactive-linux:
    name: Interactive qualification (Linux X64)
    if: vars.CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS == '1'
    needs: build-candidate
    runs-on: [self-hosted, Linux, X64, openadapt-capture-qualified]
    timeout-minutes: 35
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist

      - name: Install the exact wheel into an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="${RUNNER_TEMP}/capture-qualification-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          qualification_python="${qualification_root}/bin/python"
          candidate_wheels=(dist/*.whl)
          if [ "${#candidate_wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one candidate wheel."
            exit 1
          fi
          uv venv --clear --python 3.12 "${qualification_root}"
          uv pip install --python "${qualification_python}" \
            "${candidate_wheels[0]}[linux]" \
            pytest==9.1.1 pytest-timeout==2.4.0 pynput==1.8.2
          echo "QUALIFICATION_PYTHON=${qualification_python}" >> "${GITHUB_ENV}"

      - name: Require the reviewed external video tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > evidence/ffmpeg-version.txt
          ffprobe -version > evidence/ffprobe-version.txt

      - name: Require a stable multiple-monitor desktop
        shell: bash
        run: |
          set -euo pipefail
          "${QUALIFICATION_PYTHON}" scripts/check_display_topology.py \
            --minimum-monitors 2 \
            --output evidence/display-topology.json

      - name: Run three counted live recorder qualification trials
        shell: bash
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          for trial in 1 2 3; do
            echo "::group::Linux trial ${trial}"
            "${QUALIFICATION_PYTHON}" -m pytest \
              "${GITHUB_WORKSPACE}/tests/test_performance.py" \
              "${GITHUB_WORKSPACE}/tests/test_structural_observation.py" \
              -m slow -v --timeout=300 --import-mode=importlib \
              "--junitxml=${GITHUB_WORKSPACE}/evidence/trial-${trial}-linux.xml"
            echo "::endgroup::"
          done

      - name: Reject skipped or incomplete qualification trials
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            python scripts/check_junit_no_skips.py "evidence/trial-${trial}-linux.xml"
          done

      - name: Aggregate the counted trial evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aggregate_qualification_trials.py \
            --os linux \
            --candidate-sha "${GITHUB_SHA}" \
            --expected-trials 3 \
            evidence/trial-1-linux.xml \
            evidence/trial-2-linux.xml \
            evidence/trial-3-linux.xml \
            --output evidence/qualification-summary-linux.json

      - name: Upload interactive qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-interactive-linux-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  interactive-macos:
    name: Interactive qualification (macOS ARM64)
    if: vars.CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS == '1'
    needs: build-candidate
    runs-on: [self-hosted, macOS, ARM64, openadapt-capture-qualified]
    timeout-minutes: 35
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist

      - name: Install the exact wheel into an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="${RUNNER_TEMP}/capture-qualification-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          qualification_python="${qualification_root}/bin/python"
          uv venv --clear --python 3.12 "${qualification_root}"
          uv pip install --python "${qualification_python}" \
            dist/*.whl pytest==9.1.1 pytest-timeout==2.4.0 pynput==1.8.2
          echo "QUALIFICATION_PYTHON=${qualification_python}" >> "${GITHUB_ENV}"

      - name: Require the reviewed external video tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > evidence/ffmpeg-version.txt
          ffprobe -version > evidence/ffprobe-version.txt

      - name: Require a stable multiple-monitor desktop
        shell: bash
        run: |
          set -euo pipefail
          "${QUALIFICATION_PYTHON}" scripts/check_display_topology.py \
            --minimum-monitors 2 \
            --output evidence/display-topology.json

      - name: Run three counted live recorder and window qualification trials
        shell: bash
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          for trial in 1 2 3; do
            echo "::group::macOS trial ${trial}"
            "${QUALIFICATION_PYTHON}" -m pytest \
              "${GITHUB_WORKSPACE}/tests/test_performance.py" \
              "${GITHUB_WORKSPACE}/tests/test_structural_observation.py" \
              "${GITHUB_WORKSPACE}/tests/test_window_capture.py" \
              -m slow -v --timeout=300 --import-mode=importlib \
              "--junitxml=${GITHUB_WORKSPACE}/evidence/trial-${trial}-macos.xml"
            echo "::endgroup::"
          done

      - name: Reject skipped or incomplete qualification trials
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            python scripts/check_junit_no_skips.py "evidence/trial-${trial}-macos.xml"
          done

      - name: Aggregate the counted trial evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aggregate_qualification_trials.py \
            --os macos \
            --candidate-sha "${GITHUB_SHA}" \
            --expected-trials 3 \
            evidence/trial-1-macos.xml \
            evidence/trial-2-macos.xml \
            evidence/trial-3-macos.xml \
            --output evidence/qualification-summary-macos.json

      - name: Upload interactive qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-interactive-macos-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  interactive-windows:
    name: Interactive qualification (Windows X64)
    if: vars.CAPTURE_SELF_HOSTED_QUALIFIED_RUNNERS == '1'
    needs: build-candidate
    runs-on: [self-hosted, Windows, X64, openadapt-capture-qualified]
    timeout-minutes: 35
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist

      - name: Install the exact wheel into an isolated environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qualificationRoot = Join-Path $env:RUNNER_TEMP "capture-qualification-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          $qualificationPython = Join-Path $qualificationRoot "Scripts\python.exe"
          uv venv --clear --python 3.12 $qualificationRoot
          $wheel = (Get-ChildItem "dist\*.whl" -File -ErrorAction Stop).FullName
          if ($wheel.Count -ne 1) { throw "Expected exactly one candidate wheel." }
          uv pip install --python $qualificationPython $wheel `
            "pytest==9.1.1" "pytest-timeout==2.4.0" "pynput==1.8.2"
          "QUALIFICATION_PYTHON=$qualificationPython" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require the reviewed external video tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Get-Command ffmpeg -ErrorAction Stop | Out-Null
          Get-Command ffprobe -ErrorAction Stop | Out-Null
          ffmpeg -version | Out-File evidence/ffmpeg-version.txt -Encoding utf8
          ffprobe -version | Out-File evidence/ffprobe-version.txt -Encoding utf8

      - name: Require a stable multiple-monitor desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:QUALIFICATION_PYTHON scripts/check_display_topology.py `
            --minimum-monitors 2 `
            --output evidence/display-topology.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run three counted live recorder and window qualification trials
        shell: pwsh
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:RUNNER_TEMP
          try {
            foreach ($trial in 1..3) {
              Write-Host "::group::Windows trial $trial"
              & $env:QUALIFICATION_PYTHON -m pytest `
                "$env:GITHUB_WORKSPACE/tests/test_performance.py" `
                "$env:GITHUB_WORKSPACE/tests/test_structural_observation.py" `
                "$env:GITHUB_WORKSPACE/tests/test_window_capture.py" `
                -m slow -v --timeout=300 --import-mode=importlib `
                "--junitxml=$env:GITHUB_WORKSPACE/evidence/trial-$trial-windows.xml"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Write-Host "::endgroup::"
            }
          } finally {
            Pop-Location
          }

      - name: Reject skipped or incomplete qualification trials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($trial in 1..3) {
            python scripts/check_junit_no_skips.py "evidence/trial-$trial-windows.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Aggregate the counted trial evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/aggregate_qualification_trials.py `
            --os windows `
            --candidate-sha $env:GITHUB_SHA `
            --expected-trials 3 `
            evidence/trial-1-windows.xml `
            evidence/trial-2-windows.xml `
            evidence/trial-3-windows.xml `
            --output evidence/qualification-summary-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload interactive qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-interactive-windows-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
