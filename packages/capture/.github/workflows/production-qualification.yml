# Production qualification: the exact-commit evidence a release requires.
#
# Every job here runs on a GitHub-hosted runner. openadapt-capture is public,
# so those runners are free and always available.
#
# The physical-desktop lanes live in live-qualification.yml. The release
# orchestrator requires its exact-SHA Linux lane in addition to this hosted
# workflow. Scheduled live runs maintain the macOS and Windows evidence.
#
# The live lanes prove:
#
#   - that global input injected through the operating system reaches the
#     native listeners and is written into the capture;
#   - the combined multiple-monitor virtual desktop and its coordinate
#     translation, including a secondary monitor with a negative origin;
#   - live window-scoped capture across real window movement and resize;
#   - live native structural observation through AX, UIA and AT-SPI.
#
# Each of those needs a physical desktop session with two monitors and real
# input permissions. Measured on 2026-08-28, every GitHub-hosted runner
# reports exactly one monitor (Xvfb with two screens and +xinerama, and a RandR
# --setmonitor split, both still report one to MSS), and injected input never
# reaches the native hooks on any of the three hosted operating systems.
#
# What this gate does prove, all of it against one exact commit:
#
#   - one wheel and one source archive build, validate, and respect the source
#     boundary;
#   - that exact wheel installs, imports, preserves the current Flow and Desktop
#     consumer API, installs and probes the pinned FFmpeg runtime, and
#     uninstalls on clean Linux, macOS, and Windows machines;
#   - the Linux wheel extra resolves with the host AT-SPI runtime and imports
#     its native provider;
#   - the real recorder starts against a real display on hosted macOS and
#     Windows, produces a real first frame, creates its capture database,
#     holds memory bounded, and shuts down cleanly, three counted trials per
#     operating system.
#
# scripts/check_release_ci.py additionally requires a successful test.yml run
# on the same exact commit, which is where the complete headless suite and the
# byte-for-byte synthetic fixture determinism check run.

name: Production qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character main commit SHA to qualify"
        type: string
        required: true

concurrency:
  group: capture-production-qualification-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build candidate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require the exact protected-main candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a lowercase 40-character Git commit SHA"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production qualification must be dispatched on protected main."
            exit 1
          fi
          if [ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Input candidate ${CANDIDATE_SHA} differs from dispatched commit ${GITHUB_SHA}."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Checkout does not match the dispatched commit."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Build the candidate once
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --sdist
          python scripts/verify_distribution.py dist/*
          python scripts/check_source_boundary.py --require-dist
          (
            cd dist
            sha256sum -- *.whl *.tar.gz > SHA256SUMS
          )

      - name: Upload the exact candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  clean-wheel:
    name: Clean candidate wheel (${{ matrix.os }})
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist

      - name: Install Linux AT-SPI build and runtime dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gir1.2-atspi-2.0 \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev

      - name: Run the clean install and uninstall lifecycle
        shell: bash
        run: |
          set -euo pipefail
          lifecycle_args=(--with-ffmpeg-runtime)
          if [ "${RUNNER_OS}" = "Linux" ]; then
            lifecycle_args+=(--with-linux-extra)
          fi
          python scripts/candidate_lifecycle.py \
            --dist dist \
            --manifest dist/SHA256SUMS \
            --candidate-sha "${GITHUB_SHA}" \
            --output "evidence/clean-${{ matrix.os }}.json" \
            "${lifecycle_args[@]}"

      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-clean-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14


  hosted-live-recorder:
    name: Hosted live recorder qualification (${{ matrix.os }})
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout the exact candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capture-candidate-${{ github.sha }}
          path: dist

      - name: Install the exact wheel into an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="${HOME}/capture-qualification-${GITHUB_RUN_ID}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            qualification_python="${qualification_root}/Scripts/python.exe"
            workspace="$(cygpath -u "${GITHUB_WORKSPACE}")"
          else
            qualification_python="${qualification_root}/bin/python"
            workspace="${GITHUB_WORKSPACE}"
          fi
          candidate_wheels=(dist/*.whl)
          if [ "${#candidate_wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one candidate wheel."
            exit 1
          fi
          uv venv --clear --python 3.12 "${qualification_root}"
          uv pip install --python "${qualification_python}" \
            "${candidate_wheels[0]}" \
            pytest==9.1.1 pytest-timeout==2.4.0 pynput==1.8.2
          echo "QUALIFICATION_PYTHON=${qualification_python}" >> "${GITHUB_ENV}"
          echo "QUALIFICATION_WORKSPACE=${workspace}" >> "${GITHUB_ENV}"

      - name: Install the reviewed external video tools
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          else
            brew install ffmpeg
          fi

      - name: Require the reviewed external video tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > evidence/ffmpeg-version.txt
          ffprobe -version > evidence/ffprobe-version.txt

      # A GitHub-hosted runner exposes exactly one virtual display. The
      # multiple-monitor contract is proven only by the self-hosted lanes in
      # live-qualification.yml. This step still records the exact topology the
      # trials ran against, and still fails on a topology that changes during
      # qualification.
      - name: Record a stable single-monitor desktop
        shell: bash
        run: |
          set -euo pipefail
          "${QUALIFICATION_PYTHON}" scripts/check_display_topology.py \
            --minimum-monitors 1 \
            --output evidence/display-topology.json

      # These four live tests drive the real recorder against the real display
      # of the hosted runner: they start it, wait for a real first frame, prove
      # the capture database is created, prove memory stays bounded, and prove
      # a clean shutdown. They are named one by one, and the trial evidence is
      # rejected below unless exactly four of them ran, so a rename or a
      # deletion fails the gate instead of silently shrinking it.
      #
      # The three input-injection tests of this file are deliberately NOT here.
      # Injected input does not reach the native low-level hooks in a hosted
      # runner session, measured on all three hosted operating systems on
      # 2026-08-28. live-qualification.yml runs them on a qualified host.
      # Three trials take under three minutes on a healthy runner, so the step
      # carries its own bound well under the job's. A step that stops making
      # progress reports a failure in twelve minutes instead of holding the
      # runner for the job's full thirty-five.
      - name: Run three counted live recorder trials
        timeout-minutes: 12
        shell: bash
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          set -euo pipefail
          cd "${HOME}"
          for trial in 1 2 3; do
            echo "::group::${RUNNER_OS} trial ${trial}"
            "${QUALIFICATION_PYTHON}" -m pytest \
              "${QUALIFICATION_WORKSPACE}/tests/test_performance.py" \
              -m slow -v --timeout=300 --import-mode=importlib \
              -k "test_initial_frame_ready_without_input or test_shutdown_time or test_memory_bounded or test_db_file_created" \
              "--junitxml=${QUALIFICATION_WORKSPACE}/evidence/trial-${trial}-${{ matrix.os }}.xml"
            echo "::endgroup::"
          done

      - name: Reject skipped, incomplete, or shrunken qualification trials
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            python scripts/check_junit_no_skips.py \
              --expected-tests 4 \
              "evidence/trial-${trial}-${{ matrix.os }}.xml"
          done

      - name: Aggregate the counted trial evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aggregate_qualification_trials.py \
            --os "${{ matrix.os }}" \
            --candidate-sha "${GITHUB_SHA}" \
            --expected-trials 3 \
            "evidence/trial-1-${{ matrix.os }}.xml" \
            "evidence/trial-2-${{ matrix.os }}.xml" \
            "evidence/trial-3-${{ matrix.os }}.xml" \
            --output "evidence/qualification-summary-${{ matrix.os }}.json"

      - name: Upload hosted live recorder evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-hosted-live-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
