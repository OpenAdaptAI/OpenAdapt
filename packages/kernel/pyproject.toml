[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-kernel"
version = "0.1.0"
description = "Minimal commit-boundary verification, macro-action staging, stepwise live-DOM healing, and shadow-to-autopilot kernel for GUI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "OpenAdapt", email = "admin@openadapt.ai" },
]
keywords = [
    "computer-use",
    "gui-agents",
    "verification",
    "commit-boundary",
    "browser-automation",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45.0"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
openadapt-kernel = "openadapt_kernel.cli:main"

[project.urls]
Homepage = "https://github.com/OpenAdaptAI/OpenAdapt/tree/main/packages/kernel"
Repository = "https://github.com/OpenAdaptAI/OpenAdapt/tree/main/packages/kernel"
Documentation = "https://github.com/OpenAdaptAI/OpenAdapt/blob/main/packages/kernel/README.md"
Changelog = "https://github.com/OpenAdaptAI/OpenAdapt/blob/main/packages/kernel/CHANGELOG.md"
Issues = "https://github.com/OpenAdaptAI/OpenAdapt/issues"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc"]
packages = ["src/openadapt_kernel"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "/src/openadapt_kernel/**/*.py",
    "/tests/*.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
