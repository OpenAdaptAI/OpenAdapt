[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openadapt-verify"
version = "0.2.0"
description = "Verify an agent's writes through an independent system-of-record read path"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
# Flow 3's base install is its verifier, ledger, journal and receipts without
# the vision stack (NumPy, OpenCV, Pillow, RapidOCR), which is Flow's `vision`
# extra. tests/test_import_boundary.py proves the verify path never imports it.
dependencies = [
    "openadapt-flow[receipts]>=3.0.0,<4",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
# Read paths. SQLite is in the standard library. PyMySQL is MIT-licensed. The
# PostgreSQL drivers whose session the verifier can make read-only (psycopg,
# psycopg2) are LGPL-3.0, so this package declares none: install psycopg
# yourself for a PostgreSQL read path.
mysql = ["PyMySQL>=1.1,<2"]
# Agent frameworks. Each extra is only that framework's SDK.
openai = ["openadapt-flow[openai-agents]>=3.0.0,<4"]
claude = ["openadapt-flow[claude-agent-sdk]>=3.0.0,<4"]
mcp = ["openadapt-flow[agent]>=3.0.0,<4"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "build>=1.2"]

[project.scripts]
openadapt-verify = "openadapt_verify.cli:main"

[project.urls]
Repository = "https://github.com/OpenAdaptAI/OpenAdapt/tree/main/packages/verify"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc"]
packages = ["src/openadapt_verify"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["/src/openadapt_verify/**/*.py", "/tests/*.py", "/scripts/*.py", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/openadapt_verify"]
ignore_missing_imports = true

[tool.uv]
# Lock generation only: the published metadata requires Flow 3, which is not
# on PyPI until its release. CI installs the in-tree Flow over this lock with
# --no-deps, so until then the lock resolves a published Flow 2.x. An override
# replaces every requirement on the package, extras included, so it names
# every Flow extra this package uses. Delete it when relocking after the
# Flow 3.0.0 release.
override-dependencies = [
    "openadapt-flow[receipts,agent,openai-agents,claude-agent-sdk]>=2.6.0,<4",
]
required-environments = [
    "python_version == '3.10' and sys_platform == 'linux'",
    "python_version == '3.10' and sys_platform == 'darwin'",
    "python_version == '3.10' and sys_platform == 'win32'",
]

